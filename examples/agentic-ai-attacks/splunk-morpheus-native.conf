# ==========================================================================================
# Morpheus-native variants: for estates running the kj299/Morpheus behavioral pipeline with the
# TA-morpheus-lineage app. These read fields the pipeline ALREADY emits (sourcetypes and field names
# taken from that app's savedsearches.conf) and add the agentic-intrusion rules on top of them.
# Same rule IDs as savedsearches.conf with an -M suffix; they collect into behavior_risk so the
# fork's own "Chain assembly - cross-layer risk" search picks them up.
# Status: needs_validation.
# ==========================================================================================

[R-D-AGT-001-M - Agent-shaped enumeration]
description = R-D-L7-005 conditions (from TC7HttpStage output) plus a non-browser user-agent family.
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
search = index=behavior_events sourcetype=morpheus:score:l7 window_complete=true http_distinct_paths>200 (http_distinct_paths_baseline_mature=false OR http_distinct_paths_ratio>=2) \
| where http_4xx_in_window > 0.7 * http_2xx_in_window AND NOT http_ua_family IN ("chrome","firefox","edge","safari") \
| stats max(http_distinct_paths) AS distinct_paths values(http_ua_family) AS ua_families values(dst_ip) AS dst_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY src_ip \
| eval rule_id = "R-D-AGT-001-M", risk_score = 55, osi_layer = 7, entity_key = src_ip \
| collect index=behavior_risk

[R-B-AGT-002-M - Regular cadence to a login or API service]
description = R-B-L3-002 regularity (flow_interval_cv < 0.15, mature) but WITHOUT the size condition, restricted to destinations on web/auth ports: an agent's paced requests vary in size, a beacon's do not. Joins to the l7 stream for the user-agent family.
enableSched            = 1
cron_schedule          = 11 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time   = @h
search = index=behavior_events sourcetype=morpheus:score:l3 window_complete=true flow_regularity_mature=true flow_interval_cv<0.15 dst_port IN (80,443,8080,8443) \
| stats earliest(_time) AS _time min(flow_interval_cv) AS interval_cv max(flow_intervals) AS intervals max(flow_mean_interval_ns) AS mean_interval_ns values(event_uid) AS event_uids BY src_ip dst_ip flow_pair_key \
| lookup agt_scheduled_clients.csv src AS src_ip OUTPUT reason AS allow_reason | where isnull(allow_reason) \
| eval rule_id = "R-B-AGT-002-M", risk_score = 40, osi_layer = 3, entity_key = src_ip, mean_interval_s = round(mean_interval_ns / 1000000000, 1) \
| collect index=behavior_risk

[R-B-AGT-005-M - Novel child of a web server process]
description = R-B-L7-004 process-ancestry novelty (endpoint_pair_novel from TC7EndpointStage) narrowed to web-server parents, at a higher risk score than the generic rule.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = index=behavior_events sourcetype=morpheus:score:l7 window_complete=true endpoint_pair_novel=true \
| where match(lower(parent_image_path), "(w3wp|httpd|nginx|php-cgi|php-fpm|apache2|tomcat|java|node)(\.exe)?$") \
| stats values(image_path) AS children values(parent_image_path) AS parents values(event_uid) AS event_uids earliest(_time) AS _time BY endpoint_host \
| eval rule_id = "R-B-AGT-005-M", risk_score = 70, osi_layer = 7, entity_key = endpoint_host \
| collect index=behavior_risk

[R-C-AGT-003-M - New TLS client then regular calls to an LLM API]
description = R-C-002's shape (new JA4, then regular traffic to the same destination within the hour) where the destination resolves to an LLM API in llm_api_domains.csv - a new piece of agent software on the host calling its model on a loop.
enableSched            = 1
cron_schedule          = 25 * * * *
dispatch.earliest_time = -2h@h
dispatch.latest_time   = @h
search = index=behavior_events sourcetype=morpheus:score:l6 window_complete=true ja4_client_first_seen=true sni=* \
| eval sni = lower(sni) | lookup llm_api_domains.csv llm_domain AS sni OUTPUT provider | where isnotnull(provider) \
| eval t_tls = _time | fields src_ip dst_ip sni provider ja4_client t_tls \
| join type=inner max=0 src_ip dst_ip [search index=behavior_events sourcetype=morpheus:score:l3 window_complete=true flow_regularity_mature=true flow_interval_cv<0.3 | eval t_flow = _time | fields src_ip dst_ip t_flow flow_interval_cv] \
| where t_flow >= t_tls AND t_flow <= t_tls + 3600 \
| stats min(t_tls) AS _time values(sni) AS llm_api values(ja4_client) AS new_ja4 min(flow_interval_cv) AS interval_cv BY src_ip \
| eval rule_id = "R-C-AGT-003-M", risk_score = 80, entity_key = src_ip \
| collect index=behavior_risk

# Field-name check before enabling (sni is assumed from the fork's TLS output; parent_image_path and image_path are the TC7EndpointStage defaults, tc7_endpoint_stage.py:201-202;
# Sysmon-1 schemas; confirm):  index=behavior_events sourcetype=morpheus:score:l6 | head 1 | fieldsummary
