id: 8c3425a8-df0b-56be-9f7b-b56827b40140
name: R-D-AGT-024 Agentic intrusion - Active Directory credential attacks
description: 'Four shapes FBI FLASH-20261113-001 and GTIG (2026-10-30) report from ARTEX operators inside a domain, from domain controller Security events: Kerberoasting (one account requesting RC4 service tickets, type 0x17, for ten or more services), user enumeration without pre-authentication (one address drawing client-not-found, status 0x6, for twenty or more names), DCSync (a replication right, 1131f6aa or 1131f6ad, exercised by an account that is not a machine account) and a write to msDS-AllowedToActOnBehalfOfOtherIdentity. The ticket and attribute fields are not columns of SecurityEvent, so they are read from EventData. A sync service such as Entra Connect legitimately replicates: add it to the approved list. Response to pre-approve for DCSync (the Splunk rule scores it 95): disable the account that replicated and isolate the host it replicated from (pack''s choice). Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: SecurityEvents
  dataTypes:
  - SecurityEvent
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
- Discovery
- PrivilegeEscalation
relevantTechniques:
- T1558
- T1589
- T1003
- T1134
query: |
  let approved = dynamic(["<SYNC_SERVICE_ACCOUNT>"]);
  SecurityEvent
  | where TimeGenerated > ago(15m)
  | where EventID in (4769, 4768, 4662, 5136)
  | extend Service = extract(@'Name="ServiceName">([^<]*)<', 1, EventData),
           Encryption = extract(@'Name="TicketEncryptionType">([^<]*)<', 1, EventData),
           KerberosStatus = extract(@'Name="Status">([^<]*)<', 1, EventData),
           Requester = extract(@'Name="TargetUserName">([^<]*)<', 1, EventData),
           ClientAddress = extract(@'Name="IpAddress">([^<]*)<', 1, EventData),
           Attribute = extract(@'Name="AttributeLDAPDisplayName">([^<]*)<', 1, EventData),
           ObjectDn = extract(@'Name="ObjectDN">([^<]*)<', 1, EventData)
  | extend Signal = case(
      EventID == 4769 and Encryption == "0x17" and Service !endswith "$" and Service !~ "krbtgt", "kerberoast",
      EventID == 4768 and KerberosStatus == "0x6", "user enumeration",
      EventID == 4662 and Properties matches regex @"(?i)1131f6a[ad]-9c07-11d1-f79f-00c04fc2dcd2" and SubjectUserName !endswith "$", "dcsync",
      EventID == 5136 and Attribute =~ "msDS-AllowedToActOnBehalfOfOtherIdentity", "delegation write",
      "")
  | where Signal != ""
  | extend Actor = tolower(case(Signal == "user enumeration", ClientAddress, Signal == "kerberoast", Requester, SubjectUserName)),
           Item = case(Signal == "kerberoast", Service, Signal == "user enumeration", Requester, Signal == "delegation write", ObjectDn, ObjectName)
  | where Actor !in (approved)
  | summarize DistinctItems = dcount(Item), Events = count(), Addresses = make_set(ClientAddress, 5), DomainControllers = make_set(Computer, 5),
              StartTime = min(TimeGenerated) by Signal, Actor
  | where (Signal == "kerberoast" and DistinctItems >= 10) or (Signal == "user enumeration" and DistinctItems >= 20) or Signal in ("dcsync", "delegation write")
  | extend DomainController = tostring(DomainControllers[0])
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Actor
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DomainController
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
