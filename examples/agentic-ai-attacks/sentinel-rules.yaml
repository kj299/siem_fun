id: 9beb03a6-a6d7-5759-8d04-b9ff193a3517
name: R-C-AGT-001 Agentic intrusion chain - recon, web execution, LLM egress
description: 'Ordered on one host (Morpheus R-C pattern): agent-shaped enumeration against it, then a novel web-server child within 2 h, then first LLM API contact from it within 24 h. Each step alone is
  explainable; the ordered sequence is not. Self-contained so it does not depend on the other rules having run. Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: ASimWebSession
  dataTypes: []
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
  - DeviceNetworkEvents
  - DeviceNetworkInfo
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
- Execution
- CommandAndControl
relevantTechniques:
- T1190
- T1505
- T1102
query: |
  let llm = dynamic(["api.deepseek.com","open.bigmodel.cn","api.x.ai","api.anthropic.com","xcai.pro","api.openai.com","generativelanguage.googleapis.com"]);
  let webParents = dynamic(["w3wp.exe","httpd.exe","httpd","nginx.exe","nginx","php-cgi.exe","php-fpm","apache2","tomcat9.exe","java.exe","java","node.exe","node"]);
  let ipmap = DeviceNetworkInfo
      | where TimeGenerated > ago(2d)
      | mv-expand Addr = IPAddresses
      | extend Ip = tostring(Addr.IPAddress)
      | distinct DeviceId, DeviceName, Ip;
  let recon = _Im_WebSession(starttime=ago(2d))
      | extend Path = tostring(parse_url(Url).Path), Status = toint(EventResultDetails)
      | summarize Paths = dcount(Path), Refusals = countif(Status between (400 .. 499)), Successes = countif(Status between (200 .. 299))
                by AttackerIp = SrcIpAddr, Ip = DstIpAddr, W = bin(TimeGenerated, 10m)
      | where Paths > 200 and Refusals > 0.7 * Successes
      | join kind=inner ipmap on Ip
      | summarize TRecon = min(W) by DeviceId, DeviceName, AttackerIp;
  let exec = DeviceProcessEvents
      | where TimeGenerated > ago(14d) and InitiatingProcessFileName in~ (webParents)
      | summarize TExec = min(TimeGenerated) by DeviceId, Parent = tolower(InitiatingProcessFileName), Child = tolower(FileName)
      | where TExec > ago(2d);
  let egress = DeviceNetworkEvents
      | where TimeGenerated > ago(14d) and isnotempty(RemoteUrl)
      | extend u = tolower(RemoteUrl)
      | extend Domain = iff(u has "://", tostring(parse_url(u).Host), tostring(split(u, "/")[0]))
      | where Domain in (llm)
      | summarize TEgress = min(TimeGenerated) by DeviceId, Domain
      | where TEgress > ago(2d);
  recon
  | join kind=inner exec on DeviceId
  | where TExec > TRecon and TExec <= TRecon + 2h
  | join kind=inner egress on DeviceId
  | where TEgress > TExec and TEgress <= TExec + 24h
  | summarize TRecon = min(TRecon), TExec = min(TExec), TEgress = min(TEgress), Children = make_set(Child), Domains = make_set(Domain)
            by DeviceName, AttackerIp
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: AttackerIp
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
