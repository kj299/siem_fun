id: cb7ec1d3-addd-530b-b57c-ea66bcd5193e
name: R-D-AGT-014 Agentic intrusion - ARTEX or CAIRN running on one of your hosts
description: 'Process or file evidence of an agent framework on a host you own: the artex binary, ARTEX_* configuration, the artx5v directory and artex-probe-* files (CrowdStrike, GTIG), Cairn''s worker
  token variable or worker image (oritera/Cairn; NorForge), or a pull or run of a trojanized or unofficial ARTEX Docker image such as tomicdd/artex (Badbyte via The Hacker News 2026-11-05; the backdoored
  build exposes an unauthenticated root shell). Also covers the /opt/artex/data/task/ working folder S-RM found on compromised hosts (2026-11-04) and the ScopeWeaver derivative (renamed binary, SCOPEWEAVER_LLM_*
  variables). Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
  - DeviceFileEvents
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- ResourceDevelopment
- Execution
relevantTechniques:
- T1588
- T1059
query: |
  let marks = dynamic(["SCOPEWEAVER_LLM_", "/opt/artex/", "ARTEX_LLM_BASE_URL", "ARTEX_PG_DSN", "artx5v", "artex-probe-", "TSEC_AGENT_TOKEN", "cairn-worker-container", "artex-local:"]);
  let images = dynamic(["tomicdd/artex", "congdonglinux/artex", "mianhuatang11/artex", "autumn26/artex", "andy1099zz/artex", "dgddw/artex", "ylh440104/artex"]);
  union
    (DeviceProcessEvents | where TimeGenerated > ago(15m)
       | where FileName in~ ("artex", "artex.exe", "scopeweaver", "scopeweaver.exe") or ProcessCommandLine has_any (marks) or ProcessCommandLine has_any (images)
       | project TimeGenerated, DeviceName, Evidence = ProcessCommandLine),
    (DeviceFileEvents | where TimeGenerated > ago(15m)
       | where FileName startswith "artex-probe-" or FolderPath contains "/opt/artex/data/task" or FileName startswith "scopeweaver" or FolderPath has @"\artx5v\" or FileName matches regex @"^artex-[0-9.]+-[a-z]+-[a-z0-9]+\.zip$"
            or (FileName =~ "mitmproxy-ca-cert.pem" and FolderPath has "_ca")
       | project TimeGenerated, DeviceName, Evidence = FolderPath)
  | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), Evidence = make_set(Evidence, 10) by DeviceName
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: AllEntities
