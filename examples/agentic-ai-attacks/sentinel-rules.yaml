id: b6f12b9e-bcf8-5d89-accc-e0411afd84cb
name: R-C-AGT-002 Agentic intrusion chain - spray to identity persistence
description: 'Ordered: a source sprays (>=10 principals, <=3 tries each), one sprayed principal then signs in successfully from that source within 1 h, and that principal performs an identity-plane write
  within 4 h. Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - SigninLogs
  - AuditLogs
queryFrequency: 1h
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
- Persistence
relevantTechniques:
- T1110
- T1098
query: |
  let fails = dynamic(["50126", "50053", "50055", "50057", "50034"]);
  let sprays = SigninLogs
      | where TimeGenerated > ago(1d) and ResultType in (fails)
      | extend UserPrincipalName = tolower(UserPrincipalName)
      | summarize Attempts = count(), TFirst = min(TimeGenerated) by IPAddress, UserPrincipalName, W = bin(TimeGenerated, 1h)
      | summarize Principals = dcount(UserPrincipalName), Worst = max(Attempts), TSpray = min(TFirst), Users = make_set(UserPrincipalName) by IPAddress, W
      | where Principals >= 10 and Worst <= 3
      | mv-expand UserPrincipalName = Users to typeof(string);
  let wins = SigninLogs
      | where TimeGenerated > ago(1d) and ResultType == "0"
      | project TSuccess = TimeGenerated, IPAddress, UserPrincipalName = tolower(UserPrincipalName);
  let writes = AuditLogs
      | where TimeGenerated > ago(1d)
      | where OperationName has_any ("Add service principal credentials", "Certificates and secrets management", "Add owner to application",
                                     "Add app role assignment to service principal", "Add member to role", "Consent to application")
      | project TWrite = TimeGenerated, UserPrincipalName = tolower(tostring(InitiatedBy.user.userPrincipalName)), OperationName,
                Target = tostring(TargetResources[0].displayName);
  sprays
  | join kind=inner wins on IPAddress, UserPrincipalName
  | where TSuccess > TSpray and TSuccess <= TSpray + 1h
  | join kind=inner writes on UserPrincipalName
  | where TWrite > TSuccess and TWrite <= TSuccess + 4h
  | summarize TSpray = min(TSpray), TSuccess = min(TSuccess), TWrite = min(TWrite), Operations = make_set(OperationName), Targets = make_set(Target)
            by UserPrincipalName, IPAddress
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
