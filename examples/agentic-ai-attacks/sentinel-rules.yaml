id: 5edde465-c5a5-522d-895c-33540a46fe71
name: R-D-AGT-028 Agentic intrusion - credential guessing at volume from one source
description: 'One source failing authentication 500 or more times in an hour against 20 or more accounts, on any service normalized by the ASIM authentication parsers (SSH, VPN, an admin panel, a portal). Amazon (2026-11-20): Cairn agents tested more than 30,000 credential combinations from about 80 real usernames against SSH, a storage device, a VPN and a portal. R-D-AGT-003 looks for the opposite shape, many accounts tried at most three times each, and does not fire on this one. Only wrong-user and wrong-password failures are counted, since an interrupted sign-in (a second factor still owed) also normalizes to a failure, and your own egress addresses should be listed. Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: SecurityEvents
  dataTypes:
  - SecurityEvent
- connectorId: AzureActiveDirectory
  dataTypes:
  - SigninLogs
queryFrequency: 15m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1110
query: |
  let egress = dynamic(["<YOUR_OWN_EGRESS_ADDRESS>"]);
  _Im_Authentication(starttime=ago(1h), eventresult='Failure')
  | where isnotempty(SrcIpAddr) and isnotempty(TargetUsername) and SrcIpAddr !in (egress)
  | where isempty(EventResultDetails) or EventResultDetails in ("No such user or password", "No such user", "Incorrect password")
  | summarize Attempts = count(), Accounts = dcount(TargetUsername), Services = dcount(TargetAppName), Apps = make_set(TargetAppName, 10),
              StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by SrcIpAddr
  | where Accounts >= 20 and Attempts >= 500
  | extend AttemptsPerAccount = Attempts / Accounts
