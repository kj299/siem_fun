id: 6a4d8c2d-67bb-50a0-8f2b-2cf463ae290b
name: R-D-AGT-018 Agentic intrusion - canary username then privileged login attempt
description: 'A failed login for a canary username (starts with zz, or contains nonexistent or not-a-user) followed within 60 seconds by a login attempt as admin, administrator or root from the same source against the same target, whether that attempt fails or succeeds: the agent baselines the error response before trying the real account (Unit 42 2026-10-30). The Sentinel side of the Splunk rule of the same number, on the ASIM authentication parser, so any normalized identity source is read. A successful admin login raises the alert to High, as it raises the Splunk risk score to 95. Response to pre-approve when an admin login succeeded: reset the administrator account that succeeded and revoke its sessions (pack''s choice). Reads 20 minutes every 15, as the Splunk rule does, so a pair that straddles two runs is still seen. H-AGT-018 is the 30-day hunt on Entra sign-ins. Status: needs_validation.'
