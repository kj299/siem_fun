id: eb09365d-9c62-500e-830e-080f6debfbd3
name: R-D-AGT-022 Agentic intrusion - AWS permission probing with DryRun
description: 'One principal drawing a DryRun or an unauthorized answer for five or more distinct EC2 API actions in fifteen minutes: the agent asking what a stolen key may do. FBI FLASH-20261113-001 (tested compromised IAM user permissions using DryRun flags); GTIG keys its own detection on GetCallerIdentity, counted here as context. A DryRun call that would have succeeded is logged with ErrorCode Client.DryRunOperation and one that would not with Client.UnauthorizedOperation, the code a refused real call also gets. Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: AWS
  dataTypes:
  - AWSCloudTrail
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Discovery
relevantTechniques:
- T1580
- T1087
query: |
  let approved = dynamic(["<AUTOMATION_ROLE_ARN>"]);
  AWSCloudTrail
  | where TimeGenerated > ago(15m)
  | where ErrorCode in ("Client.DryRunOperation", "Client.UnauthorizedOperation") or EventName == "GetCallerIdentity"
  | extend Actor = coalesce(SessionIssuerArn, UserIdentityArn)
  | where Actor !in (approved)
  | summarize DryRunActions = dcountif(EventName, ErrorCode startswith "Client."), Actions = make_set_if(EventName, ErrorCode startswith "Client.", 20),
              IdentityChecks = countif(EventName == "GetCallerIdentity"), UserAgents = make_set(UserAgent, 5),
              SourceIpAddress = take_any(SourceIpAddress), StartTime = min(TimeGenerated) by Actor
  | where DryRunActions >= 5
