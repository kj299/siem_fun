id: 287fc3f5-1549-56f8-bc13-971fe06ec31e
name: R-D-AGT-009 Agentic intrusion - AWS control-plane execution and key creation
description: 'SSM SendCommand/StartSession, Lambda code change, or new access key/user/role/inline policy by a principal not on the approved automation list. CERT-In CIAD-2026-0058 (CRAFTY FALCON). Status:
  needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AWS
  dataTypes:
  - AWSCloudTrail
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Execution
- Persistence
relevantTechniques:
- T1651
- T1098
- T1136
query: |
  let approved = dynamic(["<AUTOMATION_ROLE_ARN>"]);
  AWSCloudTrail
  | where TimeGenerated > ago(15m)
  | where EventName in ("SendCommand", "StartSession", "CreateAccessKey", "CreateUser", "CreateLoginProfile",
                        "AttachUserPolicy", "PutRolePolicy", "PutUserPolicy", "CreateRole")
       or EventName startswith "UpdateFunctionCode"
  | extend Actor = coalesce(SessionIssuerArn, UserIdentityArn)
