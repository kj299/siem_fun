id: 79fb54d5-0fad-547d-b670-0a661e1db69e
name: R-D-AGT-020 Agentic intrusion - one source signing in as many service principals
description: 'One address authenticating to three or more Entra service principals, or producing invalid or expired client-secret failures (AADSTS7000215, AADSTS7000222) and a success: the shape of the ARTEX exposed-secrets campaign (Microsoft Threat Intelligence 2026-11-05; GitHub scan to Key Vault exfiltration in about five minutes). The Sentinel side of the Splunk rule of the same number. Reads one hour every 15 minutes, as the Splunk rule does, so a source that keeps going is reported again. The error number is read from the result type and the result signature, as hunt H-AGT-022 does, because Microsoft''s references disagree on which carries it. A failure followed by a success raises the alert to High. Response to pre-approve: block the source in Conditional Access for workload identities. Microsoft (2026-11-25): "use Conditional Access for workload identities to block sign-ins from unexpected locations or with elevated risk"; Microsoft (2026-11-05) did so for 199.19.77[.]84, "assigned directly to service principals, and in a user-scoped block policy to cover replayed sessions", and notes that workload identity policies "require Workload ID Premium licensing". Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - AADServicePrincipalSignInLogs
queryFrequency: 15m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
- CredentialAccess
relevantTechniques:
- T1078
- T1555
query: |
  AADServicePrincipalSignInLogs
  | where TimeGenerated > ago(1h)
  | where isnotempty(IPAddress) and isnotempty(ServicePrincipalId)
  | extend Ok = ResultType in ("0", "Success")
  | summarize ServicePrincipals = dcount(ServicePrincipalId), Attempts = count(),
              InvalidSecret = countif(ResultType in ("7000215", "7000222") or ResultSignature in ("7000215", "7000222")), Successes = countif(Ok),
              FirstFailure = minif(TimeGenerated, not(Ok)), FirstSuccess = minif(TimeGenerated, Ok), Apps = make_set(ServicePrincipalName, 10) by IPAddress
  | where ServicePrincipals >= 3 or (InvalidSecret > 0 and Successes > 0)
  | extend FailureThenSuccess = isnotnull(FirstFailure) and isnotnull(FirstSuccess) and FirstSuccess > FirstFailure
  | extend Severity = iff(FailureThenSuccess, "High", "Medium")
entityMappings:
