id: b412e20c-2177-55d1-b340-5d19986bacd9
name: R-D-AGT-027 Agentic intrusion - account takeover burst or agent-named account
description: 'One actor resetting the passwords of five or more users in fifteen minutes, or a user created with the agent''s own marker in its name. GTIG (2026-10-30): the operators gained persistence through account takeover (resetting passwords for identified users) and by creating accounts that included ArtexProbe in the naming convention. The pentest-probe account names of the Bitrise incident and the i<N>probe resource name of the Barracuda incident (both as compiled in Wiz''s Black October list), and the i<N>canary account name Wiz (2026-11-25) gives for Bitrise, are matched as markers too. Entra audit activities Reset password (by admin) and Add user. This reads the Entra directory; the Splunk rule of the same number reads on-premises domain controllers. A help desk resets passwords all day, and a tenant with self-service reset may record those under a service identity: look at who the actor is in your own AuditLogs and add those to the approved list. Response to pre-approve for a marked account (the Splunk rule scores it 90): disable the account created with the marker and the account that created it (pack''s choice). Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - AuditLogs
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- Impact
relevantTechniques:
- T1098
- T1136
- T1531
query: |
  let approved = dynamic(["<HELP_DESK_ACCOUNT>"]);
  AuditLogs
  | where TimeGenerated > ago(15m)
  | where OperationName in ("Reset password (by admin)", "Add user")
  | extend Actor = tolower(coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName))),
           Target = tolower(coalesce(tostring(TargetResources[0].userPrincipalName), tostring(TargetResources[0].displayName)))
  | extend Marked = OperationName == "Add user" and (Target contains "artexprobe" or Target matches regex @"^(i[0-9]{2,7}[-_]?(probe|canary)|pentest[-_]?prob)")
  | summarize AccountsReset = dcountif(Target, OperationName == "Reset password (by admin)"), MarkedAccounts = make_set_if(Target, Marked, 10),
              StartTime = min(TimeGenerated) by Actor
  | where array_length(MarkedAccounts) > 0 or (AccountsReset >= 5 and Actor !in (approved))
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: Actor
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: AllEntities
