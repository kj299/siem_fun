# Microsoft Sentinel scheduled analytics rules for agentic-intrusion detection, one YAML document per rule
# (Azure-Sentinel repository format). Split on '---' to import individually. Status: needs_validation.
# Design notes and the ATT&CK mapping: splunk-sentinel-query-builder/references/agentic-ai-attacks.md
---
id: a980ff17-6532-5146-9b46-2078a4a861ca
name: R-B-AGT-002 Agentic intrusion - machine-regular request cadence
description: 'Requests from one client to one destination arriving at a regular interval: coefficient of variation of the gaps < 0.15 over >= 12 gaps in 24 h (Morpheus ArrivalRegularityTracker / R-B-L3-002
  thresholds). Catches the self-throttled agent a rate rule misses. Allow-list your monitors. Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: ASimWebSession
  dataTypes: []
- connectorId: AzureActiveDirectory
  dataTypes:
  - SigninLogs
queryFrequency: 1h
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
- Reconnaissance
- CredentialAccess
relevantTechniques:
- T1595
- T1110
query: |
  let allow = dynamic(["<UPTIME_MONITOR_IP>", "<VULN_SCANNER_IP>"]);
  union
    (_Im_WebSession(starttime=ago(1d)) | project TimeGenerated, Src = SrcIpAddr, Dst = coalesce(DstHostname, DstIpAddr), Kind = "web"),
    (SigninLogs | where TimeGenerated > ago(1d) | project TimeGenerated, Src = IPAddress, Dst = AppDisplayName, Kind = "signin")
  | where isnotempty(Src) and Src !in (allow)
  | sort by Src asc, Dst asc, Kind asc, TimeGenerated asc
  | extend Gap = iff(Src == prev(Src) and Dst == prev(Dst) and Kind == prev(Kind), (TimeGenerated - prev(TimeGenerated)) / 1s, real(null))
  | where isnotnull(Gap)
  | summarize Intervals = count(), MeanGap = avg(Gap), SdGap = stdevp(Gap) by Src, Dst, Kind
  | extend IntervalCv = iff(MeanGap > 0, round(SdGap / MeanGap, 3), real(null))
  | where Intervals >= 12 and IntervalCv < 0.15
  | project Src, Dst, Kind, Intervals, MeanGapSeconds = round(MeanGap, 1), IntervalCv
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: Src
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
---
id: 77b6dbca-f0bf-5a92-b076-68ab18148b2c
name: R-B-AGT-004 Agentic intrusion - first LLM API contact from a server
description: 'A server contacting an LLM API domain it has not contacted in 14 days, after >=7 days of history (ValueNoveltyTracker port, tc7_service inverted onto egress). These are legitimate services:
  the signal is the server, not the domain. Zscaler ThreatLabz 2026-10-14; CERT-In CIAD-2026-0058. Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceNetworkEvents
  - DeviceInfo
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
relevantTechniques:
- T1102
- T1071
query: |
  let llm = dynamic(["api.deepseek.com","open.bigmodel.cn","api.x.ai","api.anthropic.com","xcai.pro","api.openai.com","generativelanguage.googleapis.com"]);
  let recent = 1h;
  let servers = DeviceInfo
      | where TimeGenerated > ago(14d)
      | summarize arg_max(TimeGenerated, DeviceType), FirstSeen = min(TimeGenerated) by DeviceId, DeviceName
      | where DeviceType in ("Server", "DomainController") and FirstSeen <= ago(7d)
      | project DeviceId;
  DeviceNetworkEvents
  | where TimeGenerated > ago(14d) and isnotempty(RemoteUrl)
  | extend u = tolower(RemoteUrl)
  | extend Domain = iff(u has "://", tostring(parse_url(u).Host), tostring(split(u, "/")[0]))
  | where Domain in (llm)
  | summarize FirstContact = min(TimeGenerated), Connections = count(),
              Processes = make_set(InitiatingProcessFileName, 10), CommandLines = make_set(InitiatingProcessCommandLine, 5)
              by DeviceId, DeviceName, Domain
  | where FirstContact > ago(recent)
  | join kind=inner servers on DeviceId
  | project FirstContact, DeviceName, Domain, Connections, Processes, CommandLines
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
