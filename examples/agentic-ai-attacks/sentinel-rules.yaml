id: a5c1f958-ff46-5112-89fb-a543e637f219
name: R-B-AGT-005 Agentic intrusion - web server spawns a process it never has
description: 'A web-server process producing a child it has not produced on this host in 14 days, on a host with >=7 days of history (port of Morpheus R-B-L7-004 process-ancestry novelty). Webshell execution
  after agent-driven upload / SQLi / deserialization (NorForge via GridinSoft; CERT-In). Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- Execution
relevantTechniques:
- T1505
- T1059
query: |
  let webParents = dynamic(["w3wp.exe","httpd.exe","httpd","nginx.exe","nginx","php-cgi.exe","php-fpm","apache2","tomcat9.exe","java.exe","java","node.exe","node"]);
  let recent = 1h;
  let hostAge = DeviceProcessEvents
      | where TimeGenerated > ago(14d)
      | summarize HostFirstSeen = min(TimeGenerated) by DeviceId;
  DeviceProcessEvents
  | where TimeGenerated > ago(14d)
  | where InitiatingProcessFileName in~ (webParents)
  | summarize PairFirstSeen = min(TimeGenerated), Count = count(),
              CommandLines = make_set(ProcessCommandLine, 10), AccountName = any(AccountName)
              by DeviceId, DeviceName, Parent = tolower(InitiatingProcessFileName), Child = tolower(FileName)
  | where PairFirstSeen > ago(recent)
  | join kind=inner hostAge on DeviceId
  | where HostFirstSeen <= ago(7d)
  | project PairFirstSeen, DeviceName, Parent, Child, Count, AccountName, CommandLines
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
