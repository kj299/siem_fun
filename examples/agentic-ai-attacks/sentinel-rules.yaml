id: de84db79-1ddc-5ffc-813e-fe76af53188d
name: R-B-AGT-008 Agentic intrusion - identity control-plane writes beyond the actor envelope
description: 'A principal adding app/SP credentials, owners, role assignments or consents more than 5x its own 14-day daily 99th percentile, or at all when not on the approved list (tc7_saas envelope port).
  Storm-0940 agents added application credentials for persistence (Microsoft via CSA 2026-10-28). Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - AuditLogs
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- PrivilegeEscalation
relevantTechniques:
- T1098
- T1078
query: |
  let approved = dynamic(["<AUTOMATION_IDENTITY>"]);
  let ops = dynamic(["Add service principal credentials", "Certificates and secrets management", "Add owner to application",
                     "Add owner to service principal", "Add app role assignment to service principal", "Add member to role", "Consent to application"]);
  let writes = AuditLogs
      | where TimeGenerated > ago(14d)
      | where OperationName in (ops)
      | extend Actor = tolower(coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName))),
               Target = tostring(TargetResources[0].displayName), TargetId = tostring(TargetResources[0].id);
  let envelope = writes
      | where TimeGenerated < ago(1d)
      | summarize Daily = count() by Actor, OperationName, bin(TimeGenerated, 1d)
      | summarize P99Daily = percentile(Daily, 99), Days = dcount(TimeGenerated) by Actor, OperationName;
  writes
  | where TimeGenerated > ago(1d)
  | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), Count = count(), Targets = make_set(Target, 20), TargetIds = make_set(TargetId, 20) by Actor, OperationName
  | join kind=leftouter envelope on Actor, OperationName
  | extend Approved = Actor in (approved)
  | where not(Approved) or (coalesce(Days, 0) >= 7 and Count > 5 * coalesce(P99Daily, 0.0))
  | project StartTime, EndTime, Actor, OperationName, Count, P99Daily, Days, Approved, Targets, TargetIds
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: Actor
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
