id: eceb4f4f-d4c0-5663-a057-5032b8a58627
name: R-D-AGT-011 Agentic intrusion - agent framework user-agent inbound
description: 'A request carrying a user-agent compiled into ARTEX (artex-enrich/1.0, Mozilla/5.0 (spa-api-recon[ spider])), the Norma agent engine (norma/0.4), Hexstrike-AI, CyberStrikeAI or PentAGI. Read
  from the frameworks'' source; confirmed in the wild by AhnLab and Wiz. Operators can change these. Unit 42 (2026-10-30) adds two self-describing agent strings; WorkOS (2026-11-06) published three more
  ARTEX defaults (ArtEx/1.0, infra-hunt/1.0, verify-911-probe/1.0). Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: ASimWebSession
  dataTypes: []
