id: 6dcf7788-14ae-50f3-a2ff-ff2cae9e3371
name: R-D-AGT-023 Agentic intrusion - Azure credential-returning operations and Run Command
description: 'One caller using three or more distinct Azure operations that hand back credentials (storage account keys, App Service settings and publishing profile, AKS user credentials, Machine Learning connection and datastore secrets), or running a script on a VM with Run Command, or sweeping deployment validation as a permission test. Microsoft (2026-11-05) lists these as what the agents did with leaked application secrets; GTIG (2026-10-30) timed an 8-second deployments/validate sweep across 11 resource types. Operation names are from Microsoft''s resource provider reference and are compared case-insensitively, because the table stores them in upper case. Key Vault secret reads are data-plane and are not in this table: see hunt H-AGT-023. Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActivity
  dataTypes:
  - AzureActivity
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
- Execution
- Discovery
relevantTechniques:
- T1552
- T1651
- T1580
query: |
  let approved = dynamic(["<AUTOMATION_IDENTITY>"]);
  let credentialOps = dynamic(["microsoft.storage/storageaccounts/listkeys/action", "microsoft.web/sites/config/list/action",
                               "microsoft.web/sites/publishxml/action", "microsoft.containerservice/managedclusters/listclusterusercredential/action",
                               "microsoft.machinelearningservices/workspaces/connections/listsecrets/action",
                               "microsoft.machinelearningservices/workspaces/datastores/listsecrets/action"]);
  let runCommandOps = dynamic(["microsoft.compute/virtualmachines/runcommand/action",
                               "microsoft.compute/virtualmachinescalesets/virtualmachines/runcommand/action",
                               "microsoft.compute/virtualmachines/runcommands/write"]);
  AzureActivity
  | where TimeGenerated > ago(15m)
  | extend Op = tolower(OperationNameValue)
  | where Op in (credentialOps) or Op in (runCommandOps) or Op == "microsoft.resources/deployments/validate/action"
  | where Caller !in~ (approved)
  | summarize CredentialOps = dcountif(Op, Op in (credentialOps)), RunCommands = dcountif(CorrelationId, Op in (runCommandOps)),
              Validations = dcountif(CorrelationId, Op endswith "deployments/validate/action"), Operations = make_set(Op, 10),
              Resources = make_set(_ResourceId, 10), CallerIpAddress = take_any(CallerIpAddress), StartTime = min(TimeGenerated) by Caller
  | where CredentialOps >= 3 or RunCommands > 0 or Validations >= 8
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: Caller
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: CallerIpAddress
