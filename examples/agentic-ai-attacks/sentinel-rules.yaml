query: |
  let auth = _Im_Authentication(starttime=ago(20m))
      | where EventResult in ("Success", "Failure") and isnotempty(SrcIpAddr) and isnotempty(TargetUsername)
      | extend u = tolower(TargetUsername), Dst = coalesce(TargetAppName, Dvc);
  let canaries = auth
      | where EventResult == "Failure" and (u startswith "zz" or u contains "nonexistent" or u contains "not-a-user")
      | project CanaryTime = TimeGenerated, SrcIpAddr, Dst, CanaryUser = TargetUsername;
  auth
  | where u matches regex @"^(admin|administrator|root)(@|$)"
  | project AdminTime = TimeGenerated, SrcIpAddr, Dst, AdminUser = TargetUsername, AdminResult = EventResult
  | join kind=inner canaries on SrcIpAddr, Dst
  | where AdminTime >= CanaryTime and datetime_diff("second", AdminTime, CanaryTime) <= 60
  | summarize CanaryTime = min(CanaryTime), CanaryUsers = make_set(CanaryUser, 5), AdminUsers = make_set(AdminUser, 5),
              AdminSuccesses = countif(AdminResult == "Success") by SrcIpAddr, Dst
  | extend Severity = iff(AdminSuccesses > 0, "High", "Medium")
