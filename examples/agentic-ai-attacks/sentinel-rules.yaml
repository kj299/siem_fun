id: bdf69883-67b2-52c4-81f8-f6f69a287006
name: R-D-AGT-021 Agentic intrusion - AWS foothold and exfiltration preparation
description: 'A principal outside the approved list launching instances, creating or importing an SSH key pair, allocating an Elastic IP, creating or attaching a volume, or changing an instance profile. GTIG (2026-10-30) and FBI FLASH-20261113-001: ARTEX operators generated a key pair, allocated an Elastic IP, launched instances with high-value roles and created a 100 GB volume to stage data. Fires on two or more distinct actions of which at least one is a key pair, an Elastic IP or an instance-profile change: launches and volumes alone are what Auto Scaling, EKS node groups and batch services do all day. Refused launches and attachments, which is how GTIG''s attempts ended, are read by the hunt "An instance profile passed by a principal for the first time". Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: AWS
  dataTypes:
  - AWSCloudTrail
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- Collection
relevantTechniques:
- T1578
- T1098
- T1074
query: |
  let approved = dynamic(["<AUTOMATION_ROLE_ARN>"]);
  AWSCloudTrail
  | where TimeGenerated > ago(15m)
  | where EventName in ("RunInstances", "CreateKeyPair", "ImportKeyPair", "AllocateAddress", "CreateVolume", "AttachVolume",
                        "AssociateIamInstanceProfile", "ReplaceIamInstanceProfileAssociation")
  | where isempty(ErrorCode)
  | extend Actor = coalesce(SessionIssuerArn, UserIdentityArn), Request = parse_json(RequestParameters)
  | where Actor !in (approved)
  | extend InstanceProfile = coalesce(tostring(Request.iamInstanceProfile.arn), tostring(Request.iamInstanceProfile.name),
                                     tostring(Request.AssociateIamInstanceProfileRequest.IamInstanceProfile.Arn),
                                     tostring(Request.AssociateIamInstanceProfileRequest.IamInstanceProfile.Name)),
           VolumeGb = toint(tostring(Request.size)),
           Foothold = EventName in ("CreateKeyPair", "ImportKeyPair", "AllocateAddress", "AssociateIamInstanceProfile", "ReplaceIamInstanceProfileAssociation")
  | summarize DistinctActions = dcount(EventName), FootholdActions = countif(Foothold), Actions = make_set(EventName), InstanceProfiles = make_set_if(InstanceProfile, isnotempty(InstanceProfile), 5),
              LargestVolumeGb = max(VolumeGb), UserAgents = make_set(UserAgent, 5), SourceIpAddress = take_any(SourceIpAddress), StartTime = min(TimeGenerated) by Actor
  | where FootholdActions > 0 and DistinctActions >= 2
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: Actor
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIpAddress
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
