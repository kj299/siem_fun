id: de84db79-1ddc-5ffc-813e-fe76af53188d
name: R-B-AGT-008 Agentic intrusion - identity control-plane writes beyond the actor envelope
description: 'A principal adding app/SP credentials, owners, role assignments or consents more than 5x its own 14-day daily 99th percentile, or at all when not on the approved list (tc7_saas envelope port).
  Storm-0940 agents added application credentials for persistence (Microsoft via CSA 2026-10-28). Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - AuditLogs
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- PrivilegeEscalation
relevantTechniques:
- T1098
- T1078
query: |
  let approved = dynamic(["<AUTOMATION_IDENTITY>"]);
  let ops = dynamic(["Add service principal credentials", "Certificates and secrets management", "Add owner to application",
                     "Add owner to service principal", "Add app role assignment to service principal", "Add member to role", "Consent to application"]);
  let writes = AuditLogs
      | where TimeGenerated > ago(14d)
      | where OperationName has_any (ops)
      // has_any is a phrase match, so "Add member to role" also matches the Privileged Identity
      // Management activity names ("Add member to role completed (PIM activation)" ...). Those are
      // people activating their own eligible roles; left in, every activation alerts. The
      // directory may record the same activation a second time under the plain name, written by
      // the PIM service itself: look for that actor in your own AuditLogs and add it to `approved`.
      | where OperationName !has "PIM"
      | extend Actor = tolower(coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName))),
               Target = tostring(TargetResources[0].displayName), TargetId = tostring(TargetResources[0].id);
  let envelope = writes
      | where TimeGenerated < ago(1d)
      | summarize Daily = count() by Actor, OperationName, bin(TimeGenerated, 1d)
      | summarize P99Daily = percentile(Daily, 99), Days = dcount(TimeGenerated) by Actor, OperationName;
  writes
  | where TimeGenerated > ago(1d)
  | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), Count = count(), Targets = make_set(Target, 20), TargetIds = make_set(TargetId, 20) by Actor, OperationName
  | join kind=leftouter envelope on Actor, OperationName
  | extend Approved = Actor in (approved)
  | where not(Approved) or (coalesce(Days, 0) >= 7 and Count > 5 * coalesce(P99Daily, 0.0))
  | project StartTime, EndTime, Actor, OperationName, Count, P99Daily, Days, Approved, Targets, TargetIds
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: Actor
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
---
id: 9beb03a6-a6d7-5759-8d04-b9ff193a3517
name: R-C-AGT-001 Agentic intrusion chain - recon, web execution, LLM egress
description: 'Ordered on one host (Morpheus R-C pattern): agent-shaped enumeration against it, then a novel web-server child within 2 h, then first LLM API contact from it within 24 h. Each step alone is
  explainable; the ordered sequence is not. Self-contained so it does not depend on the other rules having run. Response to pre-approve: isolate the host. Microsoft (2026-11-25):
  "Enable automatic attack disruption to contain compromised assets that an attacker is using". Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: ASimWebSession
  dataTypes: []
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
  - DeviceNetworkEvents
  - DeviceNetworkInfo
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
- Execution
- CommandAndControl
relevantTechniques:
- T1190
- T1505
- T1102
query: |
  let llm = dynamic(["api.deepseek.com","open.bigmodel.cn","api.x.ai","api.anthropic.com","xcai.pro","api.openai.com","generativelanguage.googleapis.com"]);
  let webParents = dynamic(["w3wp.exe","httpd.exe","httpd","nginx.exe","nginx","php-cgi.exe","php-fpm","apache2","tomcat9.exe","java.exe","java","node.exe","node"]);
  let ipmap = DeviceNetworkInfo
      | where TimeGenerated > ago(2d)
      | mv-expand Addr = IPAddresses
      | extend Ip = tostring(Addr.IPAddress)
      | distinct DeviceId, DeviceName, Ip;
  let recon = _Im_WebSession(starttime=ago(2d))
      | extend Path = tostring(parse_url(Url).Path), Status = toint(EventResultDetails)
      | summarize Paths = dcount(Path), Refusals = countif(Status between (400 .. 499)), Successes = countif(Status between (200 .. 299))
                by AttackerIp = SrcIpAddr, Ip = DstIpAddr, W = bin(TimeGenerated, 10m)
      | where Paths > 200 and Refusals > 0.7 * Successes
      | join kind=inner ipmap on Ip
      | summarize TRecon = min(W) by DeviceId, DeviceName, AttackerIp;
  let exec = DeviceProcessEvents
      | where TimeGenerated > ago(14d) and InitiatingProcessFileName in~ (webParents)
      | summarize TExec = min(TimeGenerated) by DeviceId, Parent = tolower(InitiatingProcessFileName), Child = tolower(FileName)
      | where TExec > ago(2d);
  let egress = DeviceNetworkEvents
      | where TimeGenerated > ago(14d) and isnotempty(RemoteUrl)
      | extend u = tolower(RemoteUrl)
      | extend Domain = iff(u has "://", tostring(parse_url(u).Host), tostring(split(u, "/")[0]))
      | where Domain in (llm)
      | summarize TEgress = min(TimeGenerated) by DeviceId, Domain
      | where TEgress > ago(2d);
  recon
  | join kind=inner exec on DeviceId
  | where TExec > TRecon and TExec <= TRecon + 2h
  | join kind=inner egress on DeviceId
  | where TEgress > TExec and TEgress <= TExec + 24h
  | summarize TRecon = min(TRecon), TExec = min(TExec), TEgress = min(TEgress), Children = make_set(Child), Domains = make_set(Domain)
            by DeviceName, AttackerIp
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: AttackerIp
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
---
id: b6f12b9e-bcf8-5d89-accc-e0411afd84cb
name: R-C-AGT-002 Agentic intrusion chain - spray to identity persistence
description: 'Ordered: a source sprays (>=10 principals, <=3 tries each), one sprayed principal then signs in successfully from that source within 1 h, and that principal performs an identity-plane write
  within 4 h. Response to pre-approve: disable the user, revoke its sessions and undo the identity-plane write (pack''s choice). Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - SigninLogs
  - AuditLogs
queryFrequency: 1h
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
- Persistence
relevantTechniques:
- T1110
- T1098
query: |
  let fails = dynamic(["50126", "50053", "50055", "50057", "50034"]);
  let sprays = SigninLogs
      | where TimeGenerated > ago(1d) and ResultType in (fails)
      | extend UserPrincipalName = tolower(UserPrincipalName)
      | summarize Attempts = count(), TFirst = min(TimeGenerated) by IPAddress, UserPrincipalName, W = bin(TimeGenerated, 1h)
      | summarize Principals = dcount(UserPrincipalName), Worst = max(Attempts), TSpray = min(TFirst), Users = make_set(UserPrincipalName) by IPAddress, W
      | where Principals >= 10 and Worst <= 3
      | mv-expand UserPrincipalName = Users to typeof(string);
  let wins = SigninLogs
      | where TimeGenerated > ago(1d) and ResultType == "0"
      | project TSuccess = TimeGenerated, IPAddress, UserPrincipalName = tolower(UserPrincipalName);
  let writes = AuditLogs
      | where TimeGenerated > ago(1d)
      | where OperationName has_any ("Add service principal credentials", "Certificates and secrets management", "Add owner to application",
                                     "Add app role assignment to service principal", "Add member to role", "Consent to application")
      // Privileged Identity Management activations are deliberately kept here, unlike in
      // R-B-AGT-008: a sprayed account that then activates a privileged role is the chain.
      | project TWrite = TimeGenerated, UserPrincipalName = tolower(tostring(InitiatedBy.user.userPrincipalName)), OperationName,
                Target = tostring(TargetResources[0].displayName);
  sprays
  | join kind=inner wins on IPAddress, UserPrincipalName
  | where TSuccess > TSpray and TSuccess <= TSpray + 1h
  | join kind=inner writes on UserPrincipalName
  | where TWrite > TSuccess and TWrite <= TSuccess + 4h
  | summarize TSpray = min(TSpray), TSuccess = min(TSuccess), TWrite = min(TWrite), Operations = make_set(OperationName), Targets = make_set(Target)
            by UserPrincipalName, IPAddress
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT24H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
