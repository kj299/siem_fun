id: f970a3d3-22d7-5be5-91b8-0c08994c7835
name: R-D-AGT-006 Agentic intrusion - BLOODALCHEMY side-load
description: 'graphics-hook-filter64.dll / graphics-hook_config.bin, or svchost.exe outside the Windows system directories. VAPOR PANDA follow-on payload after ARTEX access (CrowdStrike via IT Brief UK
  2026-10-29). Response to pre-approve: isolate the host; CrowdStrike (2026-10-29): "Rotate signing keys, preauthentication keys, and service credentials after any suspected data
  exposure". Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceImageLoadEvents
  - DeviceFileEvents
  - DeviceProcessEvents
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
- Persistence
relevantTechniques:
- T1574
- T1036
query: |
  let files = dynamic(["graphics-hook-filter64.dll", "graphics-hook_config.bin"]);
  union
    (DeviceImageLoadEvents | where TimeGenerated > ago(15m) | where FileName in~ (files)
       | project TimeGenerated, DeviceName, Artifact = FileName, FolderPath, Loader = InitiatingProcessFolderPath, SHA256),
    (DeviceFileEvents | where TimeGenerated > ago(15m) | where FileName in~ (files)
       | project TimeGenerated, DeviceName, Artifact = FileName, FolderPath, Loader = InitiatingProcessFolderPath, SHA256),
    (DeviceProcessEvents | where TimeGenerated > ago(15m) | where FileName =~ "svchost.exe"
       | where not(FolderPath startswith @"C:\Windows\System32\" or FolderPath startswith @"C:\Windows\SysWOW64\" or FolderPath startswith @"C:\Windows\WinSxS\")
       | project TimeGenerated, DeviceName, Artifact = "svchost.exe outside system dirs", FolderPath, Loader = InitiatingProcessFolderPath, SHA256)
