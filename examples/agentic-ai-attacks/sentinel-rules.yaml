id: f970a3d3-22d7-5be5-91b8-0c08994c7835
name: R-D-AGT-006 Agentic intrusion - BLOODALCHEMY side-load
description: 'graphics-hook-filter64.dll / graphics-hook_config.bin, or svchost.exe outside the Windows system directories. VAPOR PANDA follow-on payload after ARTEX access (CrowdStrike via IT Brief UK
  2026-10-29). Status: needs_validation.'
