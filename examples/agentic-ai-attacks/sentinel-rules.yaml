id: 60cf6d51-f502-530d-bb85-8814464fec8a
name: R-D-AGT-001 Agentic intrusion - agent-shaped enumeration
description: 'One client requesting >200 distinct paths in 10 min, >0.7 client errors per success, non-browser user-agent family, a forged Chrome header (fewer than four version parts or no KHTML token,
  per Wiz), or <5% static assets, and >=2x its own busiest prior 10-min window (or <7 days history). Port of Morpheus R-D-L7-005 plus http_ua_family. ARTEX/CAIRN recon tempo (Zscaler ThreatLabz 2026-10-14).
  Status: needs_validation.'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: ASimWebSession
  dataTypes: []
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- Reconnaissance
- InitialAccess
relevantTechniques:
- T1595
- T1190
query: |
  let floor_paths = 200;
  let window = 10m;
  let recent = 1h;
  let staticRx = @"(?i)\.(css|js|png|jpe?g|gif|svg|woff2?|ico)$";
  let web = _Im_WebSession(starttime=ago(14d))
      | extend Path = tostring(parse_url(Url).Path), Status = toint(EventResultDetails)
      | extend UaFamily = case(HttpUserAgent contains "HeadlessChrome", "headless",
                               HttpUserAgent contains "Chrome/" and (not(HttpUserAgent matches regex @"Chrome/\d+\.\d+\.\d+\.\d+") or HttpUserAgent !contains "(KHTML, like Gecko)"), "forged-chrome",
                               HttpUserAgent startswith "Mozilla/" and HttpUserAgent matches regex @"(Edg|EdgA|Chrome|CriOS|Firefox|FxiOS|Safari)/", "browser",
                               HttpUserAgent startswith "Mozilla/", "mozilla",
                               isempty(HttpUserAgent), "none",
                               tolower(extract(@"^\s*([A-Za-z][A-Za-z0-9._+-]*)", 1, HttpUserAgent)));
  let baseline = web
      | where TimeGenerated < ago(recent)
      | summarize Paths = dcount(Path) by SrcIpAddr, bin(TimeGenerated, window)
      | summarize PeakPaths = max(Paths), BaselineDays = dcount(bin(TimeGenerated, 1d)) by SrcIpAddr;
  web
  | where TimeGenerated >= ago(recent)
  | summarize DistinctPaths = dcount(Path), Requests = count(),
              Refusals = countif(Status between (400 .. 499)), Successes = countif(Status between (200 .. 299)),
              StaticShare = round(todouble(countif(Path matches regex staticRx)) / count(), 3),
              UaFamilies = make_set(UaFamily, 10), Destinations = make_set(coalesce(DstHostname, DstIpAddr), 10)
              by SrcIpAddr, Window = bin(TimeGenerated, window)
  | where DistinctPaths > floor_paths and Refusals > 0.7 * Successes
  | where array_length(set_difference(UaFamilies, dynamic(["browser"]))) > 0 or StaticShare < 0.05
  | join kind=leftouter baseline on SrcIpAddr
  | extend BaselineMature = coalesce(BaselineDays, 0) >= 7
  | where not(BaselineMature) or DistinctPaths >= 2 * PeakPaths
  | project Window, SrcIpAddr, DistinctPaths, Requests, Refusals, Successes, StaticShare, UaFamilies, Destinations, PeakPaths, BaselineMature
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SrcIpAddr
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
