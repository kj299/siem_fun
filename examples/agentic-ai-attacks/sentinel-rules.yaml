id: 63ba72bf-e1db-5182-a61a-b45daff39a72
name: R-D-AGT-012 Agentic intrusion - verified IOC sweep (watchlist)
description: 'Network, file-hash and user-agent matches against the ArtexCairnIocs watchlist (169 network, hash, user-agent and app-ID indicators verified against CrowdStrike, Microsoft, Wiz, Zscaler, Kaspersky,
  AhnLab, NorForge, Gambit, PLURA/FSS, Unit 42, S-RM, Check Point Research and Nextron Valhalla, Okta, Expel, Microsoft 2026-11-05 (fetch-read), WorkOS (researcher instance)). The watchlist is shipped at
  examples/agentic-ai-attacks/lookups/sentinel_watchlist.csv (columns Ioc,IocType,Confidence,Context,Source); upload it as a Sentinel watchlist with alias ArtexCairnIocs and search key Ioc. Status: needs_validation.'
severity: High
status: Available
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceNetworkEvents
  - DeviceFileEvents
- connectorId: ASimWebSession
  dataTypes: []
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
- InitialAccess
relevantTechniques:
- T1071
- T1190
query: |
  let ioc = _GetWatchlist("ArtexCairnIocs") | project Ioc = tostring(SearchKey), IocType = tostring(IocType), Confidence = tostring(Confidence), Context = tostring(Context), Source = tostring(Source);
  let net = DeviceNetworkEvents
      | where TimeGenerated > ago(15m)
      | extend Host = replace_regex(tolower(tostring(split(replace_regex(tolower(RemoteUrl), @"^[a-z]+://", ""), "/")[0])), @"^www\.", "")
      | mv-expand Ioc = pack_array(Host, RemoteIP) to typeof(string)
      | project TimeGenerated, DeviceName, RemoteIP, RemoteUrl, Ioc, SeenIn = "network";
  let files = DeviceFileEvents
      | where TimeGenerated > ago(15m)
      | mv-expand Ioc = pack_array(tolower(SHA256), tolower(MD5)) to typeof(string)
      | project TimeGenerated, DeviceName, RemoteIP = "", RemoteUrl = FolderPath, Ioc, SeenIn = "file_hash";
  let web = _Im_WebSession(starttime=ago(15m))
      | project TimeGenerated, DeviceName = coalesce(DstHostname, DstIpAddr), RemoteIP = SrcIpAddr, RemoteUrl = Url, Ioc = HttpUserAgent, SeenIn = "user_agent";
  union net, files, web
  | where isnotempty(Ioc)
  | join kind=inner ioc on Ioc
  | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), Hits = count(), SeenIn = make_set(SeenIn)
            by DeviceName, RemoteIP, Ioc, IocType, Confidence, Context, Source
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: RemoteIP
suppressionEnabled: false
suppressionDuration: PT1H
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
