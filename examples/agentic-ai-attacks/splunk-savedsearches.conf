# ==========================================================================================
# Agentic-intrusion detections (ARTEX / CAIRN) - Splunk, CIM-based
#
# Built on the methods of the kj299/Morpheus behavioral-analytics fork:
#   * entity's OWN baseline, not a global threshold   (tc3_baseline / tc7_http busiest-day ratio)
#   * warm-up before an entity may be judged          (_mature flags, 7-day warm-up)
#   * first-seen novelty per entity                   (ValueNoveltyTracker / tc7_endpoint)
#   * distinct-count windows                          (DistinctWindowTracker)
#   * timing regularity as a coefficient of variation (ArrivalRegularityTracker, CV < 0.15, >= 12 intervals)
#   * user-agent FAMILY, not the raw header           (utils/user_agent.py)
#   * chained, ordered, value-joined rules            (R-C-00x)
#   * rules write to a risk index; chains read it     (behavior_risk pattern)
#
# Rule logic was tested with Morpheus's own trackers against a seeded corpus of planted attacks
# and one-condition-off benign twins (11/11 pass, 22/22 mutations caught); see the reference doc.
# That validates the LOGIC, not your thresholds: derive those from 2-4 weeks of your own data.
#
# Placeholders to set before enabling:
#   <RISK_INDEX>          summary index the rules collect into (create it; e.g. agentic_risk)
#   <ZAMMAD_INDEX>, <ZAMMAD_SOURCETYPE>, <AWS_INDEX>, <AAD_INDEX>, <AAD_AUDIT_SOURCETYPE>,
#   <EDR_INDEX>, <MYSQL_INDEX>, <MYSQL_QUERY_LOG_SOURCETYPE> (R-D-AGT-013; delete its append clause if you
#   do not collect MySQL query logs - an unreplaced placeholder is a parse error for the whole rule)
#   The three accumulating baselines read their own CSV back with inputlookup, which errors on a missing
#   file: header-only seeds for agt_host_history.csv, agt_host_llm_seen.csv and agt_web_proc_pairs.csv
#   ship in ./lookups/ - upload them before the first run.
#   lookups in ./lookups/: llm_api_domains.csv (shipped), agt_scheduled_clients.csv,
#   agt_host_roles.csv, agt_asset_ip.csv, agt_sp_change_actors.csv (yours to fill)
#
# Status: needs_validation. Every search here is untested against a live Splunk; syntax was
# reviewed by hand. Run each once interactively over 7 days before scheduling.
# ==========================================================================================

# ------------------------------------------------------------------------------------------
# BASELINE BUILDERS (Morpheus: each entity is judged against its own history)
# ------------------------------------------------------------------------------------------

[AGT baseline - HTTP client busiest window]
description = Per client, the most distinct paths it requested in any 10-minute window over the prior 30 days, and how many days it was seen. Feeds R-D-AGT-001's own-baseline condition (port of tc7_http http_distinct_paths_ratio).
enableSched   = 1
cron_schedule = 17 1 * * *
search = | tstats summariesonly=true dc(Web.uri_path) AS paths from datamodel=Web.Web where earliest=-30d@d latest=@d by Web.src _time span=10m \
| rename Web.src AS src \
| eval day = strftime(_time, "%F") \
| stats max(paths) AS peak_paths dc(day) AS baseline_days BY src \
| outputlookup agt_http_client_peak.csv

[AGT baseline - host history]
description = First time each host was seen resolving names and running processes. Warm-up gate (Morpheus _mature): a host younger than 7 days is not judged by novelty rules.
enableSched   = 1
cron_schedule = 23 1 * * *
search = | tstats summariesonly=true min(_time) AS first_seen from datamodel=Network_Resolution.DNS where earliest=-1d@d latest=@d by DNS.src \
| rename DNS.src AS host_key \
| append [| tstats summariesonly=true min(_time) AS first_seen from datamodel=Endpoint.Processes where earliest=-1d@d latest=@d by Processes.dest | rename Processes.dest AS host_key] \
| inputlookup append=t agt_host_history.csv \
| eval first_seen = coalesce(first_seen, host_first_seen) \
| stats min(first_seen) AS host_first_seen BY host_key \
| outputlookup agt_host_history.csv

[AGT baseline - host LLM API contacts]
description = Which LLM API domains each host has already been seen resolving, and since when. Feeds R-B-AGT-004 novelty (ValueNoveltyTracker port). The domain list is a versioned snapshot (Morpheus: external context must be pinned, never live).
enableSched   = 1
cron_schedule = 29 1 * * *
search = | tstats summariesonly=true min(_time) AS first_seen from datamodel=Network_Resolution.DNS where earliest=-1d@d latest=@d by DNS.src DNS.query \
| rename DNS.src AS host_key, DNS.query AS query \
| eval query = lower(query) \
| lookup llm_api_domains.csv llm_domain AS query OUTPUT provider \
| where isnotnull(provider) \
| fields host_key query first_seen \
| inputlookup append=t agt_host_llm_seen.csv \
| stats min(first_seen) AS first_seen BY host_key query \
| outputlookup agt_host_llm_seen.csv

[AGT baseline - web server process pairs]
description = Parent>child pairs each host's web-server processes have produced, with last-seen time. Feeds R-B-AGT-005 (port of tc7_endpoint pair novelty, 30-day memory).
enableSched   = 1
cron_schedule = 35 1 * * *
search = | tstats summariesonly=true max(_time) AS last_seen from datamodel=Endpoint.Processes where earliest=-1d@d latest=@d Processes.parent_process_name IN ("w3wp.exe","httpd.exe","httpd","nginx.exe","nginx","php-cgi.exe","php-fpm","apache2","tomcat9.exe","java.exe","java","node.exe","node") by Processes.dest Processes.parent_process_name Processes.process_name \
| rename Processes.* AS * \
| inputlookup append=t agt_web_proc_pairs.csv \
| stats max(last_seen) AS last_seen BY dest parent_process_name process_name \
| where last_seen >= relative_time(now(), "-30d@d") \
| outputlookup agt_web_proc_pairs.csv

[AGT baseline - identity operation envelope]
description = Per principal and operation, the 99th percentile of daily counts over 30 days. Feeds R-B-AGT-008 (port of tc7_saas bulk-access envelope: > 5x own p99). Source is the Entra audit feed from the Microsoft Cloud Services add-on; field names vary by add-on version, confirm with the discovery search at the bottom.
enableSched   = 1
cron_schedule = 41 1 * * *
search = index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> earliest=-30d@d latest=@d \
| eval actor = lower(coalesce('properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName')), op = coalesce(operationName, 'properties.activityDisplayName', activityDisplayName) \
| bin _time span=1d \
| stats count BY actor op _time \
| stats perc99(count) AS p99_daily dc(_time) AS days BY actor op \
| outputlookup agt_identity_op_envelope.csv

# ------------------------------------------------------------------------------------------
# DETECTIONS
# ------------------------------------------------------------------------------------------

# Port of R-D-L7-005 (Enumeration) with the client judged by user-agent FAMILY and by whether it
# ever loads a page asset. An agent's tools fetch HTML and APIs; a browser fetches CSS/JS/images.
# A crawler (few errors), a broken client (few paths), a scheduled scanner (its own baseline is
# already that high) and a browser user (loads assets) each fail exactly one condition.
[R-D-AGT-001 - Agent-shaped enumeration]
description = One client requesting more than 200 distinct paths in ten minutes, more than 0.7 client errors per success, either a non-browser user-agent family, a forged Chrome header (version with fewer than four parts or no KHTML token, as Wiz recorded from ARTEX), or under 5 percent static assets, and at least twice its own busiest prior window (or under 7 days of history). ARTEX/CAIRN recon tempo (Zscaler ThreatLabz 2026-10-14: high-frequency sequential enumeration of login and search endpoints). ATT&CK T1595.002, T1190.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 1h
search = | tstats summariesonly=true count from datamodel=Web.Web by _time span=10m Web.src Web.dest Web.uri_path Web.status Web.http_user_agent \
| rename Web.* AS * \
| eval n4xx = if(status>=400 AND status<500, count, 0), n2xx = if(status>=200 AND status<300, count, 0), static = if(match(uri_path, "(?i)\.(css|js|png|jpe?g|gif|svg|woff2?|ico)$"), count, 0) \
| eval ua_family = case(match(http_user_agent, "HeadlessChrome"), "headless", match(http_user_agent, "Chrome/") AND (NOT match(http_user_agent, "Chrome/\d+\.\d+\.\d+\.\d+") OR NOT match(http_user_agent, "\(KHTML, like Gecko\)")), "forged-chrome", match(http_user_agent, "^Mozilla/") AND match(http_user_agent, "(Edg|EdgA|Chrome|CriOS|Firefox|FxiOS|Safari)/"), "browser", match(http_user_agent, "^Mozilla/"), "mozilla", isnull(http_user_agent) OR http_user_agent="", "none", true(), lower(replace(http_user_agent, "^\s*([A-Za-z][A-Za-z0-9._+-]*).*$", "\1"))) \
| stats dc(uri_path) AS distinct_paths sum(count) AS requests sum(n4xx) AS refusals sum(n2xx) AS successes sum(static) AS static_requests values(ua_family) AS ua_families values(dest) AS dest BY _time src \
| eval static_share = round(static_requests / requests, 3), non_browser = coalesce(mvcount(mvfilter(ua_families!="browser")), 0) \
| where distinct_paths > 200 AND refusals > 0.7 * successes AND (non_browser > 0 OR static_share < 0.05) \
| lookup agt_http_client_peak.csv src OUTPUT peak_paths baseline_days \
| eval baseline_mature = if(coalesce(baseline_days, 0) >= 7, "true", "false"), times_busiest = if(peak_paths > 0, round(distinct_paths / peak_paths, 2), null()) \
| where baseline_mature="false" OR distinct_paths >= 2 * peak_paths \
| mvexpand dest \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval rule_id = "R-D-AGT-001", risk_score = 45, entity_key = src, target_host = coalesce(target_host, dest) \
| table _time rule_id risk_score entity_key src dest target_host distinct_paths requests refusals successes static_share ua_families baseline_mature times_busiest \
| collect index=<RISK_INDEX>

# Port of R-B-L3-002 (Beaconing) onto request timing. A rate rule misses the agent that throttles
# itself per target (CSA 2026-10-28; Microsoft saw a spray held to a steady rate). A throttle is a
# timer, and a timer is regular: inter-arrival CV < 0.15 over >= 12 gaps. 1-second bins mean this
# measures paced clients (gaps >= 1 s); bursts inside a second collapse to one arrival.
[R-B-AGT-002 - Machine-regular request cadence]
description = A client whose requests to one destination arrive at a regular interval (coefficient of variation of the gaps under 0.15 over at least 12 gaps in 24 hours), not on the scheduled-client allow-list. Throttled agent recon or spraying. ATT&CK T1595, T1110.003.
enableSched            = 1
cron_schedule          = 7 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time   = @h
alert.suppress         = 1
alert.suppress.fields  = src,dest
alert.suppress.period  = 24h
search = | multisearch [| tstats summariesonly=true count from datamodel=Web.Web by Web.src Web.dest _time span=1s | rename Web.* AS * | eval kind = "web"] [| tstats summariesonly=true count from datamodel=Authentication.Authentication by Authentication.src Authentication.dest _time span=1s | rename Authentication.* AS * | eval kind = "auth"] \
| sort 0 src dest kind _time \
| streamstats current=f last(_time) AS prev_time BY src dest kind \
| eval gap = _time - prev_time \
| stats count AS arrivals avg(gap) AS mean_gap stdevp(gap) AS sd_gap BY src dest kind \
| eval intervals = arrivals - 1, interval_cv = if(mean_gap > 0, round(sd_gap / mean_gap, 3), null()) \
| where intervals >= 12 AND interval_cv < 0.15 \
| lookup agt_scheduled_clients.csv src OUTPUT reason AS allow_reason \
| where isnull(allow_reason) \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = now(), rule_id = "R-B-AGT-002", risk_score = 40, entity_key = src, target_host = coalesce(target_host, dest), mean_gap_s = round(mean_gap, 1) \
| table _time rule_id risk_score entity_key src dest kind target_host intervals mean_gap_s interval_cv \
| collect index=<RISK_INDEX>

# The fork's tc5_risk counts failure runs per PRINCIPAL only; a spray is one SOURCE touching many
# principals a few times each. DistinctWindowTracker, keyed on src. A brute force (one principal),
# a 9-principal source and a stale-credential service (20 retries each) each fail one condition.
[R-D-AGT-003 - Source-centric password spray]
description = One source failing authentication for at least 10 distinct principals in an hour with no principal failing more than 3 times. Microsoft (Storm-0940 via ARTEX, 2026-10-10..14): 151,000 failures against 327 accounts. ATT&CK T1110.003.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 2h
search = | tstats summariesonly=true count from datamodel=Authentication.Authentication where Authentication.action="failure" by Authentication.src Authentication.user \
| rename Authentication.* AS * \
| stats dc(user) AS failing_principals max(count) AS worst_principal_attempts sum(count) AS attempts values(user) AS principals BY src \
| where failing_principals >= 10 AND worst_principal_attempts <= 3 \
| eval _time = now(), rule_id = "R-D-AGT-003", risk_score = 50, entity_key = src, principals = mvjoin(mvindex(principals, 0, 49), "|") \
| table _time rule_id risk_score entity_key src failing_principals worst_principal_attempts attempts principals \
| collect index=<RISK_INDEX>

# tc7_service inverted onto egress: the question is not "is this a bad domain" (these are real,
# legitimate APIs) but "has THIS server ever talked to it". A developer workstation, a server
# with a sanctioned integration and a host still in its warm-up each fail one condition.
[R-B-AGT-004 - First LLM API contact from a server]
description = A server resolving an LLM API domain it has never resolved before, after at least 7 days of history. A compromised host being used as agent infrastructure, or an unsanctioned agent install. Zscaler ThreatLabz 2026-10-14 Table 2; CERT-In CIAD-2026-0058. ATT&CK T1102, T1071.001.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = host_key,query
alert.suppress.period  = 24h
search = | tstats summariesonly=true min(_time) AS first_time count from datamodel=Network_Resolution.DNS by DNS.src DNS.query \
| rename DNS.src AS host_key, DNS.query AS query \
| eval query = lower(query) \
| lookup llm_api_domains.csv llm_domain AS query OUTPUT provider \
| where isnotnull(provider) \
| lookup agt_host_llm_seen.csv host_key query OUTPUT first_seen AS known_since \
| where isnull(known_since) \
| lookup agt_host_history.csv host_key OUTPUT host_first_seen \
| where host_first_seen <= relative_time(now(), "-7d") \
| lookup agt_host_roles.csv host_key OUTPUT role \
| where role="server" \
| lookup agt_asset_ip.csv ip AS host_key OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-B-AGT-004", risk_score = 50, entity_key = host_key, target_host = coalesce(target_host, host_key) \
| table _time rule_id risk_score entity_key host_key target_host query provider count \
| collect index=<RISK_INDEX>

# Port of R-B-L7-004 (process ancestry novelty) narrowed to web-server parents. Novelty, not a
# static child list, so an app that legitimately shells out every day is quiet and the first
# cmd.exe/sh from w3wp/php-fpm is not.
[R-B-AGT-005 - Web server spawns a process it never has]
description = A web-server process producing a child it has not produced on this host in 30 days, on a host with at least 7 days of history. Webshell execution after agent-driven upload, SQLi or deserialization (NorForge via GridinSoft 2026-10; CERT-In). ATT&CK T1505.003, T1059.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = dest,parent_process_name,process_name
alert.suppress.period  = 24h
search = | tstats summariesonly=true min(_time) AS first_time values(Processes.process) AS command_lines values(Processes.user) AS users from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("w3wp.exe","httpd.exe","httpd","nginx.exe","nginx","php-cgi.exe","php-fpm","apache2","tomcat9.exe","java.exe","java","node.exe","node") by Processes.dest Processes.parent_process_name Processes.process_name \
| rename Processes.* AS * \
| lookup agt_web_proc_pairs.csv dest parent_process_name process_name OUTPUT last_seen \
| where isnull(last_seen) OR last_seen < relative_time(now(), "-30d") \
| lookup agt_host_history.csv host_key AS dest OUTPUT host_first_seen \
| where host_first_seen <= relative_time(now(), "-7d") \
| eval _time = first_time, rule_id = "R-B-AGT-005", risk_score = 60, entity_key = dest, target_host = dest, command_lines = mvindex(command_lines, 0, 9) \
| table _time rule_id risk_score entity_key target_host parent_process_name process_name command_lines users \
| collect index=<RISK_INDEX>

[R-D-AGT-006 - BLOODALCHEMY side-load]
description = graphics-hook-filter64.dll or graphics-hook_config.bin on disk, or svchost.exe running outside the Windows system directories. VAPOR PANDA follow-on payload after ARTEX access (CrowdStrike via IT Brief UK 2026-10-29). ATT&CK T1574.002, T1036.005.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true min(_time) AS first_time values(Filesystem.file_path) AS paths values(Filesystem.file_hash) AS hashes from datamodel=Endpoint.Filesystem where Filesystem.file_name IN ("graphics-hook-filter64.dll","graphics-hook_config.bin") by Filesystem.dest Filesystem.file_name \
| rename Filesystem.* AS * \
| append [| tstats summariesonly=true min(_time) AS first_time values(Processes.process_hash) AS hashes from datamodel=Endpoint.Processes where Processes.process_name="svchost.exe" by Processes.dest Processes.process_path | rename Processes.* AS * | where NOT match(lower(process_path), "^c:\\\\windows\\\\(system32|syswow64|winsxs)\\\\") | rename process_path AS paths | eval file_name="svchost.exe (outside system dirs)"] \
| eval _time = first_time, rule_id = "R-D-AGT-006", risk_score = 90, entity_key = dest, target_host = dest \
| table _time rule_id risk_score entity_key target_host file_name paths hashes \
| collect index=<RISK_INDEX>

[R-D-AGT-007 - Zammad session material in error log (CVE-2026-102489)]
description = Zammad Rails error lines carrying a Cookie header or a websocket @clients dump - the indicator DIVD's own log-check script (DIVD-2026-00015, cve-2026-102489_ioc_check_script_v2.sh) searches for. CVE-2026-102489/102490 are in CISA KEV (added 2026-10-02) and were exploited in the AI-agent breach of DIVD (DIVD-2026-00014). ATT&CK T1190, T1539.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -5m@m
search = index=<ZAMMAD_INDEX> sourcetype=<ZAMMAD_SOURCETYPE> earliest=-30m@m "ERROR -- :" ("\"Cookie\"=>" OR "@clients={") \
| regex _raw="ERROR -- :.*(\"Cookie\"=>\"|@clients=\{)" \
| stats count min(_time) AS _time values(source) AS log_files BY host \
| eval rule_id = "R-D-AGT-007", risk_score = 80, entity_key = host, target_host = host \
| table _time rule_id risk_score entity_key target_host count log_files \
| collect index=<RISK_INDEX>

# tc7_saas envelope (> 5x own p99) on identity-plane writes, plus a deterministic floor for the
# operations Storm-0940's agents used for persistence (Microsoft via CSA 2026-10-28).
[R-B-AGT-008 - Identity control-plane writes beyond the actor's envelope]
description = A principal performing an identity-plane write (credential added to an app or service principal, owner added, role assigned, consent granted) more than 5 times its own 30-day daily 99th percentile - or doing it at all when it is not on the approved list. ATT&CK T1098.001, T1098.003, T1078.004.
enableSched            = 1
cron_schedule          = 13 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time   = @h
alert.suppress         = 1
alert.suppress.fields  = actor,op
alert.suppress.period  = 24h
search = index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> earliest=-24h@h latest=@h ("Add service principal credentials" OR "Certificates and secrets management" OR "Add owner to application" OR "Add owner to service principal" OR "Add app role assignment to service principal" OR "Add member to role" OR "Consent to application") \
| eval actor = lower(coalesce('properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName')), op = coalesce(operationName, 'properties.activityDisplayName', activityDisplayName) \
| stats count values('properties.targetResources{}.displayName') AS targets min(_time) AS _time max(_time) AS last_write BY actor op \
| lookup agt_identity_op_envelope.csv actor op OUTPUT p99_daily days \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) OR (coalesce(days, 0) >= 7 AND count > 5 * coalesce(p99_daily, 0)) \
| eval rule_id = "R-B-AGT-008", risk_score = if(isnull(approved), 70, 50), entity_key = actor \
| table _time last_write rule_id risk_score entity_key actor op count p99_daily approved targets \
| collect index=<RISK_INDEX>

[R-D-AGT-009 - AWS control-plane execution and key creation]
description = AWS SSM remote command or session, Lambda code change, or new access key / user / role / inline policy by a principal outside the approved automation list. CERT-In CIAD-2026-0058 (CRAFTY FALCON abusing SSM and Lambda). ATT&CK T1651, T1098.001, T1136.003.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail earliest=-30m@m (eventName IN ("SendCommand","StartSession","CreateAccessKey","CreateUser","CreateLoginProfile","AttachUserPolicy","PutRolePolicy","PutUserPolicy","CreateRole") OR eventName="UpdateFunctionCode*") \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn') \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) \
| stats count values(eventName) AS actions values(sourceIPAddress) AS src_ips values(userAgent) AS user_agents min(_time) AS _time BY actor \
| eval rule_id = "R-D-AGT-009", risk_score = 70, entity_key = actor \
| table _time rule_id risk_score entity_key actor actions count src_ips user_agents \
| collect index=<RISK_INDEX>

# Port of R-P-L7-010 (slow enumeration trajectory). Watchlist, never a page: a client whose daily
# distinct-path count climbs steadily while staying under R-D-AGT-001's floor - the patient agent.
# Morpheus fits rising runs; this fits a least-squares line (slope, r^2) over 14 daily points.
[R-P-AGT-010 - Slow enumeration trajectory]
description = A client whose daily distinct paths rose on a straight line (r squared at least 0.8, slope at least 10 paths a day) over the last 14 days while never crossing 200 in a 10-minute window. Watchlist entry, not an alert.
enableSched   = 1
cron_schedule = 47 2 * * *
search = | tstats summariesonly=true dc(Web.uri_path) AS paths from datamodel=Web.Web where earliest=-14d@d latest=@d by Web.src _time span=1d \
| rename Web.src AS src \
| eventstats min(_time) AS t0 BY src \
| eval x = (_time - t0) / 86400, y = paths \
| stats count AS n sum(x) AS sx sum(y) AS sy sum(eval(x*y)) AS sxy sum(eval(x*x)) AS sxx sum(eval(y*y)) AS syy max(y) AS peak_day BY src \
| where n >= 7 \
| eval slope = (n*sxy - sx*sy) / (n*sxx - sx*sx), r = (n*sxy - sx*sy) / sqrt((n*sxx - sx*sx) * (n*syy - sy*sy)), r2 = round(r*r, 3), slope = round(slope, 1) \
| where slope >= 10 AND r2 >= 0.8 \
| lookup agt_http_client_peak.csv src OUTPUT peak_paths \
| where coalesce(peak_paths, 0) <= 200 \
| eval _time = now(), rule_id = "R-P-AGT-010", risk_score = 20, entity_key = src \
| table _time rule_id risk_score entity_key src n slope r2 peak_day peak_paths \
| collect index=<RISK_INDEX>

# ------------------------------------------------------------------------------------------
# CHAINS (Morpheus R-C pattern: ordered, value-joined, alert directly at high priority)
# ------------------------------------------------------------------------------------------

# recon against host H -> web server on H spawns a new child within 2 h -> H makes first LLM-API
# contact (or a BLOODALCHEMY artifact appears) within 24 h. Each step alone has an ordinary
# explanation; the ordered sequence on one host does not. Harness near-misses: out of order,
# other host, egress from a different host, egress after 24 h - all must stay quiet.
[R-C-AGT-001 - Agentic intrusion chain]
description = Ordered on one host: agent-shaped recon against it (R-D-AGT-001, R-B-AGT-002, R-D-AGT-011 agent user-agent, R-D-AGT-015 agent probe), then execution on it within 2 hours (R-B-AGT-005 novel web-server child, R-D-AGT-013 database-written webshell), then within 24 hours first LLM API contact (R-B-AGT-004), an OOB callback (R-D-AGT-016), framework presence (R-D-AGT-014) or a BLOODALCHEMY artifact (R-D-AGT-006). Uses the first occurrence of each step per host.
enableSched            = 1
cron_schedule          = 5,35 * * * *
dispatch.earliest_time = -27h@h
dispatch.latest_time   = now
alert.suppress         = 1
alert.suppress.fields  = target_host
alert.suppress.period  = 24h
search = index=<RISK_INDEX> rule_id IN ("R-D-AGT-001","R-B-AGT-002","R-D-AGT-011","R-D-AGT-015","R-B-AGT-005","R-D-AGT-013","R-B-AGT-004","R-D-AGT-006","R-D-AGT-014","R-D-AGT-016") \
| eval step = case(rule_id IN ("R-D-AGT-001","R-B-AGT-002","R-D-AGT-011","R-D-AGT-015"), 1, rule_id IN ("R-B-AGT-005","R-D-AGT-013"), 2, true(), 3) \
| stats min(eval(if(step=1, _time, null()))) AS t_recon min(eval(if(step=2, _time, null()))) AS t_exec min(eval(if(step=3, _time, null()))) AS t_egress values(eval(if(step=1, entity_key, null()))) AS attacker_src values(rule_id) AS rules BY target_host \
| where t_recon < t_exec AND t_exec <= t_recon + 7200 AND t_egress > t_exec AND t_egress <= t_exec + 86400 \
| eval _time = t_recon, rule_id = "R-C-AGT-001", risk_score = 100, entity_key = target_host \
| table _time rule_id risk_score entity_key target_host attacker_src t_recon t_exec t_egress rules

# spray from S -> a sprayed principal succeeds from S within 1 h -> that principal performs an
# identity-plane write within 4 h. Microsoft: agents ran Graph recon, added app credentials,
# changed roles.
[R-C-AGT-002 - Spray to identity persistence chain]
description = Ordered: a source sprays (R-D-AGT-003), one of the sprayed principals then authenticates successfully from that same source within 1 hour, and that principal performs an identity-plane write (R-B-AGT-008) within 4 hours.
enableSched            = 1
cron_schedule          = 20 * * * *
dispatch.earliest_time = -6h@h
dispatch.latest_time   = now
search = index=<RISK_INDEX> rule_id="R-D-AGT-003" \
| fields _time src principals \
| eval principals = split(principals, "|") \
| mvexpand principals \
| rename _time AS t_spray, principals AS user \
| join type=inner max=0 src user [| tstats summariesonly=true min(_time) AS t_success from datamodel=Authentication.Authentication where Authentication.action="success" earliest=-6h by Authentication.src Authentication.user | rename Authentication.* AS *] \
| where t_success > t_spray AND t_success <= t_spray + 3600 \
| eval user = lower(user) \
| join type=inner max=0 user [search index=<RISK_INDEX> rule_id="R-B-AGT-008" | rename actor AS user, last_write AS t_write | dedup user op | fields user t_write op] \
| where t_write > t_success AND t_write <= t_success + 14400 \
| eval _time = t_spray, rule_id = "R-C-AGT-002", risk_score = 100, entity_key = user \
| table _time rule_id risk_score entity_key user src t_spray t_success t_write op

# ------------------------------------------------------------------------------------------
# COVERAGE / DISCOVERY - run these first (empty = that data model is not feeding the rules)
# ------------------------------------------------------------------------------------------
#   | tstats count from datamodel=Web.Web by index, sourcetype
#   | tstats count from datamodel=Authentication.Authentication by index, sourcetype
#   | tstats count from datamodel=Network_Resolution.DNS by index, sourcetype
#   | tstats count from datamodel=Endpoint.Processes by index, sourcetype
#   | tstats count from datamodel=Endpoint.Filesystem by index, sourcetype
#   | tstats count where index=* sourcetype=aws:cloudtrail by index
#   | tstats count where index=* by index, sourcetype | search sourcetype=*aad* OR sourcetype=*azure*
#   index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> | head 5 | fieldsummary     (confirm actor/op field names)

# ------------------------------------------------------------------------------------------
# PRIMARY-SOURCE INDICATOR RULES (added after the IOC collection; every value verified against
# the saved primary page or the framework's source code - see the reference doc and iocs.csv)
# ------------------------------------------------------------------------------------------

[R-D-AGT-011 - Agent framework user-agent inbound]
description = A request to your estate carrying a user-agent compiled into ARTEX (artex-enrich/1.0, Mozilla/5.0 (spa-api-recon[ spider])), the Norma agent engine (norma/0.4), Hexstrike-AI or CyberStrikeAI. Read from source: BaaRai/ARTEX enrich/enrich.go and skills/api-recon; Autumn-27/norma v0.4.4 tool/webfetch.go; confirmed in the wild by AhnLab and Wiz. Operators can change these, so absence is not safety. ATT&CK T1595.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -5m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 6h
search = | tstats summariesonly=true count min(_time) AS first_time values(Web.url) AS urls from datamodel=Web.Web where (Web.http_user_agent="artex-enrich/*" OR Web.http_user_agent="*spa-api-recon*" OR Web.http_user_agent="norma/*" OR Web.http_user_agent="HexStrike-HTTP-Framework*" OR Web.http_user_agent="*CyberStrikeAI*" OR Web.http_user_agent="PentAGI/*") by Web.src Web.dest Web.http_user_agent \
| rename Web.* AS * \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-D-AGT-011", risk_score = 60, entity_key = src, target_host = coalesce(target_host, dest), urls = mvindex(urls, 0, 9) \
| table _time rule_id risk_score entity_key src dest target_host http_user_agent count urls \
| collect index=<RISK_INDEX>

[R-D-AGT-012 - Verified IOC sweep]
description = Any DNS query, connection, web request, file hash or user-agent matching agt_iocs.csv (125 network, hash, user-agent and app-ID indicators verified against CrowdStrike, Microsoft, Wiz, Zscaler, AhnLab, NorForge, Gambit, PLURA/FSS, Nextron Valhalla). Confidence and recommended action ride along from the lookup; low-confidence rows (shared egress) are hunt-only.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = | multisearch \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Network_Resolution.DNS where [| inputlookup agt_iocs.csv | where ioc_type="domain" | eval ioc = mvappend(ioc, "www." . ioc) | mvexpand ioc | rename ioc AS DNS.query | fields DNS.query] by DNS.src DNS.query | rename DNS.src AS src, DNS.query AS ioc | eval seen_in = "dns"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Network_Traffic.All_Traffic where [| inputlookup agt_iocs.csv | where ioc_type="ipv4" | rename ioc AS All_Traffic.dest | fields All_Traffic.dest] by All_Traffic.src All_Traffic.dest | rename All_Traffic.src AS src, All_Traffic.dest AS ioc | eval seen_in = "traffic"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Web.Web where [| inputlookup agt_iocs.csv | where ioc_type="user_agent" | rename ioc AS Web.http_user_agent | fields Web.http_user_agent] by Web.src Web.http_user_agent | rename Web.src AS src, Web.http_user_agent AS ioc | eval seen_in = "user_agent"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Endpoint.Filesystem where [| inputlookup agt_iocs.csv | where ioc_type IN ("sha256","md5") | rename ioc AS Filesystem.file_hash | fields Filesystem.file_hash] by Filesystem.dest Filesystem.file_hash | rename Filesystem.dest AS src, Filesystem.file_hash AS ioc | eval seen_in = "file_hash"] \
| eval ioc_key = if(seen_in = "user_agent", ioc, lower(replace(ioc, "^www\\.", ""))) \
| lookup agt_iocs.csv ioc AS ioc_key OUTPUT ioc_type confidence context source AS ioc_source \
| where isnotnull(ioc_type) \
| eval _time = first_time, rule_id = "R-D-AGT-012", risk_score = case(confidence="high", 80, confidence="medium", 50, true(), 20), entity_key = src, target_host = src \
| table _time rule_id risk_score entity_key src seen_in ioc ioc_type confidence context ioc_source count \
| collect index=<RISK_INDEX>

[R-D-AGT-013 - Webshell written by the database server]
description = mysqld writing a .jsp/.jspx/.php/.aspx file - the end state of MySQL general-log poisoning (SET GLOBAL general_log_file to a web path, SET GLOBAL general_log = 1, SELECT a script body), which GTIG observed ARTEX agents use to plant cl1217.jsp-style webshells (GTIG 2026-10-30). Windows Sysmon file-create (event 11); add the query-log half below if you collect MySQL logs. ATT&CK T1505.003, T1190.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -5m@m
search = index=<EDR_INDEX> sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=11 Image="*\\mysqld.exe" (TargetFilename="*.jsp" OR TargetFilename="*.jspx" OR TargetFilename="*.php" OR TargetFilename="*.aspx") \
| append [search index=<MYSQL_INDEX> sourcetype=<MYSQL_QUERY_LOG_SOURCETYPE> "general_log_file" | regex _raw="(?i)set\s+global\s+general_log_file\s*=\s*'[^']*\.(jsp|jspx|php|aspx)'" | eval TargetFilename = "query-log: " . substr(_raw, 1, 200), Image = "mysqld"] \
| stats min(_time) AS _time values(TargetFilename) AS files values(Image) AS writer BY host \
| eval rule_id = "R-D-AGT-013", risk_score = 90, entity_key = host, target_host = host \
| table _time rule_id risk_score entity_key target_host writer files \
| collect index=<RISK_INDEX>

[R-D-AGT-014 - ARTEX or CAIRN running on one of your hosts]
description = Process or file evidence that an agent framework is installed or operating on a host you own (rogue install, or a compromised host turned into agent infrastructure): the artex binary, ARTEX_* configuration in a command line, the artx5v working directory and artex-probe-* files (CrowdStrike, GTIG), Cairn's worker token variable or worker image (oritera/Cairn dispatch.example.yaml; NorForge). ATT&CK T1588.002, T1059.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true min(_time) AS first_time values(Processes.process) AS evidence from datamodel=Endpoint.Processes where (Processes.process_name IN ("artex","artex.exe") OR Processes.process="*ARTEX_LLM_BASE_URL*" OR Processes.process="*ARTEX_PG_DSN*" OR Processes.process="*artx5v*" OR Processes.process="*artex-probe-*" OR Processes.process="*TSEC_AGENT_TOKEN*" OR Processes.process="*cairn-worker-container*" OR Processes.process="*artex-local:*") by Processes.dest \
| rename Processes.dest AS dest \
| append [| tstats summariesonly=true min(_time) AS first_time values(Filesystem.file_path) AS evidence from datamodel=Endpoint.Filesystem where (Filesystem.file_name="artex-probe-*" OR Filesystem.file_path="*\\artx5v\\*" OR Filesystem.file_name="artex-*-*-*.zip" OR Filesystem.file_path="*_ca*mitmproxy-ca-cert.pem") by Filesystem.dest | rename Filesystem.dest AS dest] \
| stats min(first_time) AS _time values(evidence) AS evidence BY dest \
| eval rule_id = "R-D-AGT-014", risk_score = 85, entity_key = dest, target_host = dest, evidence = mvindex(evidence, 0, 9) \
| table _time rule_id risk_score entity_key target_host evidence \
| collect index=<RISK_INDEX>

[R-D-AGT-015 - Agent probe requests (unsigned JWT, junk OAuth, baseline 404)]
description = Requests Wiz recorded Storm-0940's ARTEX agents sending to SSO and OAuth endpoints: a JWT whose header is {"alg":"none"} (base64 eyJhbGciOiJub25l), an OAuth callback with code=AAAA&state=notvalidb64, and the baseline probe /zzz-nonexistent-xyz123 (Wiz 2026-10-22). ATT&CK T1190, T1606.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -5m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 6h
search = | tstats summariesonly=true count min(_time) AS first_time values(Web.url) AS urls values(Web.status) AS statuses from datamodel=Web.Web where (Web.url="*eyJhbGciOiJub25l*" OR Web.url="*state=notvalidb64*" OR Web.url="*zzz-nonexistent-xyz123*") by Web.src Web.dest Web.http_user_agent \
| rename Web.* AS * \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-D-AGT-015", risk_score = 55, entity_key = src, target_host = coalesce(target_host, dest), urls = mvindex(urls, 0, 9) \
| table _time rule_id risk_score entity_key src dest target_host http_user_agent statuses count urls \
| collect index=<RISK_INDEX>

[R-D-AGT-016 - Server calling an out-of-band callback service]
description = A server resolving webhook.site or dnslog.cn - GTIG saw ARTEX agents post command output to 491 rotating webhook.site URLs; Hunt.io found a dnslog.cn callback on actor infrastructure. Legitimate services: alert from servers, not a blocklist. ATT&CK T1567, T1071.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true count min(_time) AS first_time values(DNS.query) AS queries from datamodel=Network_Resolution.DNS where (DNS.query="webhook.site" OR DNS.query="*.webhook.site" OR DNS.query="dnslog.cn" OR DNS.query="*.dnslog.cn") by DNS.src \
| rename DNS.src AS host_key \
| lookup agt_host_roles.csv host_key OUTPUT role \
| where role="server" \
| lookup agt_asset_ip.csv ip AS host_key OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-D-AGT-016", risk_score = 55, entity_key = host_key, target_host = coalesce(target_host, host_key) \
| table _time rule_id risk_score entity_key target_host queries count \
| collect index=<RISK_INDEX>
