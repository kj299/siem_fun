# ==========================================================================================
# Agentic-intrusion detections (ARTEX / CAIRN) - Splunk, CIM-based
#
# Built on the methods of the kj299/Morpheus behavioral-analytics fork:
#   * entity's OWN baseline, not a global threshold   (tc3_baseline / tc7_http busiest-day ratio)
#   * warm-up before an entity may be judged          (_mature flags, 7-day warm-up)
#   * first-seen novelty per entity                   (ValueNoveltyTracker / tc7_endpoint)
#   * distinct-count windows                          (DistinctWindowTracker)
#   * timing regularity as a coefficient of variation (ArrivalRegularityTracker, CV < 0.15, >= 12 intervals)
#   * user-agent FAMILY, not the raw header           (utils/user_agent.py)
#   * chained, ordered, value-joined rules            (R-C-00x)
#   * rules write to a risk index; chains read it     (behavior_risk pattern)
#
# Rule logic was tested with Morpheus's own trackers against a seeded corpus of planted attacks
# and one-condition-off benign twins (11 of 11 passed and 22 of 22 mutations were caught when the
# rules were written). That corpus is not in this repository, so the figure cannot be re-derived here.
# That validates the LOGIC, not your thresholds: derive those from 2-4 weeks of your own data.
#
# Placeholders to set before enabling:
#   <RISK_INDEX>          summary index the rules collect into (create it; e.g. agentic_risk)
#   <ZAMMAD_INDEX>, <ZAMMAD_SOURCETYPE>, <AWS_INDEX>, <AAD_INDEX>, <AAD_AUDIT_SOURCETYPE>,
#   <EDR_INDEX>, <MYSQL_INDEX>, <MYSQL_QUERY_LOG_SOURCETYPE> (R-D-AGT-013; delete its append clause if you
#   do not collect MySQL query logs - an unreplaced placeholder is a parse error for the whole rule)
#   <AZURE_INDEX>, <AZURE_ACTIVITY_SOURCETYPE> (R-D-AGT-023: the Azure activity log; field names vary
#   by add-on), <WINDOWS_INDEX> (R-D-AGT-024, R-D-AGT-027: domain controller Security logs, XML format),
#   <AAD_SP_SIGNIN_SOURCETYPE> (R-D-AGT-020: Entra service-principal sign-in events in <AAD_INDEX>)
#   The three accumulating baselines read their own CSV back with inputlookup, which errors on a missing
#   file: header-only seeds for agt_host_history.csv, agt_host_llm_seen.csv and agt_web_proc_pairs.csv
#   ship in ./lookups/ - upload them before the first run.
#   lookups in ./lookups/: llm_api_domains.csv (shipped), agt_scheduled_clients.csv,
#   agt_host_roles.csv, agt_asset_ip.csv, agt_sp_change_actors.csv (yours to fill)
#
# Windows: a rule that judges single events reads exactly one schedule period (for example
# -25m@m to -10m@m every 15 minutes), so an event is written to the risk index once. A rule that
# counts or pairs events across a window has to read further back than it runs, and so reports
# again while its condition holds: R-B-AGT-002, 004, 005, 008, R-D-AGT-003, 017, 018, 019, 020, 028
# and the two chains. Sum risk per rule and entity per window, not per event, as the chains do.
# An earliest= typed inside a search overrides its stanza; a test keeps the two equal.
#
# Status: needs_validation. Every search here is untested against a live Splunk; syntax was
# reviewed by hand. Run each once interactively over 7 days before scheduling.
# ==========================================================================================

# ------------------------------------------------------------------------------------------
# BASELINE BUILDERS (Morpheus: each entity is judged against its own history)
# ------------------------------------------------------------------------------------------

[AGT baseline - HTTP client busiest window]
description = Per client, the most distinct paths it requested in any 10-minute window over the prior 30 days, and how many days it was seen. Feeds R-D-AGT-001's own-baseline condition (port of tc7_http http_distinct_paths_ratio).
enableSched   = 1
cron_schedule = 17 1 * * *
search = | tstats summariesonly=true dc(Web.uri_path) AS paths from datamodel=Web.Web where earliest=-30d@d latest=@d by Web.src _time span=10m \
| rename Web.src AS src \
| eval day = strftime(_time, "%F") \
| stats max(paths) AS peak_paths dc(day) AS baseline_days BY src \
| outputlookup agt_http_client_peak.csv

[AGT baseline - host history]
description = First time each host was seen resolving names and running processes. Warm-up gate (Morpheus _mature): a host younger than 7 days is not judged by novelty rules.
enableSched   = 1
cron_schedule = 23 1 * * *
search = | tstats summariesonly=true min(_time) AS first_seen from datamodel=Network_Resolution.DNS where earliest=-1d@d latest=@d by DNS.src \
| rename DNS.src AS host_key \
| append [| tstats summariesonly=true min(_time) AS first_seen from datamodel=Endpoint.Processes where earliest=-1d@d latest=@d by Processes.dest | rename Processes.dest AS host_key] \
| inputlookup append=t agt_host_history.csv \
| eval first_seen = coalesce(first_seen, host_first_seen) \
| stats min(first_seen) AS host_first_seen BY host_key \
| outputlookup agt_host_history.csv

[AGT baseline - host LLM API contacts]
description = Which LLM API domains each host has already been seen resolving, and since when. Feeds R-B-AGT-004 novelty (ValueNoveltyTracker port). The domain list is a versioned snapshot (Morpheus: external context must be pinned, never live).
enableSched   = 1
cron_schedule = 29 1 * * *
search = | tstats summariesonly=true min(_time) AS first_seen from datamodel=Network_Resolution.DNS where earliest=-1d@d latest=@d by DNS.src DNS.query \
| rename DNS.src AS host_key, DNS.query AS query \
| eval query = lower(query) \
| lookup llm_api_domains.csv llm_domain AS query OUTPUT provider \
| where isnotnull(provider) \
| fields host_key query first_seen \
| inputlookup append=t agt_host_llm_seen.csv \
| stats min(first_seen) AS first_seen BY host_key query \
| outputlookup agt_host_llm_seen.csv

[AGT baseline - web server process pairs]
description = Parent>child pairs each host's web-server processes have produced, with last-seen time. Feeds R-B-AGT-005 (port of tc7_endpoint pair novelty, 30-day memory).
enableSched   = 1
cron_schedule = 35 1 * * *
search = | tstats summariesonly=true max(_time) AS last_seen from datamodel=Endpoint.Processes where earliest=-1d@d latest=@d Processes.parent_process_name IN ("w3wp.exe","httpd.exe","httpd","nginx.exe","nginx","php-cgi.exe","php-fpm","apache2","tomcat9.exe","java.exe","java","node.exe","node") by Processes.dest Processes.parent_process_name Processes.process_name \
| rename Processes.* AS * \
| inputlookup append=t agt_web_proc_pairs.csv \
| stats max(last_seen) AS last_seen BY dest parent_process_name process_name \
| where last_seen >= relative_time(now(), "-30d@d") \
| outputlookup agt_web_proc_pairs.csv

[AGT baseline - identity operation envelope]
description = Per principal and operation, the 99th percentile of daily counts over 30 days. Feeds R-B-AGT-008 (port of tc7_saas bulk-access envelope: > 5x own p99). Source is the Entra audit feed from the Microsoft Cloud Services add-on; field names vary by add-on version, confirm with the discovery search at the bottom.
enableSched   = 1
cron_schedule = 41 1 * * *
search = index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> earliest=-30d@d latest=@d \
| eval actor = lower(coalesce('properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName', 'properties.initiatedBy.app.servicePrincipalId', 'initiatedBy.app.servicePrincipalId', "(unknown)")), op = coalesce(operationName, 'properties.activityDisplayName', activityDisplayName, "(unknown)") \
| bin _time span=1d \
| stats count BY actor op _time \
| stats perc99(count) AS p99_daily dc(_time) AS days BY actor op \
| outputlookup agt_identity_op_envelope.csv

# ------------------------------------------------------------------------------------------
# DETECTIONS
# ------------------------------------------------------------------------------------------

# Port of R-D-L7-005 (Enumeration) with the client judged by user-agent FAMILY and by whether it
# ever loads a page asset. An agent's tools fetch HTML and APIs; a browser fetches CSS/JS/images.
# A crawler (few errors), a broken client (few paths), a scheduled scanner (its own baseline is
# already that high) and a browser user (loads assets) each fail exactly one condition.
[R-D-AGT-001 - Agent-shaped enumeration]
description = One client requesting more than 200 distinct paths in ten minutes, more than 0.7 client errors per success, either a non-browser user-agent family, a forged Chrome header (version with fewer than four parts or no KHTML token, as Wiz recorded from ARTEX), or under 5 percent static assets, and at least twice its own busiest prior window (or under 7 days of history). ARTEX/CAIRN recon tempo (Zscaler ThreatLabz 2026-10-14: high-frequency sequential enumeration of login and search endpoints). ATT&CK T1595.002, T1190.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 1h
search = | tstats summariesonly=true fillnull_value="none" count from datamodel=Web.Web by _time span=10m Web.src Web.dest Web.uri_path Web.status Web.http_user_agent \
| rename Web.* AS * \
| eval n4xx = if(status>=400 AND status<500, count, 0), n2xx = if(status>=200 AND status<300, count, 0), static = if(match(uri_path, "(?i)\.(css|js|png|jpe?g|gif|svg|woff2?|ico)$"), count, 0) \
| eval ua_family = case(match(http_user_agent, "HeadlessChrome"), "headless", match(http_user_agent, "Chrome/") AND (NOT match(http_user_agent, "Chrome/\d+\.\d+\.\d+\.\d+") OR NOT match(http_user_agent, "\(KHTML, like Gecko\)")), "forged-chrome", match(http_user_agent, "^Mozilla/") AND match(http_user_agent, "(Edg|EdgA|Chrome|CriOS|Firefox|FxiOS|Safari)/"), "browser", match(http_user_agent, "^Mozilla/"), "mozilla", isnull(http_user_agent) OR http_user_agent="" OR http_user_agent="none", "none", true(), lower(replace(http_user_agent, "^\s*([A-Za-z][A-Za-z0-9._+-]*).*$", "\1"))) \
| stats dc(uri_path) AS distinct_paths sum(count) AS requests sum(n4xx) AS refusals sum(n2xx) AS successes sum(static) AS static_requests values(ua_family) AS ua_families values(dest) AS dest BY _time src \
| eval static_share = round(static_requests / requests, 3), non_browser = coalesce(mvcount(mvfilter(ua_families!="browser")), 0) \
| where distinct_paths > 200 AND refusals > 0.7 * successes AND (non_browser > 0 OR static_share < 0.05) \
| lookup agt_http_client_peak.csv src OUTPUT peak_paths baseline_days \
| eval baseline_mature = if(coalesce(baseline_days, 0) >= 7, "true", "false"), times_busiest = if(peak_paths > 0, round(distinct_paths / peak_paths, 2), null()) \
| where baseline_mature="false" OR distinct_paths >= 2 * peak_paths \
| mvexpand dest \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval rule_id = "R-D-AGT-001", risk_score = 45, entity_key = src, target_host = coalesce(target_host, dest) \
| table _time rule_id risk_score entity_key src dest target_host distinct_paths requests refusals successes static_share ua_families baseline_mature times_busiest \
| collect index=<RISK_INDEX>

# Port of R-B-L3-002 (Beaconing) onto request timing. Web and auth are combined with union: multisearch
# rejects non-streaming tstats and append truncates, so union is the safe combiner; for a very high-volume
# estate, split this into two scheduled searches, one per datamodel. A rate rule misses the agent that throttles
# itself per target (CSA 2026-10-28; Microsoft saw a spray held to a steady rate). A throttle is a
# timer, and a timer is regular: inter-arrival CV < 0.15 over >= 12 gaps. 1-second bins mean this
# measures paced clients (gaps >= 1 s); bursts inside a second collapse to one arrival.
[R-B-AGT-002 - Machine-regular request cadence]
description = A client whose requests to one destination arrive at a regular interval (coefficient of variation of the gaps under 0.15 over at least 12 gaps in 24 hours), not on the scheduled-client allow-list. Throttled agent recon or spraying. ATT&CK T1595, T1110.003.
enableSched            = 1
cron_schedule          = 7 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time   = @h
alert.suppress         = 1
alert.suppress.fields  = src,dest
alert.suppress.period  = 24h
search = | union [| tstats summariesonly=true count from datamodel=Web.Web by Web.src Web.dest _time span=1s | rename Web.* AS * | eval kind = "web"] [| tstats summariesonly=true count from datamodel=Authentication.Authentication by Authentication.src Authentication.dest _time span=1s | rename Authentication.* AS * | eval kind = "auth"] \
| sort 0 src dest kind _time \
| streamstats current=f last(_time) AS prev_time BY src dest kind \
| eval gap = _time - prev_time \
| stats count AS arrivals avg(gap) AS mean_gap stdevp(gap) AS sd_gap max(_time) AS evt_time BY src dest kind \
| eval intervals = arrivals - 1, interval_cv = if(mean_gap > 0, round(sd_gap / mean_gap, 3), null()) \
| where intervals >= 12 AND interval_cv < 0.15 \
| lookup agt_scheduled_clients.csv src OUTPUT reason AS allow_reason \
| where isnull(allow_reason) \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = evt_time, rule_id = "R-B-AGT-002", risk_score = 40, entity_key = src, target_host = coalesce(target_host, dest), mean_gap_s = round(mean_gap, 1) \
| table _time rule_id risk_score entity_key src dest kind target_host intervals mean_gap_s interval_cv \
| collect index=<RISK_INDEX>

# The fork's tc5_risk counts failure runs per PRINCIPAL only; a spray is one SOURCE touching many
# principals a few times each. DistinctWindowTracker, keyed on src. A brute force (one principal),
# a 9-principal source and a stale-credential service (20 retries each) each fail one condition.
[R-D-AGT-003 - Source-centric password spray]
description = One source failing authentication for at least 10 distinct principals in an hour with no principal failing more than 3 times. Microsoft (Storm-0940 via ARTEX, 2026-10-10..14): 151,000 failures against 327 accounts. ATT&CK T1110.003.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 2h
search = | tstats summariesonly=true count min(_time) AS first_fail from datamodel=Authentication.Authentication where Authentication.action="failure" by Authentication.src Authentication.user \
| rename Authentication.* AS * \
| stats dc(user) AS failing_principals max(count) AS worst_principal_attempts sum(count) AS attempts min(first_fail) AS _time values(user) AS principals BY src \
| where failing_principals >= 10 AND worst_principal_attempts <= 3 \
| eval rule_id = "R-D-AGT-003", risk_score = 50, entity_key = src, principals = mvjoin(mvindex(principals, 0, 49), "|") \
| table _time rule_id risk_score entity_key src failing_principals worst_principal_attempts attempts principals \
| collect index=<RISK_INDEX>

# tc7_service inverted onto egress: the question is not "is this a bad domain" (these are real,
# legitimate APIs) but "has THIS server ever talked to it". A developer workstation, a server
# with a sanctioned integration and a host still in its warm-up each fail one condition.
[R-B-AGT-004 - First LLM API contact from a server]
description = A server resolving an LLM API domain it has never resolved before, after at least 7 days of history. A compromised host being used as agent infrastructure, or an unsanctioned agent install. Zscaler ThreatLabz 2026-10-14 Table 2; CERT-In CIAD-2026-0058. ATT&CK T1102, T1071.001.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = host_key,query
alert.suppress.period  = 24h
search = | tstats summariesonly=true min(_time) AS first_time count from datamodel=Network_Resolution.DNS by DNS.src DNS.query \
| rename DNS.src AS host_key, DNS.query AS query \
| eval query = lower(query) \
| lookup llm_api_domains.csv llm_domain AS query OUTPUT provider \
| where isnotnull(provider) \
| lookup agt_host_llm_seen.csv host_key query OUTPUT first_seen AS known_since \
| where isnull(known_since) \
| lookup agt_host_history.csv host_key OUTPUT host_first_seen \
| where host_first_seen <= relative_time(now(), "-7d") \
| lookup agt_host_roles.csv host_key OUTPUT role \
| where role="server" \
| lookup agt_asset_ip.csv ip AS host_key OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-B-AGT-004", risk_score = 50, entity_key = host_key, target_host = coalesce(target_host, host_key) \
| table _time rule_id risk_score entity_key host_key target_host query provider count \
| collect index=<RISK_INDEX>

# Port of R-B-L7-004 (process ancestry novelty) narrowed to web-server parents. Novelty, not a
# static child list, so an app that legitimately shells out every day is quiet and the first
# cmd.exe/sh from w3wp/php-fpm is not.
[R-B-AGT-005 - Web server spawns a process it never has]
description = A web-server process producing a child it has not produced on this host in 30 days, on a host with at least 7 days of history. Webshell execution after agent-driven upload, SQLi or deserialization (NorForge via GridinSoft 2026-10; CERT-In). ATT&CK T1505.003, T1059.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = dest,parent_process_name,process_name
alert.suppress.period  = 24h
search = | tstats summariesonly=true min(_time) AS first_time values(Processes.process) AS command_lines values(Processes.user) AS users from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("w3wp.exe","httpd.exe","httpd","nginx.exe","nginx","php-cgi.exe","php-fpm","apache2","tomcat9.exe","java.exe","java","node.exe","node") by Processes.dest Processes.parent_process_name Processes.process_name \
| rename Processes.* AS * \
| lookup agt_web_proc_pairs.csv dest parent_process_name process_name OUTPUT last_seen \
| where isnull(last_seen) OR last_seen < relative_time(now(), "-30d") \
| lookup agt_host_history.csv host_key AS dest OUTPUT host_first_seen \
| where host_first_seen <= relative_time(now(), "-7d") \
| eval _time = first_time, rule_id = "R-B-AGT-005", risk_score = 60, entity_key = dest, target_host = dest, command_lines = mvindex(command_lines, 0, 9) \
| table _time rule_id risk_score entity_key target_host parent_process_name process_name command_lines users \
| collect index=<RISK_INDEX>

[R-D-AGT-006 - BLOODALCHEMY side-load]
description = graphics-hook-filter64.dll or graphics-hook_config.bin on disk, or svchost.exe running outside the Windows system directories. VAPOR PANDA follow-on payload after ARTEX access (CrowdStrike via IT Brief UK 2026-10-29). Response to pre-approve: isolate the host (pack's choice). For suspected data exposure CrowdStrike (2026-10-29) recommends a follow-up, not isolation: "Rotate signing keys, preauthentication keys, and service credentials after any suspected data exposure". ATT&CK T1574.001, T1036.005.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true min(_time) AS first_time values(Filesystem.file_path) AS paths values(Filesystem.file_hash) AS hashes from datamodel=Endpoint.Filesystem where Filesystem.file_name IN ("graphics-hook-filter64.dll","graphics-hook_config.bin") by Filesystem.dest Filesystem.file_name \
| rename Filesystem.* AS * \
| append [| tstats summariesonly=true min(_time) AS first_time values(Processes.process_hash) AS hashes from datamodel=Endpoint.Processes where Processes.process_name="svchost.exe" by Processes.dest Processes.process_path | rename Processes.* AS * | where NOT match(lower(process_path), "^c:\\\\windows\\\\(system32|syswow64|winsxs)\\\\") | rename process_path AS paths | eval file_name="svchost.exe (outside system dirs)"] \
| eval _time = first_time, rule_id = "R-D-AGT-006", risk_score = 90, entity_key = dest, target_host = dest \
| table _time rule_id risk_score entity_key target_host file_name paths hashes \
| collect index=<RISK_INDEX>

[R-D-AGT-007 - Zammad session material in error log (CVE-2026-102489)]
description = Zammad Rails error lines carrying a Cookie header or a websocket @clients dump - the indicator DIVD's own log-check script (DIVD-2026-00015, cve-2026-102489_ioc_check_script_v2.sh) searches for. CVE-2026-102489/102490 are in CISA KEV (added 2026-10-02) and were exploited in the AI-agent breach of DIVD (DIVD-2026-00014). ATT&CK T1190, T1539.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -5m@m
search = index=<ZAMMAD_INDEX> sourcetype=<ZAMMAD_SOURCETYPE> earliest=-20m@m "ERROR -- :" ("\"Cookie\"=>" OR "@clients={") \
| regex _raw="ERROR -- :.*(\"Cookie\"=>\"|@clients=\{)" \
| stats count min(_time) AS _time values(source) AS log_files BY host \
| eval rule_id = "R-D-AGT-007", risk_score = 80, entity_key = host, target_host = host \
| table _time rule_id risk_score entity_key target_host count log_files \
| collect index=<RISK_INDEX>

# tc7_saas envelope (> 5x own p99) on identity-plane writes, plus a deterministic floor for the
# operations Storm-0940's agents used for persistence (Microsoft via CSA 2026-10-28).
[R-B-AGT-008 - Identity control-plane writes beyond the actor's envelope]
description = A principal performing an identity-plane write (credential added to an app or service principal, owner added, role assigned, consent granted) more than 5 times its own 30-day daily 99th percentile - or doing it at all when it is not on the approved list. ATT&CK T1098.001, T1098.003, T1078.004.
enableSched            = 1
cron_schedule          = 13 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time   = @h
alert.suppress         = 1
alert.suppress.fields  = actor,op
alert.suppress.period  = 24h
search = index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> earliest=-24h@h latest=@h ("Add service principal credentials" OR "Certificates and secrets management" OR "Add owner to application" OR "Add owner to service principal" OR "Add app role assignment to service principal" OR "Add member to role" OR "Consent to application") \
| eval actor = lower(coalesce('properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName', 'properties.initiatedBy.app.servicePrincipalId', 'initiatedBy.app.servicePrincipalId', "(unknown)")), op = coalesce(operationName, 'properties.activityDisplayName', activityDisplayName, "(unknown)") \
| stats count values('properties.targetResources{}.displayName') AS targets min(_time) AS _time max(_time) AS last_write BY actor op \
| lookup agt_identity_op_envelope.csv actor op OUTPUT p99_daily days \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) OR (coalesce(days, 0) >= 7 AND count > 5 * coalesce(p99_daily, 0)) \
| eval rule_id = "R-B-AGT-008", risk_score = if(isnull(approved), 70, 50), entity_key = actor \
| table _time last_write rule_id risk_score entity_key actor op count p99_daily approved targets \
| collect index=<RISK_INDEX>

[R-D-AGT-009 - AWS control-plane execution and key creation]
description = AWS SSM remote command or session, Lambda code change, or new access key / user / role / inline policy by a principal outside the approved automation list. CERT-In CIAD-2026-0058 (CRAFTY FALCON abusing SSM and Lambda). ATT&CK T1651, T1098.001, T1136.003.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail earliest=-25m@m (eventName IN ("SendCommand","StartSession","CreateAccessKey","CreateUser","CreateLoginProfile","AttachUserPolicy","PutRolePolicy","PutUserPolicy","CreateRole") OR eventName="UpdateFunctionCode*") \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn', 'userIdentity.principalId', "(unknown)") \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) \
| stats count values(eventName) AS actions values(sourceIPAddress) AS src_ips values(userAgent) AS user_agents min(_time) AS _time BY actor \
| eval rule_id = "R-D-AGT-009", risk_score = 70, entity_key = actor \
| table _time rule_id risk_score entity_key actor actions count src_ips user_agents \
| collect index=<RISK_INDEX>

# Port of R-P-L7-010 (slow enumeration trajectory). Watchlist, never a page: a client whose daily
# distinct-path count climbs steadily while staying under R-D-AGT-001's floor - the patient agent.
# Morpheus fits rising runs; this fits a least-squares line (slope, r^2) over 14 daily points.
[R-P-AGT-010 - Slow enumeration trajectory]
description = A client whose daily distinct paths rose on a straight line (r squared at least 0.8, slope at least 10 paths a day) over the last 14 days while never crossing 200 in a 10-minute window. Watchlist entry, not an alert.
enableSched   = 1
cron_schedule = 47 2 * * *
search = | tstats summariesonly=true dc(Web.uri_path) AS paths from datamodel=Web.Web where earliest=-14d@d latest=@d by Web.src _time span=1d \
| rename Web.src AS src \
| eventstats min(_time) AS t0 BY src \
| eval x = (_time - t0) / 86400, y = paths \
| stats count AS n sum(x) AS sx sum(y) AS sy sum(eval(x*y)) AS sxy sum(eval(x*x)) AS sxx sum(eval(y*y)) AS syy max(y) AS peak_day max(_time) AS evt_time BY src \
| where n >= 7 \
| eval slope = (n*sxy - sx*sy) / (n*sxx - sx*sx), r = (n*sxy - sx*sy) / sqrt((n*sxx - sx*sx) * (n*syy - sy*sy)), r2 = round(r*r, 3), slope = round(slope, 1) \
| where slope >= 10 AND r2 >= 0.8 \
| lookup agt_http_client_peak.csv src OUTPUT peak_paths \
| where coalesce(peak_paths, 0) <= 200 \
| eval _time = evt_time, rule_id = "R-P-AGT-010", risk_score = 20, entity_key = src \
| table _time rule_id risk_score entity_key src n slope r2 peak_day peak_paths \
| collect index=<RISK_INDEX>

# ------------------------------------------------------------------------------------------
# CHAINS (Morpheus R-C pattern: ordered, value-joined, alert directly at high priority)
# ------------------------------------------------------------------------------------------

# recon against host H -> web server on H spawns a new child within 2 h -> H makes first LLM-API
# contact (or a BLOODALCHEMY artifact appears) within 24 h. Each step alone has an ordinary
# explanation; the ordered sequence on one host does not. Harness near-misses: out of order,
# other host, egress from a different host, egress after 24 h - all must stay quiet.
[R-C-AGT-001 - Agentic intrusion chain]
description = Ordered on one host: agent-shaped recon against it (R-D-AGT-001, R-B-AGT-002, R-D-AGT-011 agent user-agent, R-D-AGT-015 agent probe), then execution on it within 2 hours (R-B-AGT-005 novel web-server child, R-D-AGT-013 database-written webshell), then within 24 hours first LLM API contact (R-B-AGT-004), an OOB callback (R-D-AGT-016), framework presence (R-D-AGT-014) or a BLOODALCHEMY artifact (R-D-AGT-006). Uses the first occurrence of each step per host. Response to pre-approve: isolate target_host. Microsoft (2026-11-25): "Enable automatic attack disruption to contain compromised assets that an attacker is using".
enableSched            = 1
cron_schedule          = 5,35 * * * *
dispatch.earliest_time = -27h@h
dispatch.latest_time   = now
alert.suppress         = 1
alert.suppress.fields  = target_host
alert.suppress.period  = 24h
search = index=<RISK_INDEX> rule_id IN ("R-D-AGT-001","R-B-AGT-002","R-D-AGT-011","R-D-AGT-015","R-B-AGT-005","R-D-AGT-013","R-B-AGT-004","R-D-AGT-006","R-D-AGT-014","R-D-AGT-016") \
| eval step = case(rule_id IN ("R-D-AGT-001","R-B-AGT-002","R-D-AGT-011","R-D-AGT-015"), 1, rule_id IN ("R-B-AGT-005","R-D-AGT-013"), 2, true(), 3) \
| stats min(eval(if(step=1, _time, null()))) AS t_recon min(eval(if(step=2, _time, null()))) AS t_exec min(eval(if(step=3, _time, null()))) AS t_egress values(eval(if(step=1, entity_key, null()))) AS attacker_src values(rule_id) AS rules BY target_host \
| where t_recon < t_exec AND t_exec <= t_recon + 7200 AND t_egress > t_exec AND t_egress <= t_exec + 86400 \
| eval _time = t_recon, rule_id = "R-C-AGT-001", risk_score = 100, entity_key = target_host \
| table _time rule_id risk_score entity_key target_host attacker_src t_recon t_exec t_egress rules

# spray from S -> a sprayed principal succeeds from S within 1 h -> that principal performs an
# identity-plane write within 4 h. Microsoft: agents ran Graph recon, added app credentials,
# changed roles.
[R-C-AGT-002 - Spray to identity persistence chain]
description = Ordered: a source sprays (R-D-AGT-003), one of the sprayed principals then authenticates successfully from that same source within 1 hour, and that principal performs an identity-plane write (R-B-AGT-008) within 4 hours. Response to pre-approve: disable the user, revoke its sessions and undo the identity-plane write (pack's choice).
enableSched            = 1
cron_schedule          = 20 * * * *
dispatch.earliest_time = -6h@h
dispatch.latest_time   = now
search = index=<RISK_INDEX> rule_id="R-D-AGT-003" \
| fields _time src principals \
| eval principals = split(principals, "|") \
| mvexpand principals \
| rename _time AS t_spray, principals AS user \
| join type=inner max=0 src user [| tstats summariesonly=true count from datamodel=Authentication.Authentication where Authentication.action="success" earliest=-6h by Authentication.src Authentication.user _time span=1m | rename Authentication.* AS *, _time AS t_success | fields src user t_success] \
| where t_success > t_spray AND t_success <= t_spray + 3600 \
| eval user = lower(user) \
| join type=inner max=0 user [search index=<RISK_INDEX> rule_id="R-B-AGT-008" | rename actor AS user, last_write AS t_write | dedup user op | fields user t_write op] \
| where t_write > t_success AND t_write <= t_success + 14400 \
| eval _time = t_spray, rule_id = "R-C-AGT-002", risk_score = 100, entity_key = user \
| table _time rule_id risk_score entity_key user src t_spray t_success t_write op

# ------------------------------------------------------------------------------------------
# COVERAGE / DISCOVERY - run these first (empty = that data model is not feeding the rules)
# ------------------------------------------------------------------------------------------
#   | tstats count from datamodel=Web.Web by index, sourcetype
#   | tstats count from datamodel=Authentication.Authentication by index, sourcetype
#   | tstats count from datamodel=Network_Resolution.DNS by index, sourcetype
#   | tstats count from datamodel=Endpoint.Processes by index, sourcetype
#   | tstats count from datamodel=Endpoint.Filesystem by index, sourcetype
#   | tstats count where index=* sourcetype=aws:cloudtrail by index
#   | tstats count where index=* by index, sourcetype | search sourcetype=*aad* OR sourcetype=*azure*
#   index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> | head 5 | fieldsummary     (confirm actor/op field names)

# ------------------------------------------------------------------------------------------
# PRIMARY-SOURCE INDICATOR RULES (added after the IOC collection; every value verified against
# the saved primary page or the framework's source code - see the reference doc and iocs.csv)
# ------------------------------------------------------------------------------------------

[R-D-AGT-011 - Agent framework user-agent inbound]
description = A request to your estate carrying a user-agent compiled into ARTEX (artex-enrich/1.0, Mozilla/5.0 (spa-api-recon[ spider])), the Norma agent engine (norma/0.4), Hexstrike-AI or CyberStrikeAI. Read from source: BaaRai/ARTEX enrich/enrich.go and skills/api-recon; Autumn-27/norma v0.4.4 tool/webfetch.go; confirmed in the wild by AhnLab and Wiz. Also any user-agent carrying the name ARTEX at the start of a word: F5 Labs (2026-11-23) lists 46 user-agents it tied to ARTEX, made up by the agent per task, and 44 carry the name. Wiz's Black October list (Bitrise, Barracuda) adds a family that declares itself authorized or read-only (pentest-probe, authorized-pentest, authorized-security-research, research-readonly, read-only-audit); a real tester may send such a string, so this alerts and never blocks. Operators can change these, so absence is not safety. ATT&CK T1595.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time   = -5m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 6h
search = | tstats summariesonly=true count min(_time) AS first_time values(Web.url) AS urls from datamodel=Web.Web where (Web.http_user_agent="artex-enrich/*" OR Web.http_user_agent="*spa-api-recon*" OR Web.http_user_agent="norma/*" OR Web.http_user_agent="HexStrike-HTTP-Framework*" OR Web.http_user_agent="HexStrike-BrowserAgent*" OR Web.http_user_agent="*CyberStrikeAI*" OR Web.http_user_agent="PentAGI/*" OR Web.http_user_agent="*security-testing; authorized*" OR Web.http_user_agent="*recon-audit*" OR Web.http_user_agent="*compatible; ArtEx/*" OR Web.http_user_agent="*infra-hunt/*" OR Web.http_user_agent="verify-911-probe/*" OR Web.http_user_agent="*pentest-probe*" OR Web.http_user_agent="*authorized-pentest*" OR Web.http_user_agent="*authorized-security-research*" OR Web.http_user_agent="*research-readonly*" OR Web.http_user_agent="*research; read-only*" OR Web.http_user_agent="*read-only-audit*" OR Web.http_user_agent="*artex*") by Web.src Web.dest Web.http_user_agent \
| rename Web.* AS * \
| where NOT like(lower(http_user_agent), "%artex%") OR match(lower(http_user_agent), "(^|[^a-z])artex($|[^a-z]|probe|bot)") \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-D-AGT-011", risk_score = 60, entity_key = src, target_host = coalesce(target_host, dest), urls = mvindex(urls, 0, 9) \
| table _time rule_id risk_score entity_key src dest target_host http_user_agent count urls \
| collect index=<RISK_INDEX>

[R-D-AGT-012 - Verified IOC sweep]
description = Published indicators from agt_iocs.csv anywhere in your telemetry, in both directions. Egress: a host of yours resolving an indicator domain, connecting to an indicator address (C2, staging and framework servers), or carrying an indicator file hash. Inbound: a request with an indicator user-agent, and - because about half of the published addresses are attacker SOURCES (spray, sign-in, proxy and reconnaissance origins), which the egress legs can never see - an allowed connection, a web request or an authentication whose source is an indicator address. Confidence and context ride along from the lookup. Low-confidence rows (shared VPN, CDN and researcher egress) score 20 on the egress legs and are not matched inbound, where they would fire on ordinary visitors. An authentication that SUCCEEDS from an indicator address scores 15 higher. The lookup holds only the indicator types this search has a leg for; application IDs are watched by hunt H-AGT-016. Sources: CrowdStrike, Microsoft, Wiz, Zscaler, Kaspersky, AhnLab, NorForge, Gambit, PLURA/FSS, Unit 42, S-RM, Check Point Research, Nextron Valhalla, Okta, Expel, Amazon and the later rows named in iocs.csv. Response to pre-approve at 95: revoke the sessions of the account that signed in from the indicator address and reset its credentials (the reset is pack's choice); the artex-global guide names "isolation and session invalidation" as the response to automate. ATT&CK T1071, T1078, T1110, T1190.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = | union \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Network_Resolution.DNS where [| inputlookup agt_iocs.csv | where ioc_type="domain" | eval ioc = mvappend(ioc, "www." . ioc) | mvexpand ioc | rename ioc AS DNS.query | fields DNS.query] by DNS.src DNS.query | rename DNS.src AS src, DNS.query AS ioc | eval seen_in = "dns"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Network_Traffic.All_Traffic where [| inputlookup agt_iocs.csv | where ioc_type="ipv4" | rename ioc AS All_Traffic.dest | fields All_Traffic.dest] by All_Traffic.src All_Traffic.dest | rename All_Traffic.src AS src, All_Traffic.dest AS ioc | eval seen_in = "traffic"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Web.Web where [| inputlookup agt_iocs.csv | where ioc_type="user_agent" | rename ioc AS Web.http_user_agent | fields Web.http_user_agent] by Web.src Web.http_user_agent | rename Web.src AS src, Web.http_user_agent AS ioc | eval seen_in = "user_agent"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Endpoint.Filesystem where [| inputlookup agt_iocs.csv | where ioc_type IN ("sha256","md5") | rename ioc AS Filesystem.file_hash | fields Filesystem.file_hash] by Filesystem.dest Filesystem.file_hash | rename Filesystem.dest AS src, Filesystem.file_hash AS ioc | eval seen_in = "file_hash"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Network_Traffic.All_Traffic where All_Traffic.action="allowed" [| inputlookup agt_iocs.csv | where ioc_type="ipv4" AND confidence!="low" | rename ioc AS All_Traffic.src | fields All_Traffic.src] by All_Traffic.src All_Traffic.dest | rename All_Traffic.dest AS src, All_Traffic.src AS ioc | eval seen_in = "traffic_inbound"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Web.Web where [| inputlookup agt_iocs.csv | where ioc_type="ipv4" AND confidence!="low" | rename ioc AS Web.src | fields Web.src] by Web.src Web.dest | rename Web.dest AS src, Web.src AS ioc | eval seen_in = "web_source"] \
  [| tstats summariesonly=true count min(_time) AS first_time from datamodel=Authentication.Authentication where [| inputlookup agt_iocs.csv | where ioc_type="ipv4" AND confidence!="low" | rename ioc AS Authentication.src | fields Authentication.src] by Authentication.src Authentication.dest Authentication.action | rename Authentication.dest AS src, Authentication.src AS ioc, Authentication.action AS auth_action | eval seen_in = "auth_" . auth_action | fields - auth_action] \
| eval ioc_key = if(seen_in = "user_agent", ioc, lower(replace(ioc, "^www\\.", ""))) \
| lookup agt_iocs.csv ioc AS ioc_key OUTPUT ioc_type confidence context source AS ioc_source \
| where isnotnull(ioc_type) \
| eval _time = first_time, rule_id = "R-D-AGT-012", risk_score = case(confidence="high", 80, confidence="medium", 50, true(), 20) + if(seen_in="auth_success", 15, 0), entity_key = src, target_host = src \
| table _time rule_id risk_score entity_key src seen_in ioc ioc_type confidence context ioc_source count \
| collect index=<RISK_INDEX>

[R-D-AGT-013 - Webshell written by the database server]
description = A database server process (MySQL, MariaDB, PostgreSQL or SQL Server) writing a .jsp/.jspx/.php/.phtml/.asp/.aspx/.ashx/.asmx file - the end state of MySQL general-log poisoning (SET GLOBAL general_log_file to a web path, SET GLOBAL general_log = 1, SELECT a script body), which GTIG observed ARTEX agents use to plant cl1217.jsp-style webshells (GTIG 2026-10-30). Microsoft (2026-11-25) hunts the same write from any database server process; the extension list is Microsoft's, and the process list is Microsoft's, given here as the Windows image names. Windows Sysmon file-create (event 11) only; a Linux database server is covered by the Sentinel rule, not here. The sourcetype is matched in its current form (XmlWinEventLog, with the Sysmon channel as the source) and its legacy one, as hunt H-AGT-040 does. Add the query-log half below if you collect MySQL logs. Response to pre-approve: isolate the database host and take the written file out of the web root (pack's choice). ATT&CK T1505.003, T1190.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time   = -5m@m
search = index=<EDR_INDEX> ((sourcetype=XmlWinEventLog source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational") OR sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational) EventCode=11 (Image="*\\mysqld.exe" OR Image="*\\mariadbd.exe" OR Image="*\\postgres.exe" OR Image="*\\sqlservr.exe") (TargetFilename="*.jsp" OR TargetFilename="*.jspx" OR TargetFilename="*.php" OR TargetFilename="*.phtml" OR TargetFilename="*.aspx" OR TargetFilename="*.asp" OR TargetFilename="*.ashx" OR TargetFilename="*.asmx") \
| append [search index=<MYSQL_INDEX> sourcetype=<MYSQL_QUERY_LOG_SOURCETYPE> "general_log_file" | regex _raw="(?i)set\s+global\s+general_log_file\s*=\s*'[^']*\.(jsp|jspx|php|phtml|aspx|asp|ashx|asmx)'" | eval TargetFilename = "query-log: " . substr(_raw, 1, 200), Image = "mysqld"] \
| stats min(_time) AS _time values(TargetFilename) AS files values(Image) AS writer BY host \
| eval rule_id = "R-D-AGT-013", risk_score = 90, entity_key = host, target_host = host \
| table _time rule_id risk_score entity_key target_host writer files \
| collect index=<RISK_INDEX>

[R-D-AGT-014 - ARTEX or CAIRN running on one of your hosts]
description = Process or file evidence that an agent framework is installed or operating on a host you own (rogue install, or a compromised host turned into agent infrastructure): the artex binary, ARTEX_* configuration in a command line, the artx5v working directory and artex-probe-* files (CrowdStrike, GTIG), a pull or run of a trojanized or unofficial ARTEX Docker image such as tomicdd/artex (Badbyte via The Hacker News 2026-11-05; a host running the backdoored build exposes an unauthenticated root shell), Cairn's worker token variable or worker image (oritera/Cairn dispatch.example.yaml; NorForge). ATT&CK T1588.002, T1059. Also covers the /opt/artex/data/task/ working folder S-RM found on compromised hosts (2026-11-04) and the ScopeWeaver derivative (renamed binary, SCOPEWEAVER_LLM_* variables), the artx- file, systemd unit and pod names Chainstack found (artx-ngx, artx-guard, artx-relay and others; Wiz's Black October list, one victim, so anything of yours named artx- will match too; a command line counts when artx- starts a word, as in the Sentinel rule), and the exp<N>-worker-i<N> session name Wiz (2026-11-25) gives for the agent.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true min(_time) AS first_time values(Processes.process) AS evidence from datamodel=Endpoint.Processes where (Processes.process_name IN ("artex","artex.exe","scopeweaver","scopeweaver.exe") OR Processes.process="*SCOPEWEAVER_LLM_*" OR Processes.process="*/opt/artex/*" OR Processes.process="*ARTEX_LLM_BASE_URL*" OR Processes.process="*ARTEX_PG_DSN*" OR Processes.process="*artx5v*" OR Processes.process="*artex-probe-*" OR Processes.process="*TSEC_AGENT_TOKEN*" OR Processes.process="*cairn-worker-container*" OR Processes.process="*artex-local:*" OR Processes.process="*tomicdd/artex*" OR Processes.process="*congdonglinux/artex*" OR Processes.process="*mianhuatang11/artex*" OR Processes.process="*autumn26/artex*" OR Processes.process="*andy1099zz/artex*" OR Processes.process="*dgddw/artex*" OR Processes.process="*ylh440104/artex*" OR Processes.process="*artx-*" OR Processes.process="*-worker-i*") by Processes.dest \
| rename Processes.dest AS dest \
| eval evidence = mvfilter((NOT like(lower(evidence), "%-worker-i%") AND NOT like(lower(evidence), "%artx-%")) OR match(evidence, "exp\d+-worker-i\d{2,7}") OR match(evidence, "(?i)(^|[^a-z0-9])artx-[a-z0-9]")) \
| where mvcount(evidence) > 0 \
| append [| tstats summariesonly=true min(_time) AS first_time values(Filesystem.file_path) AS evidence from datamodel=Endpoint.Filesystem where (Filesystem.file_name="artex-probe-*" OR Filesystem.file_path="*/opt/artex/data/task/*" OR Filesystem.file_name="scopeweaver*" OR Filesystem.file_path="*\\artx5v\\*" OR Filesystem.file_name="artex-*-*-*.zip" OR Filesystem.file_path="*_ca*mitmproxy-ca-cert.pem" OR Filesystem.file_name="artx-*" OR Filesystem.file_path="*/artx-*") by Filesystem.dest | rename Filesystem.dest AS dest] \
| stats min(first_time) AS _time values(evidence) AS evidence BY dest \
| eval rule_id = "R-D-AGT-014", risk_score = 85, entity_key = dest, target_host = dest, evidence = mvindex(evidence, 0, 9) \
| table _time rule_id risk_score entity_key target_host evidence \
| collect index=<RISK_INDEX>

[R-D-AGT-015 - Agent probe requests (unsigned JWT, junk OAuth, baseline 404)]
description = Requests Wiz recorded Storm-0940's ARTEX agents sending to SSO and OAuth endpoints: a JWT whose header is {"alg":"none"} (base64 eyJhbGciOiJub25l), an OAuth callback with code=AAAA&state=notvalidb64, and the baseline probe /zzz-nonexistent-xyz123 (Wiz 2026-10-22), matched by its shape rather than the literal: zzz-nonexistent or zzz_nonexistent (Datadog 2026-11-09 saw zzz_nonexistent_abc.txt), zzzrandom (Unit 42 2026-10-30), and the SSRF canary path /_i<counter>_probe_missing in Wiz's Black October list (Bitrise). ATT&CK T1190, T1606.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time   = -5m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 6h
search = | tstats summariesonly=true fillnull_value="none" count min(_time) AS first_time values(Web.url) AS urls values(Web.status) AS statuses from datamodel=Web.Web where (Web.url="*eyJhbGciOiJub25l*" OR Web.url="*state=notvalidb64*" OR Web.url="*zzz-nonexistent*" OR Web.url="*zzz_nonexistent*" OR Web.url="*_probe_missing*" OR Web.url="*zzzrandom*") by Web.src Web.dest Web.http_user_agent \
| rename Web.* AS * \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-D-AGT-015", risk_score = 55, entity_key = src, target_host = coalesce(target_host, dest), urls = mvindex(urls, 0, 9) \
| table _time rule_id risk_score entity_key src dest target_host http_user_agent statuses count urls \
| collect index=<RISK_INDEX>

[R-D-AGT-016 - Server calling an out-of-band callback service]
description = A server resolving webhook.site or dnslog.cn - GTIG saw ARTEX agents post command output to 491 rotating webhook.site URLs; Hunt.io found a dnslog.cn callback on actor infrastructure; the FBI (FLASH-20261113-001) reports agents querying api.db-ip.com to geolocate a victim. Unit 42 (2026-11-24) saw a web shell fetched from a paste site, and Wiz's Black October list has collection scripts on paste.rs, a Cloudflare quick tunnel and an sslip.io name used as attacker endpoints. Legitimate services: alert from servers, not a blocklist. Build and test servers use all of these, and some platform tooling gives cluster ingress sslip.io names: exclude those hosts. ATT&CK T1567, T1071, T1614.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true count min(_time) AS first_time values(DNS.query) AS queries from datamodel=Network_Resolution.DNS where (DNS.query="webhook.site" OR DNS.query="*.webhook.site" OR DNS.query="dnslog.cn" OR DNS.query="*.dnslog.cn" OR DNS.query="api.db-ip.com" OR DNS.query="pastebin.com" OR DNS.query="paste.rs" OR DNS.query="*.trycloudflare.com" OR DNS.query="*.sslip.io") by DNS.src \
| rename DNS.src AS host_key \
| lookup agt_host_roles.csv host_key OUTPUT role \
| where role="server" \
| lookup agt_asset_ip.csv ip AS host_key OUTPUT host AS target_host \
| eval _time = first_time, rule_id = "R-D-AGT-016", risk_score = 55, entity_key = host_key, target_host = coalesce(target_host, host_key) \
| table _time rule_id risk_score entity_key target_host queries count \
| collect index=<RISK_INDEX>

[R-D-AGT-017 - Spec-driven API targeting]
description = One source fetches a JavaScript source map, an OpenAPI document or an API docs page and, within two minutes, calls five or more distinct /api/ routes on the same host with no wordlist brute force in between (Unit 42 2026-10-30 ARTEX pattern). ATT&CK T1594, T1595.003.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true min(_time) AS first_time count from datamodel=Web.Web where (Web.url="*.js.map*" OR Web.url="*/openapi.json*" OR Web.url="*/redoc*" OR Web.url="*/docs" OR Web.url="*/docs/*" OR Web.url="*/swagger*" OR Web.url="*/api/*") by Web.src Web.dest Web.url \
| rename Web.src AS src, Web.dest AS dest, Web.url AS url \
| eval kind = if(match(url, "/api/"), "api", "spec") \
| stats min(eval(if(kind="spec", first_time, null()))) AS t_spec min(eval(if(kind="api", first_time, null()))) AS t_api dc(eval(if(kind="api", url, null()))) AS api_urls values(eval(if(kind="spec", url, null()))) AS spec_urls sum(count) AS requests BY src dest \
| where isnotnull(t_spec) AND isnotnull(t_api) AND t_api >= t_spec AND (t_api - t_spec) <= 120 AND api_urls >= 5 \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = t_spec, rule_id = "R-D-AGT-017", risk_score = 60, entity_key = src, target_host = coalesce(target_host, dest), seconds_to_api = t_api - t_spec \
| table _time rule_id risk_score entity_key target_host seconds_to_api api_urls requests spec_urls \
| collect index=<RISK_INDEX>

[R-D-AGT-018 - Canary username then privileged login attempt]
description = A failed login for a canary username (starts with zz, or contains nonexistent or not-a-user) followed within 60 seconds by a login attempt as admin, administrator or root from the same source, whether that attempt fails or succeeds: the agent baselines the error response before trying the real account (Unit 42 2026-10-30). A successful admin login raises the score to 95. Response to pre-approve at 95: reset the administrator account that succeeded and revoke its sessions (pack's choice). ATT&CK T1110.003, T1087.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true count from datamodel=Authentication.Authentication where Authentication.action IN ("failure", "success") by Authentication.src Authentication.dest Authentication.user Authentication.action _time span=1s \
| rename Authentication.src AS src, Authentication.dest AS dest, Authentication.user AS user, Authentication.action AS action \
| eval u = lower(user), kind = case(action="failure" AND (match(u, "^zz") OR match(u, "nonexistent") OR match(u, "not-a-user")), "canary", match(u, "^(admin|administrator|root)(@|$)"), "admin", 1=1, null()) \
| where isnotnull(kind) \
| sort 0 src dest _time -kind \
| streamstats last(eval(if(kind="canary", _time, null()))) AS t_canary last(eval(if(kind="canary", user, null()))) AS canary_user BY src dest \
| where kind="admin" AND isnotnull(t_canary) AND _time >= t_canary AND (_time - t_canary) <= 60 \
| stats min(t_canary) AS t_canary values(canary_user) AS canary_users values(user) AS admin_users max(eval(if(action="success", 1, 0))) AS admin_success BY src dest \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = t_canary, rule_id = "R-D-AGT-018", risk_score = if(admin_success=1, 95, 70), entity_key = src, target_host = coalesce(target_host, dest) \
| table _time rule_id risk_score entity_key target_host canary_users admin_users admin_success \
| collect index=<RISK_INDEX>

[R-D-AGT-019 - Probe-account or disposable-mail identity activity]
description = Sign-in or registration activity for usernames shaped like an agent's probe accounts (i<intent>probe<unix-time>@ and i<intent>canary, where the intent counter runs to two to seven digits because Wiz (2026-11-25) catalogued i49 to i808807, and the pentest-probe and pentestprob names Wiz's Black October list records from the Bitrise incident), shared-mailbox prefixes at your own domain, or API-friendly disposable mail domains (Okta Threat Intelligence 2026-11-06; Expel 2026-10-21 saw five self-registered attacker accounts). Add your IdP's registration events to the Authentication data model or extend the search to its raw index. ATT&CK T1136.003, T1110.004.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -10m@m
search = | tstats summariesonly=true count min(_time) AS first_time values(Authentication.action) AS actions from datamodel=Authentication.Authentication by Authentication.src Authentication.dest Authentication.user \
| rename Authentication.src AS src, Authentication.dest AS dest, Authentication.user AS user \
| eval u = lower(user), local = mvindex(split(u, "@"), 0), domain = mvindex(split(u, "@"), 1) \
| eval probe = if(match(u, "^(i[0-9]{2,7}[-_]?(probe|canary)|pentest[-_]?prob)"), 1, 0), disposable = if(in(domain, "maxxspace.com"), 1, 0), shared = if(in(local, "accounting","admin","billing","careers","compliance","digital","info","investors","ir","legal","marketing","marketoperations","membership","noreply","sales","security","support"), 1, 0) \
| where probe=1 OR disposable=1 OR shared=1 \
| stats sum(count) AS attempts dc(user) AS accounts values(user) AS users min(first_time) AS t_first sum(probe) AS probe_hits sum(disposable) AS disposable_hits sum(shared) AS shared_hits BY src dest \
| where probe_hits > 0 OR disposable_hits > 0 OR accounts >= 3 \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = t_first, rule_id = "R-D-AGT-019", risk_score = 55, entity_key = src, target_host = coalesce(target_host, dest), users = mvindex(users, 0, 19) \
| table _time rule_id risk_score entity_key target_host attempts accounts probe_hits disposable_hits shared_hits users \
| collect index=<RISK_INDEX>

[R-D-AGT-020 - One source signing in as many service principals]
description = One IP authenticating to three or more Entra service principals, or producing invalid/expired-client-secret failures (AADSTS7000215, AADSTS7000222) followed by a success: the shape of the ARTEX exposed-secrets campaign (Microsoft Threat Intelligence 2026-11-05; GitHub scan to Key Vault exfiltration in about five minutes). Reads one hour of Entra service-principal sign-in events in <AAD_INDEX> on each run, so a source that keeps going is reported again; map the field names to your add-on. The error number is read from the result type and the result signature, as hunt H-AGT-022 does, because Microsoft's references disagree on which carries it. Response to pre-approve: block the source in Conditional Access for workload identities; Microsoft (2026-11-05) recommends this for 199.19.77[.]84, as a named location in a Conditional Access policy targeting workload identities, "assigned directly to service principals, and in a user-scoped block policy to cover replayed sessions", and notes that workload identity policies "require Workload ID Premium licensing and cover only single-tenant apps registered in your tenant". A multitenant or vendor-owned application, which the same post saw "compromised at the source (vendor-owned application) and used to access multiple downstream tenants", is out of that policy's scope: for it, rotate or remove the credential and tell the application's owner (pack's choice). ATT&CK T1078.004, T1555.006.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
search = index=<AAD_INDEX> sourcetype=<AAD_SP_SIGNIN_SOURCETYPE> \
| eval ip = coalesce(ipAddress, IPAddress, src), sp = coalesce(servicePrincipalId, ServicePrincipalId), code = tostring(coalesce(resultType, ResultType, 'status.errorCode')), sig = tostring(coalesce(resultSignature, ResultSignature, "")), ok = if(in(code, "0", "Success"), 1, 0) \
| where isnotnull(ip) AND isnotnull(sp) \
| stats dc(sp) AS service_principals count AS attempts sum(eval(if(in(code, "7000215","7000222") OR in(sig, "7000215","7000222"), 1, 0))) AS invalid_secret sum(ok) AS successes min(eval(if(ok=0, _time, null()))) AS t_fail min(eval(if(ok=1, _time, null()))) AS t_success values(sp) AS sps BY ip \
| where service_principals >= 3 OR (invalid_secret > 0 AND successes > 0) \
| eval failure_then_success = if(isnotnull(t_fail) AND isnotnull(t_success) AND t_success > t_fail, "yes", "no") \
| eval _time = coalesce(t_fail, t_success), rule_id = "R-D-AGT-020", risk_score = if(failure_then_success="yes", 85, 60), entity_key = ip, target_host = "entra", sps = mvindex(sps, 0, 9) \
| table _time rule_id risk_score entity_key target_host service_principals attempts invalid_secret successes failure_then_success sps \
| collect index=<RISK_INDEX>

# ------------------------------------------------------------------------------------------
# COVERAGE ADDED 2026-11-25: behaviours the reporting describes and the rules above did not see
# (cloud control plane, Active Directory, post-exploitation tooling, account takeover, credential
# guessing at volume, sequential record walks, burst-and-pause cadence). Each description names
# its source. None has run on a live Splunk; the Windows rules assume the XML event format, whose
# field names are the event's own (TicketEncryptionType, Properties, AttributeLDAPDisplayName).
#
# Each rule reads a window as long as its schedule, so an event is judged once. These rules
# write to the risk index like the others, and no chain rule reads them yet: alert on
# risk_score >= 80 from rule_id R-D-AGT-021 to R-B-AGT-030 until one does. alert.suppress on a
# stanza that ends in collect throttles alert actions only, not what is collected.
#
# agt_sp_change_actors.csv is matched exactly. The actor these rules look up is: the role or
# user ARN as CloudTrail writes it (021, 022); the caller in lower case (023); the account name
# in lower case, without domain (024, 027), or the client address for user enumeration (024).
# ------------------------------------------------------------------------------------------

[R-D-AGT-021 - AWS foothold and exfiltration preparation]
description = A principal outside the approved list launching instances, creating or importing an SSH key pair, allocating an Elastic IP, creating or attaching a volume, or changing an instance profile. GTIG (2026-10-30) and the FBI (FLASH-20261113-001): ARTEX operators generated a key pair, allocated an Elastic IP, launched instances with high-value roles and created a 100 GB volume to stage data. Fires on two or more distinct actions of which at least one is a key pair, an Elastic IP or an instance-profile change: launches and volumes alone are what Auto Scaling, EKS node groups and batch services do all day. Add those services' roles to the approved list anyway. Refused launches and attachments, which is how GTIG's attempts ended, are read by the hunt "An instance profile passed by a principal for the first time". instance_profiles reads the RunInstances and AssociateIamInstanceProfile request paths only: a ReplaceIamInstanceProfileAssociation that gives the profile by name still counts as a foothold action but shows no profile, because no request path for that call has been checked against a logged record. That hunt (H-AGT-049) keeps such a replace as "(not read)"; this rule groups by actor, not by profile, so it needs no fallback. ATT&CK T1578.002, T1098, T1074.002.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail earliest=-25m@m eventName IN ("RunInstances","CreateKeyPair","ImportKeyPair","AllocateAddress","CreateVolume","AttachVolume","AssociateIamInstanceProfile","ReplaceIamInstanceProfileAssociation") NOT errorCode=* \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn', 'userIdentity.principalId', "(unknown)"), instance_profile = coalesce('requestParameters.iamInstanceProfile.arn', 'requestParameters.iamInstanceProfile.name', 'requestParameters.AssociateIamInstanceProfileRequest.IamInstanceProfile.Arn', 'requestParameters.AssociateIamInstanceProfileRequest.IamInstanceProfile.Name'), volume_gb = tonumber('requestParameters.size') \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) \
| eval foothold = if(in(eventName, "CreateKeyPair", "ImportKeyPair", "AllocateAddress", "AssociateIamInstanceProfile", "ReplaceIamInstanceProfileAssociation"), 1, 0) \
| stats dc(eventName) AS distinct_actions sum(foothold) AS foothold_actions values(eventName) AS actions values(instance_profile) AS instance_profiles max(volume_gb) AS largest_volume_gb values(sourceIPAddress) AS src_ips values(userAgent) AS user_agents min(_time) AS _time BY actor \
| where foothold_actions > 0 AND distinct_actions >= 2 \
| eval rule_id = "R-D-AGT-021", risk_score = if(distinct_actions >= 3, 80, 60), entity_key = actor \
| table _time rule_id risk_score entity_key actor distinct_actions actions instance_profiles largest_volume_gb src_ips user_agents \
| collect index=<RISK_INDEX>

[R-D-AGT-022 - AWS permission probing with DryRun]
description = One principal drawing a DryRun or an unauthorized answer for five or more distinct EC2 API actions in fifteen minutes: the agent asking what a stolen key may do. FBI FLASH-20261113-001 ("tested compromised IAM user permissions using DryRun flags"); GTIG's own detection for the same activity keys on GetCallerIdentity, counted here as context. A DryRun call that would have succeeded is logged with errorCode Client.DryRunOperation, and one that would not with Client.UnauthorizedOperation, the same code a refused real call gets; a key with narrow rights shows mostly the second. ATT&CK T1580, T1087.004.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail earliest=-25m@m (errorCode="Client.DryRunOperation" OR errorCode="Client.UnauthorizedOperation" OR eventName="GetCallerIdentity") \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn', 'userIdentity.principalId', "(unknown)"), dry_action = if(errorCode="Client.DryRunOperation" OR errorCode="Client.UnauthorizedOperation", eventName, null()) \
| stats dc(dry_action) AS dry_run_actions values(dry_action) AS actions sum(eval(if(eventName="GetCallerIdentity", 1, 0))) AS identity_checks values(sourceIPAddress) AS src_ips values(userAgent) AS user_agents min(_time) AS _time BY actor \
| where dry_run_actions >= 5 \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) \
| eval rule_id = "R-D-AGT-022", risk_score = 65, entity_key = actor, actions = mvindex(actions, 0, 19) \
| table _time rule_id risk_score entity_key actor dry_run_actions identity_checks actions src_ips user_agents \
| collect index=<RISK_INDEX>

[R-D-AGT-023 - Azure credential-returning operations and Run Command]
description = One caller using three or more distinct Azure operations that hand back credentials (storage account keys, App Service settings and publishing profile, AKS user credentials, Machine Learning connection and datastore secrets), or running a script on a VM with Run Command, or sweeping deployment validation as a permission test. Microsoft (2026-11-05) lists these as what the agents did with leaked application secrets; GTIG (2026-10-30) timed an 8-second deployments/validate sweep across 11 resource types. Operation names are from Microsoft's resource provider reference. Reads the Azure activity log; field names vary by add-on, so the actor, address and operation are read from several: a person is read from the caller, or from the upn and object id claims where the export carries no caller, before the client application id, as hunts H-AGT-032 and H-AGT-043 do, and the address also from httpRequest.clientIpAddress; an operation is counted once by its correlation ID, because the log writes a started and a finished record for each. ATT&CK T1552.001, T1651, T1580.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = index=<AZURE_INDEX> sourcetype=<AZURE_ACTIVITY_SOURCETYPE> earliest=-25m@m ("Microsoft.Storage/storageAccounts/listkeys/action" OR "Microsoft.Web/sites/config/list/action" OR "Microsoft.Web/sites/publishxml/action" OR "Microsoft.ContainerService/managedClusters/listClusterUserCredential/action" OR "Microsoft.MachineLearningServices/workspaces/connections/listsecrets/action" OR "Microsoft.MachineLearningServices/workspaces/datastores/listsecrets/action" OR "Microsoft.Compute/virtualMachines/runCommand/action" OR "Microsoft.Compute/virtualMachineScaleSets/virtualMachines/runCommand/action" OR "Microsoft.Compute/virtualMachines/runCommands/write" OR "Microsoft.Resources/deployments/validate/action") \
| rex field=_raw "identity/claims/upn\"\s*:\s*\"(?<claim_upn>[^\"]+)\"" \
| rex field=_raw "identity/claims/objectidentifier\"\s*:\s*\"(?<claim_oid>[^\"]+)\"" \
| eval op = lower(coalesce('operationName.value', operationName, 'properties.operationName')), actor = lower(coalesce(caller, claim_upn, claim_oid, 'identity.claims.appid', 'claims.appid')), src = coalesce(callerIpAddress, 'httpRequest.clientIpAddress', 'properties.callerIpAddress'), operation_id = coalesce(correlationId, 'properties.correlationId', tostring(_time)) \
| where isnotnull(op) AND isnotnull(actor) \
| eval kind = case(like(op, "%runcommand/action") OR like(op, "%runcommands/write"), "run_command", like(op, "%deployments/validate/action"), "validate", true(), "credential") \
| stats dc(eval(if(kind="credential", op, null()))) AS credential_ops dc(eval(if(kind="run_command", operation_id, null()))) AS run_commands dc(eval(if(kind="validate", operation_id, null()))) AS validations values(op) AS operations values(src) AS src_ips min(_time) AS _time BY actor \
| where credential_ops >= 3 OR run_commands > 0 OR validations >= 8 \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) \
| eval rule_id = "R-D-AGT-023", risk_score = if(run_commands > 0 OR credential_ops >= 3, 80, 55), entity_key = actor, target_host = "azure" \
| table _time rule_id risk_score entity_key target_host credential_ops run_commands validations operations src_ips \
| collect index=<RISK_INDEX>

[R-D-AGT-024 - Active Directory credential attacks]
description = Four shapes the FBI (FLASH-20261113-001) and GTIG (2026-10-30) report from ARTEX operators inside a domain, read from domain controller Security logs: Kerberoasting (one account requesting RC4 service tickets, type 0x17, for ten or more services), user enumeration without pre-authentication (one address drawing "client not found", status 0x6, for twenty or more names), DCSync (a replication right, 1131f6aa or 1131f6ad, exercised by an account that is not a machine account) and a write to msDS-AllowedToActOnBehalfOfOtherIdentity (resource-based constrained delegation). Needs Kerberos service ticket, directory service access and directory service changes auditing. A sync service such as Entra Connect legitimately replicates: add it to the approved list. Response to pre-approve at 95: disable the account that replicated and isolate the host it replicated from (pack's choice). ATT&CK T1558.003, T1589.002, T1003.006, T1134.001.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = index=<WINDOWS_INDEX> sourcetype=XmlWinEventLog source="XmlWinEventLog:Security" earliest=-25m@m ((EventCode=4769 "0x17") OR (EventCode=4768 "0x6") OR (EventCode=4662 ("1131f6aa-9c07-11d1-f79f-00c04fc2dcd2" OR "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2")) OR (EventCode=5136 "msDS-AllowedToActOnBehalfOfOtherIdentity")) \
| eval dollar = printf("%c", 36) \
| eval signal = case(EventCode=4769 AND TicketEncryptionType="0x17" AND substr(ServiceName, -1)!=dollar AND lower(ServiceName)!="krbtgt", "kerberoast", EventCode=4768 AND Status="0x6", "user_enumeration", EventCode=4662 AND match(Properties, "(?i)1131f6a[ad]-9c07-11d1-f79f-00c04fc2dcd2") AND substr(SubjectUserName, -1)!=dollar, "dcsync", EventCode=5136 AND lower(AttributeLDAPDisplayName)="msds-allowedtoactonbehalfofotheridentity", "delegation_write") \
| where isnotnull(signal) \
| eval actor = lower(coalesce(case(signal="user_enumeration", IpAddress, signal="kerberoast", TargetUserName, true(), SubjectUserName), "(unknown)")), item = case(signal="kerberoast", ServiceName, signal="user_enumeration", TargetUserName, signal="delegation_write", ObjectDN, true(), ObjectName) \
| stats dc(item) AS distinct_items count values(IpAddress) AS src_ips values(host) AS domain_controllers min(_time) AS _time BY signal actor \
| where (signal="kerberoast" AND distinct_items >= 10) OR (signal="user_enumeration" AND distinct_items >= 20) OR signal="dcsync" OR signal="delegation_write" \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) \
| eval rule_id = "R-D-AGT-024", risk_score = case(signal="dcsync", 95, signal="delegation_write", 80, signal="kerberoast", 75, true(), 55), entity_key = actor, target_host = mvindex(domain_controllers, 0) \
| table _time rule_id risk_score entity_key target_host signal distinct_items count src_ips \
| collect index=<RISK_INDEX>

[R-D-AGT-025 - Tunnel, remote-access or LLM gateway software on a server]
description = A server running tooling the FBI (FLASH-20261113-001) names in ARTEX intrusions: the Chisel and SoftEther tunnels (and GSocket, which Unit 42 saw relaying on 2026-11-24; matched by gs-netcat, by the names GSocket's installer gives its binary, gs-dbus, gs-db and defunct, and by gsocket or gs-netcat in a command line, as hunt H-AGT-030 does), the AdaptixC2 and vshell remote-access tools, and self-hosted LLM gateway or reseller software (CLIProxyAPI, New API, and the One API family Amazon saw targeted). Matched by process name or command line; the binary names are the projects' own and an operator can rename them, so absence means nothing. VShell is also the name of a commercial SSH server: check before acting. WISP, which the FBI also names, has no known process name and is not matched. Servers only. ATT&CK T1572, T1219, T1588.002.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = dest,process_name
alert.suppress.period  = 24h
search = | tstats summariesonly=true min(_time) AS first_time values(Processes.process) AS command_lines values(Processes.user) AS users from datamodel=Endpoint.Processes where (Processes.process_name IN ("chisel","chisel.exe","vpnserver","vpnserver.exe","vpnserver_x64.exe","vpnbridge","vpnbridge.exe","vpnbridge_x64.exe","vpncmd","vpncmd.exe","vshell","vshell.exe","gs-netcat","gs-netcat.exe","gs-dbus","gs-db","defunct","new-api","new-api.exe","one-api","one-api.exe") OR Processes.process="*softether*" OR Processes.process="*adaptix*" OR Processes.process="*CLIProxyAPI*" OR Processes.process="*cli-proxy-api*" OR Processes.process="*gsocket*" OR Processes.process="*gs-netcat*") by Processes.dest Processes.process_name \
| rename Processes.* AS * \
| lookup agt_host_roles.csv host_key AS dest OUTPUT role \
| where role="server" \
| eval family = case(match(lower(process_name), "^chisel") OR match(lower(mvjoin(command_lines, " ")), "softether") OR match(lower(process_name), "^(vpn(server|bridge|cmd)|gs-netcat|gs-db|defunct)") OR match(lower(mvjoin(command_lines, " ")), "gsocket|gs-netcat"), "tunnel", match(lower(process_name), "^vshell") OR match(lower(mvjoin(command_lines, " ")), "adaptix"), "remote access", true(), "llm gateway") \
| eval _time = first_time, rule_id = "R-D-AGT-025", risk_score = if(family="llm gateway", 60, 80), entity_key = dest, target_host = dest, command_lines = mvindex(command_lines, 0, 4) \
| table _time rule_id risk_score entity_key target_host family process_name command_lines users \
| collect index=<RISK_INDEX>

[R-D-AGT-026 - Database or application server process fetches a tool or opens a shell]
description = A database server process starting a shell or a download tool, or a Python application server starting curl, wget or netcat, or a Python auto-import file appearing outside the interpreter's own directories. GTIG (2026-10-30): execution on a Windows database server "by using native curl to pull down dynamically generated PowerShell and batch scripts". Microsoft (2026-11-06): agents used netcat and curl to download remote-access tools. Amazon (2026-11-20): a Cairn agent wrote sitecustomize.py through an upload flaw and had a training endpoint start a new Python process, which imported it. R-B-AGT-005 covers web-server parents only. PostgreSQL is treated as an application server here, not a database: it starts a shell for every archived log segment, so only a download tool counts. Package installers also write sitecustomize.py inside a virtual environment: read the path. ATT&CK T1059, T1105, T1546.
enableSched            = 1
cron_schedule          = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time   = -5m@m
alert.suppress         = 1
alert.suppress.fields  = dest,parent_process_name,process_name
alert.suppress.period  = 24h
search = | tstats summariesonly=true min(_time) AS first_time values(Processes.process) AS evidence from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("sqlservr.exe","mysqld.exe","mysqld","oracle.exe","redis-server") AND Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","sh","bash","dash","curl","curl.exe","wget","wget.exe","nc","nc.exe","ncat","ncat.exe")) OR ((Processes.parent_process_name="python*" OR Processes.parent_process_name IN ("gunicorn","uvicorn","postgres","postgres.exe")) AND Processes.process_name IN ("curl","curl.exe","wget","wget.exe","nc","nc.exe","ncat","ncat.exe"))) by Processes.dest Processes.parent_process_name Processes.process_name \
| rename Processes.* AS * \
| eval signal = if(match(lower(parent_process_name), "^(python|gunicorn|uvicorn|postgres)"), "application server fetch", "database server child") \
| append [| tstats summariesonly=true min(_time) AS first_time values(Filesystem.file_path) AS evidence from datamodel=Endpoint.Filesystem where Filesystem.file_name IN ("sitecustomize.py","usercustomize.py") Filesystem.action IN ("created","modified") by Filesystem.dest Filesystem.file_name | rename Filesystem.* AS * | eval evidence = mvfilter(NOT match(evidence, "(?i)^(/usr/lib|/usr/lib64|/etc/python|/usr/share|[a-z]:\\\\program files|[a-z]:\\\\python)")) | where mvcount(evidence) > 0 | eval signal = "python auto-import file", process_name = file_name, parent_process_name = "file write"] \
| eval _time = first_time, rule_id = "R-D-AGT-026", risk_score = case(signal="database server child", 85, signal="python auto-import file", 60, true(), 55), entity_key = dest, target_host = dest, evidence = mvindex(evidence, 0, 4) \
| table _time rule_id risk_score entity_key target_host signal parent_process_name process_name evidence \
| collect index=<RISK_INDEX>

[R-D-AGT-027 - Account takeover burst or agent-named account]
description = One account resetting the passwords of five or more others in fifteen minutes, or an account created with the agent's own marker in its name (ArtexProbe, or the pentest-probe account names of the Bitrise incident and the i<N>probe resource name of the Barracuda incident, both as compiled in Wiz's Black October list, and the i<N>canary account name Wiz (2026-11-25) gives for Bitrise). GTIG (2026-10-30): the operators "gained persistence through account takeover (e.g., resetting passwords for identified users), creating multiple accounts with plaintext passwords (which included ArtexProbe in the naming convention), and creating administrator accounts". Domain controller Security events 4724 and 4720, so this is the on-premises directory; the Sentinel rule of the same number reads Entra audit logs. A help desk resets passwords all day: add its accounts to the approved list. Response to pre-approve at 90: disable the account created with the marker and the account that created it (pack's choice). ATT&CK T1098, T1136.002, T1531.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
search = index=<WINDOWS_INDEX> sourcetype=XmlWinEventLog source="XmlWinEventLog:Security" earliest=-25m@m EventCode IN (4724, 4720) \
| eval actor = lower(coalesce(SubjectUserName, "(unknown)")), marked = if(EventCode=4720 AND match(TargetUserName, "(?i)artexprobe|^(i[0-9]{2,7}[-_]?(probe|canary)|pentest[-_]?prob)"), 1, 0), reset_target = if(EventCode=4724, TargetUserName, null()) \
| stats dc(reset_target) AS accounts_reset sum(marked) AS marked_accounts values(eval(if(marked=1, TargetUserName, null()))) AS marked_names values(host) AS domain_controllers min(_time) AS _time BY actor \
| where accounts_reset >= 5 OR marked_accounts > 0 \
| lookup agt_sp_change_actors.csv actor OUTPUT approved \
| where isnull(approved) OR marked_accounts > 0 \
| eval rule_id = "R-D-AGT-027", risk_score = if(marked_accounts > 0, 90, 70), entity_key = actor, target_host = mvindex(domain_controllers, 0) \
| table _time rule_id risk_score entity_key target_host accounts_reset marked_accounts marked_names \
| collect index=<RISK_INDEX>

[R-D-AGT-028 - Credential guessing at volume from one source]
description = One source failing authentication 500 or more times in an hour against 20 or more accounts, on any service in the Authentication data model (SSH, VPN, an admin panel, a portal). Amazon (2026-11-20): Cairn agents "tested more than 30,000 credential combinations" from "about 80 real usernames" against SSH, a storage device, a VPN and a portal. R-D-AGT-003 looks for the opposite shape, many accounts tried at most three times each, and does not fire on this one. ATT&CK T1110.001, T1110.004.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = src
alert.suppress.period  = 2h
search = | tstats summariesonly=true count min(_time) AS first_fail from datamodel=Authentication.Authentication where Authentication.action="failure" by Authentication.src Authentication.user Authentication.app \
| rename Authentication.* AS * \
| stats dc(user) AS accounts sum(count) AS attempts dc(app) AS services values(app) AS apps min(first_fail) AS _time BY src \
| where accounts >= 20 AND attempts >= 500 \
| lookup agt_scheduled_clients.csv src OUTPUT reason AS allow_reason \
| where isnull(allow_reason) \
| eval rule_id = "R-D-AGT-028", risk_score = if(services >= 2, 75, 60), entity_key = src, attempts_per_account = round(attempts / accounts, 0) \
| table _time rule_id risk_score entity_key src accounts attempts attempts_per_account services apps \
| collect index=<RISK_INDEX>

[R-D-AGT-029 - Sequential record walk]
description = One client requesting fifty or more numeric identifiers under one path in fifteen minutes, packed into a range no more than twice as wide (/api/users/1001, /api/users/1002 ...); the identifier is the last numeric segment of the path: the request shape of an insecure direct object reference being harvested. The FBI (FLASH-20261113-001) lists IDOR among the flaws the agents used and asks defenders to "alert on sequential lookups and unusually high numbers of records accessed per session". Density is distinct identifiers over the span they cover; a client paging through its own data in order will also match, so read the path. ATT&CK T1190, T1213.
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -25m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = src,path_template
alert.suppress.period  = 6h
search = | tstats summariesonly=true count min(_time) AS first_time from datamodel=Web.Web where Web.status=200 by Web.src Web.dest Web.uri_path \
| rename Web.* AS * \
| rex field=uri_path "^(?<path_prefix>.*/)(?<object_id>\d{1,12})(?<path_suffix>(?:/[^/\d][^/]*)*/?)$" \
| where isnotnull(object_id) \
| eval object_id = tonumber(object_id), path_template = path_prefix . "{id}" . path_suffix \
| stats dc(object_id) AS distinct_ids min(object_id) AS lowest_id max(object_id) AS highest_id sum(count) AS requests min(first_time) AS _time BY src dest path_template \
| eval density = round(distinct_ids / (highest_id - lowest_id + 1), 2) \
| where distinct_ids >= 50 AND density >= 0.5 \
| lookup agt_scheduled_clients.csv src OUTPUT reason AS allow_reason \
| where isnull(allow_reason) \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval rule_id = "R-D-AGT-029", risk_score = 60, entity_key = src, target_host = coalesce(target_host, dest) \
| table _time rule_id risk_score entity_key src dest target_host path_template distinct_ids lowest_id highest_id density requests \
| collect index=<RISK_INDEX>

# R-B-AGT-002 looks for an even timer. Unit 42 describes the opposite: requests in bursts of 1 to
# 14 at about one a second, then a 25 to 31 second pause while the model thinks. The pauses are
# the regular part, so this measures them alone: gaps of 20 to 40 seconds, at least eight of
# them in an hour, tightly clustered, with at least as many short gaps around them and few gaps
# of any other length. A person reading pages pauses too, but not for the same time every time.
[R-B-AGT-030 - Burst-and-pause request cadence]
description = A client whose requests to one destination come in short bursts separated by pauses of nearly constant length, 20 to 40 seconds: Unit 42 (2026-10-30) recorded ARTEX-derived agents sending 1 to 14 requests at about one a second and then pausing 25 to 31 seconds for model inference. At least eight such pauses in an hour, coefficient of variation under 0.15, and few gaps of other lengths. A page that polls every half minute has the same shape: put it in agt_scheduled_clients.csv. ATT&CK T1595.
enableSched            = 1
cron_schedule          = 17 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time   = -10m@m
alert.suppress         = 1
alert.suppress.fields  = src,dest
alert.suppress.period  = 24h
search = | tstats summariesonly=true count from datamodel=Web.Web by Web.src Web.dest _time span=1s \
| rename Web.* AS * \
| sort 0 src dest _time \
| streamstats current=f last(_time) AS prev_time BY src dest \
| eval gap = _time - prev_time \
| where isnotnull(gap) \
| eval pause = if(gap >= 20 AND gap <= 40, gap, null()) \
| stats count(pause) AS pauses avg(pause) AS mean_pause stdevp(pause) AS sd_pause sum(eval(if(gap <= 2, 1, 0))) AS short_gaps sum(eval(if((gap > 2 AND gap < 20) OR gap > 40, 1, 0))) AS other_gaps max(_time) AS evt_time BY src dest \
| eval pause_cv = if(mean_pause > 0, round(sd_pause / mean_pause, 3), null()) \
| where pauses >= 8 AND short_gaps >= pauses AND other_gaps <= pauses AND pause_cv < 0.15 \
| lookup agt_scheduled_clients.csv src OUTPUT reason AS allow_reason \
| where isnull(allow_reason) \
| lookup agt_asset_ip.csv ip AS dest OUTPUT host AS target_host \
| eval _time = evt_time, rule_id = "R-B-AGT-030", risk_score = 50, entity_key = src, target_host = coalesce(target_host, dest), mean_pause_s = round(mean_pause, 1) \
| table _time rule_id risk_score entity_key src dest target_host pauses mean_pause_s pause_cv short_gaps other_gaps \
| collect index=<RISK_INDEX>
