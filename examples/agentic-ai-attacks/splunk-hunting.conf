# ==========================================================================================
# Agentic-intrusion HUNTS - Splunk. Run ad hoc; nothing here is scheduled (enableSched = 0).
#
# The Splunk side of hunting.kql from H-AGT-032 on: hypotheses taken from reporting published
# 2026-11-23 to 2026-11-25 (Microsoft, Wiz, Unit 42), from Datadog (2026-11-09) and from Google
# (2026-11-02). Each description names its source and quotes it where the wording matters.
# Thresholds are the source's where it gives one. splunk-savedsearches.conf holds the scheduled
# rules; these return rows for a person to read and write nothing to the risk index.
#
# Unit 42 (2026-11-24) recovered no compiled implant from more than ten agent-run campaigns.
# Hashes and malware signatures come back empty; what is left to hunt is behaviour and the names
# an agent gives the things it creates.
#
# Placeholders: <AWS_INDEX>, <AZURE_INDEX>, <AZURE_ACTIVITY_SOURCETYPE>, <AAD_INDEX>,
# <AAD_AUDIT_SOURCETYPE>, <EDR_INDEX>, <WINDOWS_INDEX>, as in splunk-savedsearches.conf.
# H-AGT-045 (the published address list read live) has no Splunk version: load the list as a
# lookup and use R-D-AGT-012.
#
# Status: needs_validation. Untested against a live Splunk. A saved-search line may carry at
# most one dollar sign; see the test that enforces it.
# ==========================================================================================

[H-AGT-032 - Agent self-labels in cloud and directory names]
description = Wiz (2026-11-23, 2026-11-25): the model names what it creates after its task identifier, so the labels turn up in role session names, SSM command comments, bucket, role, policy and security-group names, tags, Azure run-command and VM names and Entra app registrations, and "for denied calls, the names survive in error messages". Shapes: pentest-i and artex-i with the counter, the artx- and csai- prefixes (csai- is CyberStrikeAI), and the counter joined to probe or canary. A bare i<digits> is never matched: "pair i<N> with an anchor before alerting". Delete the clause for a log you do not collect: an unreplaced placeholder breaks the whole search. ATT&CK T1078.004, T1098.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = (index=<AWS_INDEX> sourcetype=aws:cloudtrail) OR (index=<AZURE_INDEX> sourcetype=<AZURE_ACTIVITY_SOURCETYPE>) OR (index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE>) (pentest OR artx OR csai OR artex OR *probe* OR *canary* OR tasks) \
| rex field=_raw "(?i)(?<label>pentest-i\d{2,7}|artex-i\d{2,7}|artex-verify-i\d{2,7}|\bartx-[a-z0-9][a-z0-9_-]*|\bcsai-[a-z0-9][a-z0-9_-]*|\bi\d{2,7}[-_]?(?:probe|canary)|(?:probe|canary)[-_]?i\d{2,7}|tasks/[^/\s\"]+/i\d{2,7})" \
| where isnotnull(label) \
| rex field=label "(?i)(?:^|[^a-z0-9])i(?<counter>\d{2,7})" \
| eval actor = coalesce('userIdentity.arn', 'userIdentity.principalId', caller, 'identity.claims.appid', 'claims.appid', 'properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName', "(unknown)"), src = coalesce(sourceIPAddress, callerIpAddress, 'properties.callerIpAddress', 'properties.initiatedBy.user.ipAddress', 'initiatedBy.user.ipAddress'), op = coalesce(eventName, 'operationName.value', operationName, 'properties.operationName', 'properties.activityDisplayName', activityDisplayName), counter = tonumber(counter) \
| stats count AS events values(label) AS labels min(counter) AS lowest_counter max(counter) AS highest_counter values(src) AS sources values(op) AS operations min(_time) AS first_seen max(_time) AS last_seen BY sourcetype actor \
| sort 0 first_seen \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-033 - CloudWatch Logs searched for secrets]
description = Datadog (2026-11-09): "ARTEX's most frequent action was FilterLogEvents", and "every FilterLogEvents call was set with a limit of 1000 ... That constant shows up across sessions." The published filter patterns look for credentials and data locations. One principal, an hour. A person searching their own logs for "password" matches once; the agent matches for hours. ATT&CK T1552, T1530.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail eventName=FilterLogEvents \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn', 'userIdentity.principalId', "(unknown)"), log_group = coalesce('requestParameters.logGroupName', 'requestParameters.logGroupIdentifier'), pattern = 'requestParameters.filterPattern', at_limit = if(tonumber('requestParameters.limit')=1000, 1, 0), secret_search = if(match(pattern, "(?i)password|AKIA|mongo|presigned|s3://"), 1, 0) \
| bin _time span=1h \
| stats count AS calls sum(at_limit) AS at_limit_1000 sum(secret_search) AS secret_searches dc(log_group) AS log_groups values(pattern) AS patterns values(sourceIPAddress) AS sources BY actor _time \
| where secret_searches > 0 OR (at_limit_1000 >= 20 AND log_groups >= 3) \
| sort 0 - secret_searches - calls

[H-AGT-034 - Self-registration traded for AWS credentials]
description = Datadog (2026-11-09): "registering an account, collecting tokens, trading them for AWS credentials, then enumerating resources." Sign-up errors that change from attempt to attempt as the agent works out what a PreSignUp trigger wants (Datadog saw a custom isAdmin attribute tried), and a session named CognitoIdentityCredentials refused across many different calls. ATT&CK T1136.003, T1078.004, T1580.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail ((eventSource="cognito-idp.amazonaws.com" eventName=SignUp errorCode=*) OR ("CognitoIdentityCredentials" (errorCode="*AccessDenied*" OR errorCode="*Unauthorized*"))) \
| eval half = if(eventName="SignUp" AND eventSource="cognito-idp.amazonaws.com", "sign-up errors that vary per attempt", "identity-pool session refused across many calls"), session = if(half="sign-up errors that vary per attempt", "-", coalesce('userIdentity.arn', "-")), privilege = if(match(_raw, "(?i)isAdmin"), 1, 0) \
| where half="sign-up errors that vary per attempt" OR like(session, "%CognitoIdentityCredentials%") \
| bin _time span=1h \
| stats count AS events dc(errorMessage) AS distinct_errors dc(eventName) AS distinct_actions sum(privilege) AS privilege_attribute values(errorMessage) AS errors values(eventName) AS actions BY half sourceIPAddress session _time \
| where (half="sign-up errors that vary per attempt" AND (distinct_errors >= 3 OR privilege_attribute > 0)) OR (half="identity-pool session refused across many calls" AND events >= 20 AND distinct_actions >= 5) \
| eval errors = mvindex(errors, 0, 9), actions = mvindex(actions, 0, 19) \
| sort 0 - _time

[H-AGT-035 - One AWS session sweeping services and regions]
description = Unit 42 (2026-11-24): after taking instance-role credentials from the metadata service, "the AI agent enumerated 20 AWS services across eight regions". One assumed-role session, ten or more services and four or more regions in half an hour. Calls AWS services make on your behalf are left out. Deployment tools and posture scanners do this too: read the source address and user-agent. The stronger test Datadog and Wiz give, an instance role used from an address that is not AWS, needs your own list of expected egress. ATT&CK T1580, T1552.005.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail userIdentity.type=AssumedRole NOT sourceIPAddress="*.amazonaws.com" \
| fields _time eventSource awsRegion errorCode sourceIPAddress userAgent userIdentity.arn \
| bin _time span=30m \
| stats dc(eventSource) AS services dc(awsRegion) AS regions count AS calls sum(eval(if(isnotnull(errorCode), 1, 0))) AS denied values(eventSource) AS service_list values(sourceIPAddress) AS sources values(userAgent) AS user_agents BY userIdentity.arn _time \
| where services >= 10 AND regions >= 4 \
| eval service_list = mvindex(service_list, 0, 24), user_agents = mvindex(user_agents, 0, 4) \
| sort 0 - services - regions

[H-AGT-036 - A web or application server issuing commands at machine speed]
description = Microsoft (2026-11-25): "Find web and application server processes that start shells or download tools many times within five minutes", ten distinct commands by default. Unit 42 (2026-11-24): "the median inter-command gap dropped to 1.4 seconds" against 23.9 for a person, section headers such as ===[Title]=== in every campaign, and 40 to 100 different Base64 payloads in a session. Parent and child lists are Microsoft's. Build servers that run shells under Java or Node.js will match: exclude them. ATT&CK T1059, T1505.003.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true count from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("w3wp.exe","httpd","httpd.exe","apache2","nginx","nginx.exe","lighttpd","java","java.exe","node","node.exe") OR Processes.parent_process_name="php*" OR Processes.parent_process_name="tomcat*") Processes.process_name IN ("sh","bash","dash","zsh","cmd.exe","powershell.exe","pwsh","pwsh.exe","curl","curl.exe","wget","wget.exe","nc","nc.exe","ncat","ncat.exe","certutil.exe","python","python3","python.exe","perl") by Processes.dest Processes.parent_process_name Processes.process _time span=1s \
| rename Processes.* AS * \
| eval t = _time, header = if(like(process, "%===%"), 1, 0), encoded = if(match(process, "(?i)base64|FromBase64String| -enc"), process, null()) \
| bin _time span=5m \
| stats dc(process) AS distinct_commands sum(count) AS starts sum(eval(header * count)) AS section_headers dc(encoded) AS encoded_payloads min(t) AS first max(t) AS last values(process) AS sample BY dest parent_process_name _time \
| where distinct_commands >= 10 OR section_headers >= 3 OR encoded_payloads >= 10 \
| eval sample = mvindex(sample, 0, 4), seconds_per_command = round((last - first) / starts, 1) \
| fields - first last \
| sort 0 - distinct_commands

[H-AGT-037 - Three or more kinds of secret file in ten minutes]
description = Microsoft (2026-11-25): "Rapid reads of /etc/shadow, .env and configuration files, private keys, and cloud credential files." The file list and the threshold of three kinds per host and account in ten minutes are Microsoft's. Read from command lines, so a tool that opens files without naming them is not seen. One command naming three kinds counts as three. ATT&CK T1552.001, T1003.008.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true count from datamodel=Endpoint.Processes where (Processes.process="*/etc/shadow*" OR Processes.process="*.aws/credentials*" OR Processes.process="*.azure/*" OR Processes.process="*.kube/config*" OR Processes.process="*id_rsa*" OR Processes.process="*id_ecdsa*" OR Processes.process="*id_ed25519*" OR Processes.process="*.git-credentials*" OR Processes.process="*.pgpass*" OR Processes.process="*.my.cnf*" OR Processes.process="*wp-config.php*" OR Processes.process="*web.config*" OR Processes.process="*appsettings.json*" OR Processes.process="*.env*") by Processes.dest Processes.user Processes.process Processes.parent_process_name _time span=1m \
| rename Processes.* AS * \
| eval cmd = lower(process) \
| eval kind = mvappend(if(like(cmd, "%/etc/shadow%"), "shadow", null()), if(like(cmd, "%.aws/credentials%"), "aws credentials", null()), if(like(cmd, "%.azure/%"), "azure profile", null()), if(like(cmd, "%.kube/config%"), "kubeconfig", null()), if(match(cmd, "id_(rsa|ecdsa|ed25519)"), "ssh private key", null()), if(like(cmd, "%.git-credentials%"), "git credentials", null()), if(match(cmd, "\.pgpass|\.my\.cnf"), "database client password", null()), if(match(cmd, "wp-config\.php|web\.config|appsettings\.json"), "application config", null()), if(like(cmd, "%/.env%") OR like(cmd, "% .env%"), "env file", null())) \
| where isnotnull(kind) \
| bin _time span=10m \
| stats dc(kind) AS secret_file_types values(kind) AS kinds values(process) AS commands values(parent_process_name) AS parents BY dest user _time \
| where secret_file_types >= 3 \
| eval commands = mvindex(commands, 0, 9) \
| sort 0 - secret_file_types

[H-AGT-038 - Discovery that looks for the defender first]
description = Unit 42 (2026-11-24): "the agent applied strace to the Microsoft Defender for Endpoint process (wdavdaemon)", ran one find "excluding three different security vendors", and checked "for the presence of 16 different security scanners (nmap, nessus, openvas, nikto, masscan, nuclei, lynis and others)". The first is rare enough to read every hit; the other two are counted (a find with three or more exclusions, a command line naming four or more of the scanners). ATT&CK T1518.001, T1562.001.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true count min(_time) AS first_time from datamodel=Endpoint.Processes where (Processes.process="*wdavdaemon*" OR Processes.parent_process="*wdavdaemon*" OR Processes.process_name="find" OR Processes.process="*nmap*" OR Processes.process="*nuclei*" OR Processes.process="*masscan*" OR Processes.process="*nessus*") by Processes.dest Processes.user Processes.process_name Processes.parent_process_name Processes.parent_process Processes.process \
| rename Processes.* AS * \
| rex field=process max_match=0 "(?<exclusion>(?:-not|!)\s+-(?:path|name)|-prune)" \
| eval cmd = lower(process), exclusions = coalesce(mvcount(exclusion), 0) \
| eval scanners = if(like(cmd, "%nmap%"), 1, 0) + if(like(cmd, "%nessus%"), 1, 0) + if(like(cmd, "%openvas%"), 1, 0) + if(like(cmd, "%nikto%"), 1, 0) + if(like(cmd, "%masscan%"), 1, 0) + if(like(cmd, "%nuclei%"), 1, 0) + if(like(cmd, "%lynis%"), 1, 0) \
| eval signal = case((like(cmd, "%wdavdaemon%") OR like(lower(parent_process), "%wdavdaemon%")) AND in(process_name, "strace", "ltrace", "gdb"), "tracing the endpoint agent", process_name="find" AND exclusions >= 3, "find that skips several directories", scanners >= 4, "inventory of security scanners") \
| where isnotnull(signal) \
| eval _time = first_time \
| table _time dest user signal parent_process_name process \
| sort 0 - _time

[H-AGT-039 - From a pod or a web process to the node and the cloud]
description = Wiz (2026-11-23) names the runtime signs of the Kubernetes escalations it investigated: "privileged container creation, nsenter, IMDS kube-env queries and drifted scripts reaching for cloud credentials", and a userland rootkit loaded through ld.so.preload. Unit 42 (2026-11-24): "When IMDSv1 was blocked, the agent immediately adapted and switched to IMDSv2 token acquisition." Host telemetry only; the privileged pod and the cluster-admin binding are in the cluster's own audit log. ATT&CK T1611, T1552.005, T1574.006.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true min(_time) AS first_time max(_time) AS last_time from datamodel=Endpoint.Processes where (Processes.process_name="nsenter" OR Processes.process="*kube-env*" OR Processes.process="*169.254.169.254*") by Processes.dest Processes.process_name Processes.parent_process_name Processes.process \
| rename Processes.* AS * \
| eval signal = case(process_name="nsenter" AND match(process, "(?:-t\s*|--target[=\s]+)1(?:\s|\z)"), "nsenter into the host", like(process, "%kube-env%"), "node bootstrap secrets requested from the metadata service", like(process, "%169.254.169.254%") AND like(process, "%api/token%"), "metadata service token requested", like(process, "%169.254.169.254%") AND like(process, "%security-credentials%"), "role credentials requested from the metadata service"), evidence = parent_process_name . " > " . process \
| where isnotnull(signal) \
| append [| tstats summariesonly=true min(_time) AS first_time max(_time) AS last_time values(Filesystem.file_path) AS evidence from datamodel=Endpoint.Filesystem where Filesystem.file_name="ld.so.preload" Filesystem.action IN ("created","modified") by Filesystem.dest | rename Filesystem.* AS * | eval signal = "ld.so.preload written"] \
| stats values(signal) AS signals values(evidence) AS evidence min(first_time) AS first_seen max(last_time) AS last_seen BY dest \
| eval evidence = mvindex(evidence, 0, 9), signal_count = mvcount(signals) \
| sort 0 - signal_count - last_seen \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-040 - Web shells sprayed across a Windows web server over SMB]
description = Unit 42 (2026-11-24): "Within two minutes of identifying the Windows IIS server, the agent began deploying ASPX web shells over SMB. Over the next 26 minutes it pushed webshells to more than 40 locations ... uploading custom web.config files to enable script execution." A file that arrives over SMB is created by the System process, not the web server, which is why R-B-AGT-005 and R-D-AGT-013 do not see it. Sysmon file-create events, which many Sysmon configurations do not record for these extensions: check yours. Ten or more folders in half an hour; a site deployed over a share looks the same. ATT&CK T1505.003, T1021.002.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<EDR_INDEX> sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=11 Image="System" (TargetFilename="*.aspx" OR TargetFilename="*.ashx" OR TargetFilename="*.asmx" OR TargetFilename="*.asp" OR TargetFilename="*.php" OR TargetFilename="*.jsp" OR TargetFilename="*.jspx" OR TargetFilename="*\\web.config") \
| rex field=TargetFilename "^(?<folder>.*)\\\\(?<file>[^\\\\]+)" \
| bin _time span=30m \
| stats dc(folder) AS folders dc(file) AS files sum(eval(if(lower(file)="web.config", 1, 0))) AS config_files values(file) AS names values(folder) AS sample_folders BY host _time \
| where folders >= 10 OR (config_files > 0 AND files >= 3) \
| eval names = mvindex(names, 0, 19), sample_folders = mvindex(sample_folders, 0, 9) \
| sort 0 - folders

[H-AGT-041 - One actor adds an application credential and grants a role]
description = Microsoft (2026-11-25): "Find users or applications that both add or change application credentials and assign directory roles or application permissions within an hour." In one case "an application assigned itself the Global Administrator role". R-B-AGT-008 matches these operations one at a time; the pairing by actor is the new part. An actor that pairs once is listed with all of its matching operations in the range; self_grants counts grants whose targets include the actor's own object id. ATT&CK T1098.001, T1098.003.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> ("Add service principal credentials" OR "Certificates and secrets management" OR "Add member to role" OR "Add app role assignment to service principal") \
| eval actor = lower(coalesce('properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName')), actor_id = coalesce('properties.initiatedBy.user.id', 'initiatedBy.user.id', 'properties.initiatedBy.app.servicePrincipalId', 'initiatedBy.app.servicePrincipalId'), op = coalesce(operationName, 'properties.activityDisplayName', activityDisplayName), target = coalesce('properties.targetResources{}.displayName', 'targetResources{}.displayName'), target_id = coalesce('properties.targetResources{}.id', 'targetResources{}.id') \
| eval stage = case(op="Add service principal credentials" OR like(op, "%Certificates and secrets management%"), "credential", op="Add member to role" OR op="Add app role assignment to service principal", "grant") \
| where isnotnull(stage) AND isnotnull(actor) \
| eval self_grant = if(stage="grant" AND isnotnull(actor_id) AND like(mvjoin(target_id, "|"), "%" . actor_id . "%"), 1, 0) \
| sort 0 _time \
| streamstats time_window=1h dc(stage) AS stages_within_hour BY actor \
| eventstats max(stages_within_hour) AS paired BY actor \
| where paired = 2 \
| stats sum(self_grant) AS self_grants values(op) AS operations values(target) AS targets min(_time) AS first_seen max(_time) AS last_seen BY actor \
| sort 0 - self_grants - first_seen \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-042 - Stolen model access on AWS Bedrock]
description = Google GTIG (2026-11-02), from Mandiant's cases. Scoping: ListFoundationModels, ListInferenceProfiles, GetFoundationModelAvailability. Enabling: PutUseCaseForModelAccess, CreateFoundationModelAgreement. Hiding: changes to the model invocation logging configuration. Use: Converse, InvokeModel, InvokeModelWithResponseStream, with "high-volume spikes in ThrottlingException, ValidationException, or ResourceNotFoundException". "Treat any unauthorized enablement as a critical security event." ATT&CK T1496.004, T1562.008.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail eventSource="bedrock.amazonaws.com" eventName IN ("PutUseCaseForModelAccess","CreateFoundationModelAgreement","PutModelInvocationLoggingConfiguration","DeleteModelInvocationLoggingConfiguration","ListFoundationModels","ListInferenceProfiles","GetFoundationModelAvailability","GetModelInvocationLoggingConfiguration","Converse","ConverseStream","InvokeModel","InvokeModelWithResponseStream") \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn'), stage = case(in(eventName, "PutUseCaseForModelAccess", "CreateFoundationModelAgreement"), "enable", in(eventName, "PutModelInvocationLoggingConfiguration", "DeleteModelInvocationLoggingConfiguration"), "logging changed", in(eventName, "Converse", "ConverseStream", "InvokeModel", "InvokeModelWithResponseStream"), "invoke", true(), "scope") \
| bin _time span=1h \
| stats values(stage) AS stages sum(eval(if(stage="invoke", 1, 0))) AS invocations sum(eval(if(stage="invoke" AND in(errorCode, "ThrottlingException", "ValidationException", "ResourceNotFoundException"), 1, 0))) AS invoke_errors dc(awsRegion) AS regions values(sourceIPAddress) AS sources values(userAgent) AS user_agents BY actor _time \
| where isnotnull(mvfind(stages, "enable")) OR isnotnull(mvfind(stages, "logging changed")) OR (isnotnull(mvfind(stages, "scope")) AND invocations >= 100) OR invoke_errors >= 50 \
| sort 0 - invocations

[H-AGT-043 - Stolen model access on Azure]
description = Google GTIG (2026-11-02): "unauthorized creation of new instances via the Microsoft.CognitiveServices/accounts/deployments/write operation", with diagnostic settings read, changed or deleted to hide it. Lists the last day's deployment writes, and diagnostic settings changed or deleted on Cognitive Services accounts, by callers who deployed no model in the 29 days before. Model calls themselves are data-plane and need diagnostic logs. ATT&CK T1496.004, T1562.008.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<AZURE_INDEX> sourcetype=<AZURE_ACTIVITY_SOURCETYPE> "Microsoft.CognitiveServices" ("deployments/write" OR "diagnosticSettings/delete" OR "diagnosticSettings/write") \
| eval op = lower(coalesce('operationName.value', operationName, 'properties.operationName')), actor = lower(coalesce(caller, 'identity.claims.appid', 'claims.appid')), operation_id = coalesce(correlationId, 'properties.correlationId', tostring(_time)) \
| where isnotnull(actor) AND (op="microsoft.cognitiveservices/accounts/deployments/write" OR op="microsoft.insights/diagnosticsettings/delete" OR op="microsoft.insights/diagnosticsettings/write") \
| eval deploy_time = if(op="microsoft.cognitiveservices/accounts/deployments/write", _time, null()) \
| eventstats min(deploy_time) AS first_deploy BY actor \
| where _time >= relative_time(now(), "-1d") AND (isnull(first_deploy) OR first_deploy >= relative_time(now(), "-1d")) \
| stats dc(operation_id) AS operations values(op) AS operation_names values(resourceId) AS resources values(callerIpAddress) AS sources min(_time) AS first_seen max(_time) AS last_seen BY actor \
| sort 0 - operations \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-044 - Certificate requests from a requester not seen before]
description = The FBI (FLASH-20261113-001) asks defenders to "monitor unusual certificate enrollment involving privileged users or unexpected requesting systems"; GTIG (2026-10-30) saw the agents audit certificate templates. Certification authority events 4886 (request received) and 4887 (certificate issued). Lists requester and template pairs whose first appearance in 30 days falls in the last day. The template is in the request attributes only when the client sent it as one; autoenrolment does not. Needs certificate services auditing on the CA. ATT&CK T1649.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<WINDOWS_INDEX> sourcetype=XmlWinEventLog source="XmlWinEventLog:Security" EventCode IN (4886, 4887) \
| rex field=Attributes "CertificateTemplate:(?<template>[^\s<&]+)" \
| eval requester = lower(coalesce(Requester, "(not extracted)")), template = coalesce(template, "(not in request attributes)") \
| stats min(_time) AS first_seen count AS requests sum(eval(if(EventCode=4887, 1, 0))) AS issued values(host) AS certification_authority BY requester template \
| where first_seen >= relative_time(now(), "-1d") \
| sort 0 - issued first_seen \
| convert ctime(first_seen)
