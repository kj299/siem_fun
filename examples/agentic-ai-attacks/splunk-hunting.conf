# ==========================================================================================
# Agentic-intrusion HUNTS - Splunk. Run ad hoc; nothing here is scheduled (enableSched = 0).
#
# The Splunk side of hunting.kql from H-AGT-032 on: hypotheses taken from reporting published
# 2026-11-23 to 2026-11-25 (Microsoft, Wiz, Unit 42), from Datadog (2026-11-09) and from Google
# (2026-11-02). H-AGT-044 rests on the FBI FLASH (2026-11-13) and Google's 2026-10-30 report;
# H-AGT-036 and H-AGT-039 also draw on Wiz (2026-10-29), and H-AGT-042 adds two event names from
# other LLMjacking reports (Permiso, Lacework). Each description names its source and quotes it
# where the wording matters.
# Thresholds are the source's where it gives one. splunk-savedsearches.conf holds the scheduled
# rules; these return rows for a person to read and write nothing to the risk index. Every list,
# pattern and threshold is the one in the KQL hunt of the same number; where Splunk forces a
# difference, the description says so.
#
# Unit 42 (2026-11-24) recovered no compiled implant from more than ten agent-run campaigns.
# Hashes and malware signatures come back empty; what is left to hunt is behaviour and the names
# an agent gives the things it creates.
#
# Placeholders: <AWS_INDEX>, <AZURE_INDEX>, <AZURE_ACTIVITY_SOURCETYPE>, <AAD_INDEX>,
# <AAD_AUDIT_SOURCETYPE>, <EDR_INDEX>, <WINDOWS_INDEX>, as in splunk-savedsearches.conf.
# H-AGT-045 (the published address list read live) has no Splunk version. R-D-AGT-012 is the
# nearest rule once the list is loaded into agt_iocs.csv, but it is not the same hunt: it is a
# scheduled sweep of the last 15 minutes and not a 90-day look back, it leaves low-confidence
# addresses out of its inbound legs, and it sees a listed address as a source only in events
# that reach the Network_Traffic (allowed connections only), Web or Authentication data model,
# which CloudTrail API calls other than sign-ins, and Azure activity records, may not. To look
# back, match the lookup against sourceIPAddress in aws:cloudtrail, the caller address in the
# Azure activity log and the sign-in address, over the range you want.
#
# H-AGT-036 to H-AGT-039 read the accelerated Endpoint data model with summariesonly=true, so they
# see only as far back as that model's summary range, whatever the time range says.
#
# Status: needs_validation. Untested against a live Splunk. A saved-search line may carry at
# most one dollar sign; see the test that enforces it.
# ==========================================================================================

[H-AGT-032 - Agent self-labels in cloud and directory names]
description = Wiz (2026-11-23, 2026-11-25): the model names what it creates after its task identifier, so the labels turn up in role session names, SSM command comments, bucket, role, policy and security-group names, tags, Azure run-command and VM names and Entra app registrations, and "for denied calls, the names survive in error messages". Shapes: the pentest-, artex-, artx- and csai- prefixes, with or without a counter after them (Wiz names "pentest-* workspaces and pods" and artex-verify-*; artx- and its _artx- DNS proof-record labels are in Wiz's indicator file; csai- is CyberStrikeAI), the counter joined to probe or canary, a tasks/<task>/i<N> path and the exp<N>-worker-i<N> session name. Each shape must start the text or follow a character that is not a letter or digit; an underscore counts, so _artx-dnsproof is matched. A bare i<digits> is never matched: "pair i<N> with an anchor before alerting". Counter values seen run from two digits to six; seven are allowed for. The tasks/ path also stops at a double quote, because here the pattern reads raw JSON. Delete the clause for a log you do not collect: an unreplaced placeholder breaks the whole search. ATT&CK T1078.004, T1098.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = (index=<AWS_INDEX> sourcetype=aws:cloudtrail) OR (index=<AZURE_INDEX> sourcetype=<AZURE_ACTIVITY_SOURCETYPE>) OR (index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE>) (pentest OR artx OR csai OR artex OR *probe* OR *canary* OR tasks OR exp*worker*) \
| rex field=_raw "(?i)(?:^|[^a-z0-9])(?<label>(?:pentest|artex|artx|csai)-[a-z0-9][a-z0-9_-]*|i\d{2,7}[-_]?(?:probe|canary)|(?:probe|canary)[-_]?i\d{2,7}|tasks/[^/\s\"]+/i\d{2,7}|exp\d+-worker-i\d{2,7})" \
| where isnotnull(label) \
| eval label = replace(label, "^[^A-Za-z0-9]+", "") \
| rex field=label "(?i)(?:^|[^a-z0-9]|probe|canary)i(?<counter>\d{2,7})" \
| rex field=_raw "identity/claims/upn\"\s*:\s*\"(?<claim_upn>[^\"]+)\"" \
| rex field=_raw "identity/claims/objectidentifier\"\s*:\s*\"(?<claim_oid>[^\"]+)\"" \
| eval actor = coalesce('userIdentity.arn', 'userIdentity.principalId', caller, claim_upn, claim_oid, 'identity.claims.appid', 'claims.appid', 'properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName', "(unknown)"), src = coalesce(sourceIPAddress, callerIpAddress, 'httpRequest.clientIpAddress', 'properties.callerIpAddress', 'properties.initiatedBy.user.ipAddress', 'initiatedBy.user.ipAddress'), op = coalesce(eventName, 'operationName.value', operationName, 'properties.operationName', 'properties.activityDisplayName', activityDisplayName), counter = tonumber(counter) \
| stats count AS events values(label) AS labels min(counter) AS lowest_counter max(counter) AS highest_counter values(src) AS sources values(op) AS operations min(_time) AS first_seen max(_time) AS last_seen BY sourcetype actor \
| sort 0 +first_seen \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-033 - CloudWatch Logs searched for secrets]
description = Datadog (2026-11-09): "ARTEX's most frequent action was FilterLogEvents", and "Every FilterLogEvents call was set with a limit of 1000 ... That constant shows up across sessions." The published filter patterns look for credentials and data locations. One principal, an hour. A person searching their own logs for "password" matches the first condition once; an agent working through log groups matches it call after call. If this returns nothing at all, count FilterLogEvents by managementEvent first to see whether your trail records the call. ATT&CK T1552, T1530.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail eventName=FilterLogEvents \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn', 'userIdentity.principalId', "(unknown)"), log_group = coalesce('requestParameters.logGroupName', 'requestParameters.logGroupIdentifier'), pattern = 'requestParameters.filterPattern', at_limit = if(tonumber('requestParameters.limit')=1000, 1, 0), secret_search = if(match(pattern, "(?i)password|AKIA|mongo|presigned|s3://"), 1, 0) \
| bin _time span=1h \
| stats count AS calls sum(at_limit) AS at_limit_1000 sum(secret_search) AS secret_searches dc(log_group) AS log_groups values(pattern) AS patterns values(sourceIPAddress) AS sources BY actor _time \
| where secret_searches > 0 OR (at_limit_1000 >= 20 AND log_groups >= 3) \
| sort 0 -secret_searches -calls

[H-AGT-034 - Self-registration traded for AWS credentials]
description = Datadog (2026-11-09): "registering an account, collecting tokens, trading them for AWS credentials, then enumerating resources." Sign-up errors that change from attempt to attempt as the agent works out what a PreSignUp trigger wants (Datadog saw a custom isAdmin attribute tried), and a session named CognitoIdentityCredentials refused across many different calls. A sign-up hour with fewer than three distinct errors that names a privilege attribute is labelled as such. ATT&CK T1136.003, T1078.004, T1580.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail ((eventSource="cognito-idp.amazonaws.com" eventName=SignUp errorCode=*) OR ("CognitoIdentityCredentials" (errorCode="*AccessDenied*" OR errorCode="*Unauthorized*"))) \
| eval half = if(eventName="SignUp" AND eventSource="cognito-idp.amazonaws.com", "sign-up errors that vary per attempt", "identity-pool session refused across many calls"), session = if(half="sign-up errors that vary per attempt", "-", coalesce('userIdentity.arn', "-")), privilege = if(match(_raw, "(?i)isAdmin"), 1, 0) \
| where half="sign-up errors that vary per attempt" OR like(session, "%CognitoIdentityCredentials%") \
| bin _time span=1h \
| stats count AS events dc(errorMessage) AS distinct_errors dc(eventName) AS distinct_actions sum(privilege) AS privilege_attribute values(errorMessage) AS errors values(eventName) AS actions BY half sourceIPAddress session _time \
| where (half="sign-up errors that vary per attempt" AND (distinct_errors >= 3 OR privilege_attribute > 0)) OR (half="identity-pool session refused across many calls" AND events >= 20 AND distinct_actions >= 5) \
| eval signal = if(half="sign-up errors that vary per attempt" AND distinct_errors < 3, "sign-up naming a privilege attribute", half), errors = mvindex(errors, 0, 9), actions = mvindex(actions, 0, 19) \
| sort 0 -_time

[H-AGT-035 - One AWS session sweeping services and regions]
description = Unit 42 (2026-11-24): after taking instance-role credentials from the metadata service, "the AI agent enumerated 20 AWS services across eight regions". One assumed-role session, ten or more services and four or more regions in half an hour. Calls AWS services make on your behalf are left out: a source that is a service DNS name or AWS Internal, or a call with an invoking service recorded. Deployment tools and posture scanners do this too: read the source address and user-agent. The stronger test Datadog and Wiz give, an instance role used from an address that is not AWS, needs your own list of expected egress. ATT&CK T1580, T1552.005.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail userIdentity.type=AssumedRole NOT sourceIPAddress="*.amazonaws.com" NOT sourceIPAddress="AWS Internal*" NOT userIdentity.invokedBy=* \
| fields _time eventSource awsRegion errorCode sourceIPAddress userAgent userIdentity.arn \
| bin _time span=30m \
| stats dc(eventSource) AS services dc(awsRegion) AS regions count AS calls sum(eval(if(isnotnull(errorCode), 1, 0))) AS denied values(eventSource) AS service_list values(sourceIPAddress) AS sources values(userAgent) AS user_agents BY userIdentity.arn _time \
| where services >= 10 AND regions >= 4 \
| eval service_list = mvindex(service_list, 0, 24), user_agents = mvindex(user_agents, 0, 4) \
| sort 0 -services -regions

[H-AGT-036 - A web or application server issuing commands at machine speed]
description = Microsoft (2026-11-25): "Find web and application server processes that start shells or download tools many times within five minutes", ten distinct commands by default. Unit 42 (2026-11-24): "the median inter-command gap dropped to 1.4 seconds" against 23.9 for a person, section headers such as ===[Title]=== in every campaign, and 40 to 100 different Base64 payloads in a session. Parent and child lists are Microsoft's, extended with the Windows .exe forms, tomcat, python and python.exe, and with jspawnhelper, the helper through which a JVM starts a shell in one of Wiz's 2026-10-29 cases (java, jspawnhelper, sh). Build servers that run shells under Java or Node.js will match: exclude them. ATT&CK T1059, T1505.003.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true count from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("w3wp.exe","httpd","httpd.exe","apache2","nginx","nginx.exe","lighttpd","java","java.exe","jspawnhelper","node","node.exe") OR Processes.parent_process_name="php*" OR Processes.parent_process_name="tomcat*") Processes.process_name IN ("sh","bash","dash","zsh","cmd.exe","powershell.exe","pwsh","pwsh.exe","curl","curl.exe","wget","wget.exe","nc","nc.exe","ncat","ncat.exe","certutil.exe","python","python3","python.exe","perl") by Processes.dest Processes.parent_process_name Processes.process _time span=1s \
| rename Processes.* AS * \
| eval t = _time, header = if(like(process, "%===%"), 1, 0), encoded = if(match(process, "(?i)base64|FromBase64String| -enc"), process, null()) \
| bin _time span=5m \
| stats dc(process) AS distinct_commands sum(count) AS starts sum(eval(header * count)) AS section_headers dc(encoded) AS encoded_payloads min(t) AS first max(t) AS last values(process) AS sample BY dest parent_process_name _time \
| where distinct_commands >= 10 OR section_headers >= 3 OR encoded_payloads >= 10 \
| eval sample = mvindex(sample, 0, 4), seconds_per_command = round((last - first) / starts, 1) \
| fields - first last \
| sort 0 -distinct_commands

[H-AGT-037 - Three or more kinds of secret file in ten minutes]
description = Microsoft (2026-11-25): "Rapid reads of /etc/shadow, .env and configuration files, private keys, and cloud credential files". The file list, and the threshold of three in ten minutes per host and account, are Microsoft's; the grouping into nine kinds is this pack's. Microsoft counts each of its fourteen names separately, so three SSH key types, or wp-config.php with web.config and appsettings.json, reach its threshold and are one kind here: this hunt needs more variety before it fires. Count the names separately to reproduce Microsoft's query. Microsoft also matches .env anywhere in the line; this hunt needs a slash, a backslash or a space before it, so a name such as =.env or ".env" in quotes is missed. Read from command lines, so a tool that opens files without naming them is not seen. One command naming three kinds counts as three. ATT&CK T1552.001, T1003.008.
enableSched            = 0
dispatch.earliest_time = -14d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true count from datamodel=Endpoint.Processes where (Processes.process="*/etc/shadow*" OR Processes.process="*.aws/credentials*" OR Processes.process="*.azure/*" OR Processes.process="*.kube/config*" OR Processes.process="*id_rsa*" OR Processes.process="*id_ecdsa*" OR Processes.process="*id_ed25519*" OR Processes.process="*.git-credentials*" OR Processes.process="*.pgpass*" OR Processes.process="*.my.cnf*" OR Processes.process="*wp-config.php*" OR Processes.process="*web.config*" OR Processes.process="*appsettings.json*" OR Processes.process="*.env*") by Processes.dest Processes.user Processes.process Processes.parent_process_name _time span=1m \
| rename Processes.* AS * \
| eval cmd = lower(process) \
| eval kind = mvappend(if(like(cmd, "%/etc/shadow%"), "shadow", null()), if(like(cmd, "%.aws/credentials%"), "aws credentials", null()), if(like(cmd, "%.azure/%"), "azure profile", null()), if(like(cmd, "%.kube/config%"), "kubeconfig", null()), if(match(cmd, "id_(rsa|ecdsa|ed25519)"), "ssh private key", null()), if(like(cmd, "%.git-credentials%"), "git credentials", null()), if(match(cmd, "\.pgpass|\.my\.cnf"), "database client password", null()), if(match(cmd, "wp-config\.php|web\.config|appsettings\.json"), "application config", null()), if(like(cmd, "%/.env%") OR like(cmd, "% .env%") OR match(cmd, "\\\\\.env"), "env file", null())) \
| where isnotnull(kind) \
| bin _time span=10m \
| stats dc(kind) AS secret_file_types values(kind) AS kinds values(process) AS commands values(parent_process_name) AS parents BY dest user _time \
| where secret_file_types >= 3 \
| eval commands = mvindex(commands, 0, 9) \
| sort 0 -secret_file_types

[H-AGT-038 - Discovery that looks for the defender first]
description = Unit 42 (2026-11-24): "the agent applied strace to the Microsoft Defender for Endpoint process (wdavdaemon)", ran one find "excluding three different security vendors", and checked "for the presence of 16 different security scanners (nmap, nessus, openvas, nikto, masscan, nuclei, lynis and others)". The first is rare enough to read every hit. The other two are counted: a find with three or more exclusions (a -not or ! before -path, -name, -wholename or -regex, or their case-insensitive -i forms, or a -prune), and one command line naming four or more of the scanners. ATT&CK T1518.001, T1685.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true count min(_time) AS first_time from datamodel=Endpoint.Processes where (Processes.process="*wdavdaemon*" OR Processes.parent_process="*wdavdaemon*" OR Processes.process_name="find" OR Processes.process="*nmap*" OR Processes.process="*nuclei*" OR Processes.process="*masscan*" OR Processes.process="*nessus*") by Processes.dest Processes.user Processes.process_name Processes.parent_process_name Processes.parent_process Processes.process \
| rename Processes.* AS * \
| rex field=process max_match=0 "(?<exclusion>(?:-not|!)\s+-i?(?:path|name|wholename|regex)|-prune)" \
| eval cmd = lower(process), exclusions = coalesce(mvcount(exclusion), 0) \
| eval scanners = if(like(cmd, "%nmap%"), 1, 0) + if(like(cmd, "%nessus%"), 1, 0) + if(like(cmd, "%openvas%"), 1, 0) + if(like(cmd, "%nikto%"), 1, 0) + if(like(cmd, "%masscan%"), 1, 0) + if(like(cmd, "%nuclei%"), 1, 0) + if(like(cmd, "%lynis%"), 1, 0) \
| eval signal = case((like(cmd, "%wdavdaemon%") OR like(lower(parent_process), "%wdavdaemon%")) AND in(process_name, "strace", "ltrace", "gdb"), "tracing the endpoint agent", process_name="find" AND exclusions >= 3, "find that skips several directories", scanners >= 4, "inventory of security scanners") \
| where isnotnull(signal) \
| eval _time = first_time \
| table _time dest user signal parent_process_name process \
| sort 0 -_time

[H-AGT-039 - From a pod or a web process to the node and the cloud]
description = Wiz (2026-11-23) names the runtime signs of the Kubernetes escalations it investigated: "privileged container creation, nsenter, IMDS kube-env queries and drifted scripts reaching for cloud credentials", and a userland rootkit loaded through ld.so.preload. Unit 42 (2026-11-24): "When IMDSv1 was blocked, the agent immediately adapted and switched to IMDSv2 token acquisition". The same credential request on Azure (the managed identity token) and on Google Cloud (the service account token) is matched as well. Wiz (2026-10-29) adds the rest of the ladder (the ECS credential address and the IPv6 metadata address), a wrapper that truncates each command's output to 49152 bytes and posts it back, the service account token read or tested from a shell, a capability check, and port checks against container and cluster control ports. Its self-deleting /tmp script is printed only as a placeholder (.cXXXX.sh), so that arm's shape is inferred from it. One source each: leads, not alerts. Init scripts that read the service account token and ECS entrypoints that call 169.254.170.2 match too. nsenter is matched as -t 1, a bundled form such as -at 1, --target 1 or a /proc/1/ns/ path. The CIM Filesystem model has no rename action, so an ld.so.preload renamed into place, which the KQL hunt sees, is not seen here. Host telemetry only; the privileged pod and the cluster-admin binding are in the cluster's own audit log. ATT&CK T1611, T1552.005, T1574.006.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = | tstats summariesonly=true min(_time) AS first_time max(_time) AS last_time from datamodel=Endpoint.Processes where (Processes.process_name IN ("nsenter","capsh","nc","ncat","netcat") OR Processes.process="*kube-env*" OR Processes.process="*169.254.169.254*" OR Processes.process="*computeMetadata/v1*" OR Processes.process="*169.254.170.2*" OR Processes.process="*fd00:ec2::254*" OR Processes.process="*head -c 49152*" OR Processes.process="*--post-data*" OR Processes.process="*selfsubjectrulesreviews*" OR Processes.process="*serviceaccount/token*" OR Processes.process="*/tmp/.c*") by Processes.dest Processes.process_name Processes.parent_process_name Processes.process \
| rename Processes.* AS * \
| eval cmd = lower(process), pname = lower(process_name) \
| eval signal = case(pname="nsenter" AND match(process, "(?:\s-[a-zA-Z]*t\s*|--target[=\s]+)1(?:\s|\z)|/proc/1/ns/"), "nsenter into the host", like(cmd, "%kube-env%"), "node bootstrap secrets requested from the metadata service", like(cmd, "%169.254.169.254%") AND like(cmd, "%api/token%"), "metadata service token requested", like(cmd, "%169.254.169.254%") AND like(cmd, "%security-credentials%"), "role credentials requested from the metadata service", like(cmd, "%169.254.169.254%") AND like(cmd, "%identity/oauth2/token%"), "managed identity token requested from the metadata service", like(cmd, "%computemetadata/v1%") AND like(cmd, "%service-accounts%") AND like(cmd, "%token%"), "service account token requested from the metadata service", like(cmd, "%169.254.170.2%") OR like(cmd, "%fd00:ec2::254%"), "container or IPv6 credential endpoint requested", like(cmd, "%head -c 49152%") OR (like(cmd, "%--post-data%") AND like(cmd, "%/result/%")), "command output posted back by a beacon wrapper", like(cmd, "%selfsubjectrulesreviews%") OR (like(cmd, "%serviceaccount/token%") AND in(pname, "cat", "curl", "wget", "sh", "bash", "dash")), "service account token read or tested from a shell", pname="capsh" AND like(cmd, "%--print%"), "container capability check", match(process, "/tmp/\.c[0-9A-Za-z]{4,5}\.sh"), "self-deleting script in /tmp", in(pname, "nc", "ncat", "netcat") AND match(process, "\s-[a-z]*z") AND match(process, "\s(?:2375|2376|10250|10255|2379|61678|8200)(?:\s|\z)"), "port check against a container or cluster control port"), evidence = parent_process_name . " > " . process \
| where isnotnull(signal) \
| append [| tstats summariesonly=true min(_time) AS first_time max(_time) AS last_time values(Filesystem.file_path) AS evidence from datamodel=Endpoint.Filesystem where Filesystem.file_name="ld.so.preload" Filesystem.action IN ("created","modified") by Filesystem.dest | rename Filesystem.* AS * | eval signal = "ld.so.preload written"] \
| stats values(signal) AS signals values(evidence) AS evidence min(first_time) AS first_seen max(last_time) AS last_seen BY dest \
| eval evidence = mvindex(evidence, 0, 9), signal_count = mvcount(signals) \
| sort 0 -signal_count -last_seen \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-040 - Web shells sprayed across a Windows web server over SMB]
description = Unit 42 (2026-11-24): "Within two minutes of identifying the Windows IIS server, the agent began deploying ASPX web shells over SMB. Over the next 26 minutes it pushed webshells to more than 40 locations ... uploading custom web.config files to enable script execution." A file that arrives over SMB is created by the System process, so R-D-AGT-013, which looks for the database server as the writer, does not see it, and R-B-AGT-005 can only see the shell later, when the web server runs a command through it. Microsoft (2026-11-25) reports a different habit on the web server itself: "Several short-lived web shells with incrementing names"; its hunt for that reads files written by web or database server processes, which is the ground of the Sentinel hunt H-AGT-013, not of this one. Sysmon file-create events, which many Sysmon configurations do not record for these extensions: check yours. The sourcetype is matched in its current form (XmlWinEventLog, with the Sysmon channel as the source) and its legacy one. Ten or more folders in half an hour, or a web.config written with two or more script files. Sysmon event 11 records neither the SMB protocol nor the remote address the KQL hunt reads, so a site deployed over a share looks the same here and cannot be told apart. ATT&CK T1505.003, T1021.002.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<EDR_INDEX> ((sourcetype=XmlWinEventLog source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational") OR sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational) EventCode=11 Image="System" (TargetFilename="*.aspx" OR TargetFilename="*.ashx" OR TargetFilename="*.asmx" OR TargetFilename="*.asp" OR TargetFilename="*.php" OR TargetFilename="*.jsp" OR TargetFilename="*.jspx" OR TargetFilename="*\\web.config") \
| rex field=TargetFilename "^(?<folder>.*)\\\\(?<file>[^\\\\]+)" \
| bin _time span=30m \
| stats dc(folder) AS folders dc(file) AS files sum(eval(if(lower(file)="web.config", 1, 0))) AS config_files values(file) AS names values(folder) AS sample_folders BY host _time \
| where folders >= 10 OR (config_files > 0 AND files >= 3) \
| eval names = mvindex(names, 0, 19), sample_folders = mvindex(sample_folders, 0, 9) \
| sort 0 -folders

[H-AGT-041 - One actor adds an application credential and grants a role]
description = Microsoft (2026-11-25): "Find users or applications that both add or change application credentials and assign directory roles or application permissions within an hour." In one case "an application assigned itself the Global Administrator role". R-B-AGT-008 matches these operations one at a time; the pairing by actor is the new part. An actor that pairs once is listed with all of its matching operations in the range, where the KQL hunt lists only the credential change and grant pairs; self_grants counts grants whose targets, or the values changed on them, include the actor's own object id. Privileged Identity Management writes its activations under its own name, so they do not pair with a person's credential change. ATT&CK T1098.001, T1098.003.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<AAD_INDEX> sourcetype=<AAD_AUDIT_SOURCETYPE> ("Add service principal credentials" OR "Certificates and secrets management" OR "Add member to role" OR "Add app role assignment to service principal") \
| eval actor = lower(coalesce('properties.initiatedBy.user.userPrincipalName', 'initiatedBy.user.userPrincipalName', 'properties.initiatedBy.app.displayName', 'initiatedBy.app.displayName')), actor_id = coalesce('properties.initiatedBy.user.id', 'initiatedBy.user.id', 'properties.initiatedBy.app.servicePrincipalId', 'initiatedBy.app.servicePrincipalId'), op = coalesce(operationName, 'properties.activityDisplayName', activityDisplayName), target = coalesce('properties.targetResources{}.displayName', 'targetResources{}.displayName'), target_id = mvappend('properties.targetResources{}.id', 'targetResources{}.id', 'properties.targetResources{}.modifiedProperties{}.newValue', 'targetResources{}.modifiedProperties{}.newValue') \
| eval stage = case(op="Add service principal credentials" OR like(op, "%Certificates and secrets management%"), "credential", op="Add member to role" OR op="Add app role assignment to service principal", "grant") \
| where isnotnull(stage) AND isnotnull(actor) \
| eval self_grant = if(stage="grant" AND isnotnull(actor_id) AND like(mvjoin(target_id, "|"), "%" . actor_id . "%"), 1, 0) \
| sort 0 _time \
| streamstats time_window=1h dc(stage) AS stages_within_hour BY actor \
| eventstats max(stages_within_hour) AS paired BY actor \
| where paired = 2 \
| stats sum(self_grant) AS self_grants values(op) AS operations values(target) AS targets min(_time) AS first_seen max(_time) AS last_seen BY actor \
| sort 0 -self_grants -first_seen \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-042 - Stolen model access on AWS Bedrock]
description = Google GTIG (2026-11-02), from Mandiant's cases. Scoping: ListFoundationModels, ListInferenceProfiles, GetFoundationModelAvailability. Enabling: PutUseCaseForModelAccess, CreateFoundationModelAgreement. Hiding: changes to the model invocation logging configuration. Use: Converse, InvokeModel, InvokeModelWithResponseStream, with "high-volume spikes in ThrottlingException, ValidationException, or ResourceNotFoundException". Google says to "treat any unauthorized enablement as a critical security event". PutFoundationModelEntitlement (enabling) and ListFoundationModelAgreementOffers (scoping) are added from other LLMjacking reports (Permiso, Lacework), not from Mandiant. ATT&CK T1496.004, T1685.002.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<AWS_INDEX> sourcetype=aws:cloudtrail eventSource="bedrock.amazonaws.com" eventName IN ("PutUseCaseForModelAccess","CreateFoundationModelAgreement","PutFoundationModelEntitlement","PutModelInvocationLoggingConfiguration","DeleteModelInvocationLoggingConfiguration","ListFoundationModels","ListInferenceProfiles","GetFoundationModelAvailability","GetModelInvocationLoggingConfiguration","ListFoundationModelAgreementOffers","Converse","ConverseStream","InvokeModel","InvokeModelWithResponseStream") \
| eval actor = coalesce('userIdentity.sessionContext.sessionIssuer.arn', 'userIdentity.arn', 'userIdentity.principalId', "(unknown)"), stage = case(in(eventName, "PutUseCaseForModelAccess", "CreateFoundationModelAgreement", "PutFoundationModelEntitlement"), "enable", in(eventName, "PutModelInvocationLoggingConfiguration", "DeleteModelInvocationLoggingConfiguration"), "logging changed", in(eventName, "Converse", "ConverseStream", "InvokeModel", "InvokeModelWithResponseStream"), "invoke", true(), "scope") \
| bin _time span=1h \
| stats values(stage) AS stages sum(eval(if(stage="invoke", 1, 0))) AS invocations sum(eval(if(stage="invoke" AND in(errorCode, "ThrottlingException", "ValidationException", "ResourceNotFoundException"), 1, 0))) AS invoke_errors dc(awsRegion) AS regions values(sourceIPAddress) AS sources values(userAgent) AS user_agents BY actor _time \
| where isnotnull(mvfind(stages, "enable")) OR isnotnull(mvfind(stages, "logging changed")) OR (isnotnull(mvfind(stages, "scope")) AND invocations >= 100) OR invoke_errors >= 50 \
| sort 0 -invocations

[H-AGT-043 - Stolen model access on Azure]
description = Google GTIG (2026-11-02): "unauthorized creation of new instances via the Microsoft.CognitiveServices/accounts/deployments/write operation", with diagnostic settings read, changed or deleted to hide it. Lists the last day's deployment writes, and diagnostic settings changed or deleted on Cognitive Services accounts, by callers who deployed no model in the 29 days before. The 30 days are written into the search, because a shorter range makes every caller look new. A person is read from the caller, or from the upn and object id claims where the export carries no caller, before the client application id. Model calls themselves are data-plane and need diagnostic logs. ATT&CK T1496.004, T1685.002.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<AZURE_INDEX> sourcetype=<AZURE_ACTIVITY_SOURCETYPE> earliest=-30d@d "Microsoft.CognitiveServices" ("deployments/write" OR "diagnosticSettings/delete" OR "diagnosticSettings/write") \
| rex field=_raw "identity/claims/upn\"\s*:\s*\"(?<claim_upn>[^\"]+)\"" \
| rex field=_raw "identity/claims/objectidentifier\"\s*:\s*\"(?<claim_oid>[^\"]+)\"" \
| eval op = lower(coalesce('operationName.value', operationName, 'properties.operationName')), actor = lower(coalesce(caller, claim_upn, claim_oid, 'identity.claims.appid', 'claims.appid')), src = coalesce(callerIpAddress, 'httpRequest.clientIpAddress', 'properties.callerIpAddress'), operation_id = coalesce(correlationId, 'properties.correlationId', tostring(_time)) \
| where isnotnull(actor) AND (op="microsoft.cognitiveservices/accounts/deployments/write" OR op="microsoft.insights/diagnosticsettings/delete" OR op="microsoft.insights/diagnosticsettings/write") \
| eval deploy_time = if(op="microsoft.cognitiveservices/accounts/deployments/write", _time, null()) \
| eventstats min(deploy_time) AS first_deploy BY actor \
| where _time >= relative_time(now(), "-1d") AND (isnull(first_deploy) OR first_deploy >= relative_time(now(), "-1d")) \
| stats dc(operation_id) AS operations values(op) AS operation_names values(resourceId) AS resources values(src) AS sources min(_time) AS first_seen max(_time) AS last_seen BY actor \
| sort 0 -operations \
| convert ctime(first_seen) ctime(last_seen)

[H-AGT-044 - Certificate requests from a requester not seen before]
description = The FBI (FLASH-20261113-001) asks defenders to "monitor unusual certificate enrollment involving privileged users or unexpected requesting systems"; GTIG (2026-10-30) saw the agents audit certificate templates. Certification authority events 4886 (request received) and 4887 (certificate issued). Lists requester and template pairs whose first appearance in 30 days falls in the last day. The template is in the request attributes only when the client sent it as one; autoenrolment does not. The CA ignores case, spaces and hyphens in attribute names, so the name is matched in any case with one space or hyphen allowed between its two words; a name respelled further still gives no template. requests counts event 4886 only. Needs certificate services auditing on the CA and the CA's own Security log in <WINDOWS_INDEX>, which may hold domain controllers only. The 30 days are written into the search, because a shorter range makes every requester look new. ATT&CK T1649.
enableSched            = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time   = now
search = index=<WINDOWS_INDEX> sourcetype=XmlWinEventLog source="XmlWinEventLog:Security" earliest=-30d@d EventCode IN (4886, 4887) \
| rex field=Attributes "(?i)certificate[ -]?template\s*:\s*(?<template>[^\s<&]+)" \
| eval requester = lower(coalesce(Requester, "(not extracted)")), template = coalesce(template, "(not in request attributes)") \
| stats min(_time) AS first_seen sum(eval(if(EventCode=4886, 1, 0))) AS requests sum(eval(if(EventCode=4887, 1, 0))) AS issued values(host) AS certification_authority BY requester template \
| where first_seen >= relative_time(now(), "-1d") \
| sort 0 -issued +first_seen \
| convert ctime(first_seen)
