name: Validate skill pack

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  # A topic branch with no open PR runs nothing, and main can sit untouched for
  # weeks, so nothing would notice runner-image or module drift until the next
  # PR blamed it on that PR's diff. Weekly, Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

# Separate jobs so a validator failure and a Python syntax error each get an
# independent status check, and neither can mask the other.
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The validator parses helper YAML with a real parser instead of regexes.
      #
      # Retried, because PSGallery lookups fail transiently: on 2026-09-02 this
      # exact line returned "No match was found for ... 'powershell-yaml'" on the
      # same runner image that had installed it three days earlier, and that one
      # blip took down the whole job -- validator, unit suite, and mutation
      # harness -- on a docs-only PR. The weekly schedule exists to surface real
      # drift; it should not be indistinguishable from a bad five seconds at
      # PSGallery. Three attempts, short backoff. A genuine failure still fails
      # the job with the last error, and "installed but not importable" is
      # treated as a failure rather than trusting Install-Module's return.
      - name: Install powershell-yaml
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            try {
              Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              if (Get-Module -ListAvailable -Name powershell-yaml) {
                Write-Host "powershell-yaml installed on attempt $i"
                exit 0
              }
              throw "Install-Module returned but the module is not importable"
            } catch {
              Write-Host "Attempt $i of ${attempts} failed: $($_.Exception.Message)"
              if ($i -eq $attempts) { throw }
              Start-Sleep -Seconds (10 * $i)
            }
          }

      - name: Run validator unit tests
        shell: pwsh
        run: ./scripts/tests/validate-skill-pack.tests.ps1

      # Runs even when the unit tests fail so both results are visible.
      - name: Run skill pack validation
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/validate-skill-pack.ps1

      # Proves the REGRESSION tests actually catch their bugs and that every
      # validator check fires. Needs both pwsh and python, so it runs here where
      # powershell-yaml is already installed. Without this the harness would sit
      # in the repo unrun, which is the failure mode it exists to prevent.
      - name: Mutation-check the suites and the validator's checks
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/tests/mutation-check.py

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python helpers
        run: python -m py_compile splunk-data-dictionary-builder/scripts/build_splunk_dictionary.py

      # Runs even when the compile step fails so both results are visible.
      # Uses stdlib unittest, so there is nothing to install.
      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s splunk-data-dictionary-builder/tests -v
