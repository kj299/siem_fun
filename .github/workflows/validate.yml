name: Validate skill pack

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

# Separate jobs so a validator failure and a Python syntax error each get an
# independent status check, and neither can mask the other.
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The validator parses helper YAML with a real parser instead of regexes.
      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber

      - name: Run skill pack validation
        shell: pwsh
        run: ./scripts/validate-skill-pack.ps1

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python helpers
        run: python -m py_compile splunk-data-dictionary-builder/scripts/build_splunk_dictionary.py

      # Runs even when the compile step fails so both results are visible.
      # Uses stdlib unittest, so there is nothing to install.
      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s splunk-data-dictionary-builder/tests -v
